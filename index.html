<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW registration failed:', err));
        });
    }
    let deferredPrompt;
    const banner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.deferredPrompt = e;
        banner.classList.remove('hidden');
        clearTimeout(window.__nhBannerTimer);
        window.__nhBannerTimer = setTimeout(() => banner.classList.add('hidden'), 8000);
    });
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            banner.classList.add('hidden');
        }
    });
    dismissBtn.addEventListener('click', () => { banner.classList.add('hidden'); });
    window.addEventListener('appinstalled', () => { banner.classList.add('hidden'); deferredPrompt = null; });
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
        banner.classList.add('hidden');
    }
</script>

<script type="text/babel">
const{useState,useEffect,useCallback,useMemo,useRef}=React;

const fmtC=a=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0,maximumFractionDigits:0}).format(a);
const fmtD=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const fmtT=d=>new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const genId=()=>Date.now().toString(36)+Math.random().toString(36).substr(2);
const getToday=()=>new Date().toISOString().split('T')[0];
const getMY=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`};
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
const evalAmt=s=>{try{if(!/[+\-*/]/.test(s))return parseFloat(s);if(!/^[\d+\-*/().\s]+$/.test(s)||!/\d/.test(s))return NaN;const r=Function('"use strict";return('+s+')')();return typeof r==='number'&&isFinite(r)?Math.round(r):NaN;}catch(e){return NaN;}};
const mungeSdp=sdp=>{try{return sdp.split(/\r?\n/).filter(line=>{if(!line.startsWith('a=candidate'))return true;const p=line.split(' ');const addr=p[4]||'';return p[2]==='udp'&&addr!==''&&!addr.includes(':');}).join('\r\n');}catch(e){return sdp;}};

const ensureTesseract=()=>new Promise((res,rej)=>{
    if(typeof Tesseract!=='undefined')return res();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('Gagal memuat library OCR. Butuh internet sekali saat pertama dipakai.'));
    document.head.appendChild(s);
});
const normDate=s=>{if(!s)return'';s=String(s).trim();let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;m=s.match(/\b(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2,4})\b/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}return'';};

// 1. Pembersihan Angka (Mengatasi salah baca titik/koma & huruf o/O)
const toNum = n => {
    n = String(n).replace(/rp\.?/gi, '').replace(/\s/g, '').replace(/[oO]/g, '0');
    if (!n) return 0;
    if (n.includes(',') && n.includes('.')) {
        n = n.replace(/\./g, '').replace(',', '.');
    } else if (n.includes(',')) {
        if (/,\d{3}$/.test(n)) n = n.replace(/,/g, ''); 
        else n = n.replace(',', '.'); 
    } else {
        n = n.replace(/\./g, '');
    }
    const v = parseFloat(n);
    return isFinite(v) ? v : 0;
};

// 2. Mesin Penebak Kategori + Auto-Learn Memori
const guessCat = (text, expCats, learnedKw = {}) => {
    const t = String(text).toLowerCase();
    
    // A. Cek dari memori hasil belajar (Auto-Learn) terlebih dahulu
    for (const [word, catId] of Object.entries(learnedKw)) {
        if (t.includes(word)) return catId;
    }

    // B. Cek nama kategori persis
    for (const cat of expCats) {
        if (cat.type === 'expense' && t.includes(cat.name.toLowerCase())) return cat.id;
    }
    
    // C. Pola statis bawaan
    const kwMap = [
        { rx: /(spbu|bensin|pertalite|pertamax|shell|parkir|\btol\b|gojek|grab|krl|mrt|angkot|ojol)/, key: 'transport' },
        { rx: /(kopi|coffee|cafe|starbucks|janji jiwa|kenangan)/, key: 'kopi' },
        { rx: /(resto|restoran|warung|sate|bakso|mie |mcd|kfc|ayam goreng|padang)/, key: 'makan' },
        { rx: /(apotek|apotik|klinik|rumah sakit|rs\.|farmasi|guardian|watsons)/, key: 'kesehatan' },
        { rx: /(pln|listrik|pulsa|telkomsel|token|indihome|bpjs)/, key: 'tagihan' },
        { rx: /(cinema|xxi|cgv|bioskop|netflix|spotify|google play|ovo)/, key: 'hiburan' },
        { rx: /(mart|supermarket|alfamart|indomaret|hypermart|lotte|transmart|grosir|buah)/, key: 'belanja' },
        { rx: /(smk|sma|smp|sd|sekolah|spp|universitas|kampus|yayasan)/, key: 'pendidikan' }
    ];
    
    for (const kw of kwMap) {
        if (kw.rx.test(t)) {
            const matched = expCats.find(c => c.type === 'expense' && (c.id === kw.key || c.name.toLowerCase().includes(kw.key)));
            if (matched) return matched.id;
        }
    }
    return '';
};

// 3. Ekstraksi Data Utama + Logika Validasi Matematika
const parseReceipt = (text, expCats, learnedKw = {}) => {
    const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
    let amount = 0;
    
    // A. Kumpulkan semua angka valid > 100 rupiah
    const allNumbers = [];
    const numRegex = /[\d.,]+/g;
    for (const line of lines) {
        const matches = line.replace(/rp\.?/gi, '').match(numRegex);
        if (matches) {
            matches.forEach(m => {
                const val = toNum(m);
                if (val > 100) allNumbers.push(val);
            });
        }
    }
    
    // B. Cari relasi Matematika (Tunai - Kembali = Total Belanja)
    let mathTotal = 0;
    const sortedNums = [...new Set(allNumbers)].sort((a, b) => b - a);
    for (let i = 0; i < sortedNums.length; i++) {
        for (let j = i + 1; j < sortedNums.length; j++) {
            const diff = sortedNums[i] - sortedNums[j];
            if (diff > 0 && sortedNums.includes(diff)) {
                mathTotal = Math.max(mathTotal, diff);
            }
        }
    }
    
    // C. Fallback pencarian teks konvensional
    let regexTotal = 0;
    const totalRx = /(total|amount|jumlah|grand|bayar)[^\d]{0,20}([\d.,\s]+)/i;
    for (const line of lines) {
        if (totalRx.test(line)) {
            const nums = line.replace(/rp\.?/gi, '').match(/[\d.,]+/g) || [];
            const mx = Math.max(...nums.map(toNum), 0);
            if (mx > regexTotal) regexTotal = mx;
        }
    }
    
    // D. Penentuan nilai akhir (Matematika diutamakan)
    amount = mathTotal > 0 ? mathTotal : regexTotal;
    if (!amount && sortedNums.length > 1) amount = sortedNums[1];
    else if (!amount && sortedNums.length > 0) amount = sortedNums[0];

    const note = (lines.find(l => l.length > 3 && !/(cabang|alamat|telp|kota|npwp|gst|vat|no\.|nomor)/i.test(l)) || 'Scan struk').slice(0, 40);
    return { amount: Math.round(amount), date: normDate(text) || getToday(), note, category: guessCat(text, expCats, learnedKw) };
};

const fieldVal=f=>{if(!f)return null;if(f.value!==undefined&&f.value!==null)return f.value;if(f.data&&f.data.value!==undefined&&f.data.value!==null)return f.data.value;if(typeof f.data==='string'||typeof f.data==='number')return f.data;return null;};

const runOcr = async (blob, provider, apiKey, expCats, learnedKw, onProg) => {
    if (provider !== 'offline' && apiKey && navigator.onLine) {
        try {
            const fd = new FormData();
            if (provider === 'taggun') {
                onProg(10, 'Mengirim ke Taggun...');
                fd.append('file', blob, 'struk.jpg'); fd.append('incognito', 'true');
                const r = await fetch('https://api.taggun.io/api/receipt/v1/scan', { method: 'POST', headers: { apikey: apiKey }, body: fd });
                if (!r.ok) throw new Error('Taggun error ' + r.status);
                const j = await r.json();
                const amount = fieldVal(j.totalAmount) || 0;
                const dt = normDate(fieldVal(j.date)) || getToday();
                const note = String(fieldVal(j.merchantName) || 'Scan struk').slice(0, 40);
                return { amount: Math.round(amount), date: dt, note, category: guessCat(note, expCats, learnedKw) };
            }
            onProg(10, 'Mengirim ke Mindee...');
            fd.append('document', blob, 'struk.jpg');
            const r = await fetch('https://api.mindee.net/v1/products/mindee/expense_receipts/v5/predict', { method: 'POST', headers: { Authorization: 'Token ' + apiKey }, body: fd });
            if (!r.ok) throw new Error('Mindee error ' + r.status);
            const j = await r.json();
            const p = ((((j.document || {}).inference || {}).prediction) || {});
            const amount = fieldVal(p.total_amount) || 0;
            const dt = normDate(fieldVal(p.date)) || getToday();
            const note = String(fieldVal(p.supplier_name) || 'Scan struk').slice(0, 40);
            return { amount: Math.round(amount), date: dt, note, category: guessCat(note + ' ' + JSON.stringify(p), expCats, learnedKw) };
        } catch (e) { onProg(null, (e && e.message ? e.message : 'API gagal') + ' — beralih ke OCR offline...'); }
    }
    
    if (provider === 'offline' || !navigator.onLine) {
        onProg(5, 'Mengunduh mesin OCR (~5MB)... Mohon tunggu.');
    } else {
        onProg(5, 'Menyiapkan mesin OCR...');
    }
    await ensureTesseract();
    
    const res = await Tesseract.recognize(blob, 'ind+eng', { logger: m => {
        if (m.status === 'recognizing text') onProg(10 + Math.round(m.progress * 85), 'Membaca teks struk...');
        else if (m.status) onProg(null, 'OCR: ' + m.status);
    } });
    return parseReceipt(res.data.text, expCats, learnedKw);
};

const triggerHaptic = () => { if (navigator.vibrate) navigator.vibrate(50); };

function useLS(k,v){
    const[s,set]=useState(()=>{try{const i=localStorage.getItem(k);return i?JSON.parse(i):v}catch{return v}});
    const sv=val=>{try{const x=val instanceof Function?val(s):val;set(x);localStorage.setItem(k,JSON.stringify(x))}catch{}};
    return[s,sv];
}

function fireConfetti(){
    const container=document.getElementById('confettiContainer');
    const colors=['#fbbf24','#f59e0b','#3b82f6','#8b5cf6','#ef4444','#10b981','#ec4899'];
    for(let i=0;i<60;i++){
        const c=document.createElement('div');
        c.className='confetti';
        c.style.left=Math.random()*100+'%';
        c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDelay=Math.random()*0.5+'s';
        c.style.animationDuration=(2+Math.random()*2)+'s';
        c.style.width=(6+Math.random()*8)+'px';
        c.style.height=(6+Math.random()*8)+'px';
        c.style.borderRadius=Math.random()>.5?'50%':'2px';
        container.appendChild(c);
    }
    setTimeout(()=>{container.innerHTML=''},4000);
}

    Pin:()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>,

    Alert:()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
    Flame:()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>,

    Building:()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><line x1="8" y1="6" x2="8.01" y2="6"/><line x1="16" y1="6" x2="16.01" y2="6"/><line x1="12" y1="6" x2="12.01" y2="6"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="16" y1="10" x2="16.01" y2="10"/><line x1="12" y1="10" x2="12.01" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/></svg>,
    Phone:()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>,
    Handshake:()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>,
    Star:()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
    Transfer:()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 10h14l-4-4"/><path d="M17 14H3l4 4"/></svg>,
    Trophy:()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
    Cam:()=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
};

function CatBadge({cat,size='md'}){
    const letter=cat?.name?.charAt(0)?.toUpperCase()||'?';
    const sz={sm:'w-6 h-6 text-[10px]',md:'w-8 h-8 text-xs',lg:'w-10 h-10 text-sm'};
    return <div className={`${sz[size]} rounded-lg flex items-center justify-center font-bold text-white shrink-0`} style={{backgroundColor:cat?.color||'#6b7280'}}>{letter}</div>;
}

function WalletIcon({type}){
    if(type==='cash') return <I.Wallet/>;
    if(type==='bank') return <I.Building/>;
    return <I.Phone/>;
}

function SwipeItem({children,onDel}){
    const[off,setOff]=useState(0);const[drag,setDrag]=useState(false);const sx=useRef(0);const TH=70;
    const ts=e=>{e.stopPropagation(); sx.current=e.touches[0].clientX;setDrag(true)};
    const tm=e=>{e.stopPropagation(); if(!drag)return;const d=e.touches[0].clientX-sx.current;if(d<0)setOff(Math.max(d,-TH-30))};
    const te=e=>{e.stopPropagation(); setDrag(false);if(off<-TH)setOff(-TH);else setOff(0)};
    return(
        <div className="swipe-wrap">
            <div className="swipe-bg bg-red-600 rounded-r-xl">
                <button onClick={(e)=>{e.stopPropagation(); onDel();}} className="text-white text-xs font-semibold px-3 py-1 rounded bg-red-700">Hapus</button>
            </div>
            <div className={`swipe-fg bg-dark-700 rounded-xl ${drag?'dragging':''}`} style={{transform:`translateX(${off}px)`}} onTouchStart={ts} onTouchMove={tm} onTouchEnd={te}>
                {children}
            </div>
        </div>
    );
}

const DEF_WALLETS=[{id:'w1',name:'Cash',type:'cash',balance:0},{id:'w2',name:'Bank Utama',type:'bank',balance:0},{id:'w3',name:'E-Wallet',type:'ewallet',balance:0}];
const DEF_EXP_CAT=[
    {id:'makan',name:'Makan & Minum',color:'#f59e0b',type:'expense'},
    {id:'transport',name:'Transport',color:'#3b82f6',type:'expense'},
    {id:'hiburan',name:'Hiburan',color:'#8b5cf6',type:'expense'},
    {id:'tagihan',name:'Tagihan',color:'#ef4444',type:'expense'},
    {id:'kopi',name:'Kopi & Jajan',color:'#a855f7',type:'expense'},
    {id:'belanja',name:'Belanja',color:'#ec4899',type:'expense'},
    {id:'kesehatan',name:'Kesehatan',color:'#10b981',type:'expense'},
    {id:'pendidikan',name:'Pendidikan',color:'#06b6d4',type:'expense'},
    {id:'cicilan',name:'Cicilan',color:'#f97316',type:'expense'},
    {id:'lainnya_e',name:'Lainnya',color:'#6b7280',type:'expense'},
];
const DEF_INC_CAT=[
    {id:'gaji',name:'Gaji',color:'#10b981',type:'income'},
    {id:'freelance',name:'Freelance',color:'#3b82f6',type:'income'},
    {id:'bonus',name:'Bonus',color:'#f59e0b',type:'income'},
    {id:'lainnya_i',name:'Lainnya',color:'#6b7280',type:'income'},
];
const DEF_BUDGETS=[
    {id:'b1',category:'makan',limit:1500000,period:'monthly',categories:['makan','kopi','belanja']},
    {id:'b2',category:'transport',limit:500000,period:'monthly',categories:['transport']},
    {id:'b3',category:'hiburan',limit:300000,period:'monthly',categories:['hiburan']},
];

function App(){
    const MAINTENANCE_MODE = false;

    if (MAINTENANCE_MODE) {
        return (
            <div className="min-h-screen bg-dark-900 flex flex-col items-center justify-center p-6 text-center">
                <div className="w-20 h-20 bg-blue-600/20 rounded-full flex items-center justify-center text-blue-400 mb-6">
                    <I.Gear />
                </div>
                <h1 className="text-2xl font-bold text-white mb-2">Sedang Maintenance 🛠️</h1>
                <p className="text-dark-400 text-sm">Aplikasi sedang diperbarui oleh developer. Silakan kembali lagi nanti!</p>
            </div>
        );
    }

    const[tab,setTab]=useState('home');const[modal,setModal]=useState(null);const[mData,setMData]=useState(null);
    const[wallets,setWallets]=useLS('nh_w',DEF_WALLETS);
    const[txns,setTxns]=useLS('nh_tx',[]);
    const[budgets,setBudgets]=useLS('nh_bg',DEF_BUDGETS);
    const[notes,setNotes]=useLS('nh_n',[]);
    const[todos,setTodos]=useLS('nh_td',[]);
    const[debts,setDebts]=useLS('nh_db',[]);
    const[expCats,setExpCats]=useLS('nh_ec',DEF_EXP_CAT);
    const[incCats,setIncCats]=useLS('nh_ic',DEF_INC_CAT);
    const[streak,setStreak]=useLS('nh_sk',{current:0,longest:0,lastDate:null,celebratedAt:[]});
    const[ocrProvider,setOcrProvider]=useLS('nh_ocrp','offline');
    const[ocrKey,setOcrKey]=useLS('nh_ocrk','');
    // State baru untuk Auto-Learn Memori OCR
    const[learnedKw,setLearnedKw]=useLS('nh_lkw',{});
    const[pageKey,setPageKey]=useState(0);
    
    const [undoTxn, setUndoTxn] = useState(null);

    const allCats=useMemo(()=>[...expCats,...incCats],[expCats,incCats]);
    const getCat=id=>allCats.find(c=>c.id===id);
    const totalBal=useMemo(()=>wallets.reduce((s,w)=>s+w.balance,0),[wallets]);
    
    const mTxns=useMemo(()=>txns.filter(t=>t.date.startsWith(getMY())&&t.type!=='transfer'),[txns]);
    const mIncome=useMemo(()=>mTxns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),[mTxns]);
    const mExpense=useMemo(()=>mTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),[mTxns]);
    const todayTxns=useMemo(()=>txns.filter(t=>t.date===getToday()),[txns]);
    const todayExp=useMemo(()=>todayTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),[todayTxns]);
    const catSpend=useMemo(()=>{const s={};mTxns.filter(t=>t.type==='expense').forEach(t=>{s[t.category]=(s[t.category]||0)+t.amount});return s},[mTxns]);
    const remain=mIncome-mExpense;

    useEffect(()=>{
        const today=getToday();if(streak.lastDate===today)return;
        const yd=new Date();yd.setDate(yd.getDate()-1);const ydStr=yd.toISOString().split('T')[0];
        const ydExp=txns.filter(t=>t.date===ydStr&&t.type==='expense').reduce((s,t)=>s+t.amount,0);
        const now=new Date();const dim=daysInMonth(now.getFullYear(),now.getMonth()+1);
        const totalBudget=budgets.reduce((s,b)=>s+b.limit,0);const dailyLim=totalBudget/dim;
        const yesterdayWasYesterday=streak.lastDate===ydStr;
        let nc=streak.current;
        if(yesterdayWasYesterday||!streak.lastDate){
            if(ydExp<=dailyLim){nc=streak.current+1}
            else if(ydExp>dailyLim){nc=0}
        }else{nc=0}
        const nl=Math.max(streak.longest,nc);
        const celebrated=[...(streak.celebratedAt||[])];
        const milestones=[7,14,30,50,100,200,365];
        if(nc>0&&milestones.includes(nc)&&!celebrated.includes(nc)){
            celebrated.push(nc);
            setTimeout(()=>fireConfetti(),500);
        }
        setStreak({current:nc,longest:nl,lastDate:today,celebratedAt:celebrated});
    },[]);

    useEffect(()=>{
        const recurring=txns.filter(t=>t.isRecurring);const my=getMY();
        recurring.forEach(r=>{
            const exists=txns.some(t=>t.recurringPid===r.id&&t.date.startsWith(my));
            if(!exists&&new Date().getDate()>=r.recurringDay){
                const nt={...r,id:genId(),recurringPid:r.id,date:`${my}-${String(r.recurringDay).padStart(2,'0')}`,createdAt:new Date().toISOString(),isRecurring:false};
                setTxns(p=>[nt,...p]);
                if(r.walletId)setWallets(p=>p.map(w=>w.id===r.walletId?{...w,balance:w.balance+(r.type==='income'?r.amount:-r.amount)}:w));
            }
        });
    },[]);

    const addTxn=t=>{
        const n={...t,id:genId(),date:t.date||getToday(),createdAt:new Date().toISOString()};
        setTxns(p=>[n,...p]);
        if(t.type==='transfer'){
            setWallets(p=>p.map(w=>{
                if(w.id===t.transferFrom) return {...w, balance: w.balance - t.amount};
                if(w.id===t.transferTo) return {...w, balance: w.balance + t.amount};
                return w;
            }));
        }else if(t.walletId){
            setWallets(p=>p.map(w=>w.id===t.walletId?{...w,balance:w.balance+(t.type==='income'?t.amount:-t.amount)}:w));
        }
    };

    const saveTxn = (t) => {
        triggerHaptic();
        if (mData?.id) {
            setTxns(p => p.map(tx => tx.id === mData.id ? { ...t, id: mData.id, createdAt: tx.createdAt } : tx));
        } else {
            addTxn(t);
        }
        closeM();
    };

    const delTxn = (id, callback) => {
        if (!id) return;
        const t = txns.find(x => x.id === id);
        if (!t) return;
        triggerHaptic();
        
        setTxns(p => p.filter(x => x.id !== id));
        
        if (t.type === 'transfer') {
            setWallets(p => p.map(w => {
                if (w.id === t.transferFrom) return { ...w, balance: w.balance + t.amount };
                if (w.id === t.transferTo) return { ...w, balance: w.balance - t.amount };
                return w;
            }));
        } else if (t.walletId) {
            setWallets(p => p.map(w => w.id === t.walletId ? { ...w, balance: w.balance + (t.type === 'income' ? -t.amount : t.amount) } : w));
        }
        
        setUndoTxn({ txn: t });
        if (callback) callback();
    };

    const undoDelete = () => {
        if (!undoTxn) return;
        const t = undoTxn.txn;
        
        setTxns(p => [t, ...p]);
        
        if (t.type === 'transfer') {
            setWallets(p => p.map(w => {
                if (w.id === t.transferFrom) return { ...w, balance: w.balance - t.amount };
                if (w.id === t.transferTo) return { ...w, balance: w.balance + t.amount };
                return w;
            }));
        } else if (t.walletId) {
            setWallets(p => p.map(w => w.id === t.walletId ? { ...w, balance: w.balance + (t.type === 'income' ? t.amount : -t.amount) } : w));
        }
        
        setUndoTxn(null);
    };

    const addNote=n=>{triggerHaptic();setNotes(p=>[{...n,id:genId(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},...p]);};
    const updNote=(id,u)=>setNotes(p=>p.map(n=>n.id===id?{...n,...u,updatedAt:new Date().toISOString()}:n));
    const delNote=id=>setNotes(p=>p.filter(n=>n.id!==id));
    
    const addTodo=t=>{triggerHaptic();setTodos(p=>[{...t,id:genId(),completed:false,createdAt:new Date().toISOString()},...p]);};
    const togTodo=id=>{
        const todo = todos.find(t => t.id === id);
        if (todo && !todo.completed && todo.budget > 0) {
            openM('todoBudget', todo);
        } else {
            setTodos(p=>p.map(t=>t.id===id?{...t,completed:!t.completed}:t));
        }
    };
    const delTodo=id=>setTodos(p=>p.filter(t=>t.id!==id));
    
    const completeTodoWithExpense = (todoId, realCost, walletId) => {
        const todo = todos.find(t => t.id === todoId);
        setTodos(p => p.map(t => t.id === todoId ? { ...t, completed: true } : t));
        if (todo) {
            addTxn({
                type: 'expense',
                amount: realCost,
                category: 'lainnya_e',
                note: `[Auto-Todo] ${todo.title}`,
                date: getToday(),
                walletId: walletId
            });
        }
        closeM();
    };

    const skipTodoExpense = (todoId) => {
        setTodos(p => p.map(t => t.id === todoId ? { ...t, completed: true } : t));
        closeM();
    };

    const addDebt=d=>{triggerHaptic();setDebts(p=>[{...d,id:genId(),status:'pending',createdAt:new Date().toISOString()},...p]);};
    const togDebt=id=>setDebts(p=>p.map(d=>d.id===id?{...d,status:d.status==='pending'?'paid':'pending'}:d));
    const delDebt=id=>setDebts(p=>p.filter(d=>d.id!==id));
    
    const openM=(t,d=null)=>{setMData(d);setModal(t)};
    const closeM=()=>{setModal(null);setMData(null)};
    
    const tabs=['home','notes','finance','settings'];
    const tabIdx=tabs.indexOf(tab);
    const touchStartX=useRef(0);
    const handleTouchStart=e=>{touchStartX.current=e.touches[0].clientX};
    const handleTouchEnd=e=>{
        const diff=e.changedTouches[0].clientX-touchStartX.current;
        if(Math.abs(diff)>80){
            if(diff<0&&tabIdx<tabs.length-1){setTab(tabs[tabIdx+1]);setPageKey(k=>k+1)}
            else if(diff>0&&tabIdx>0){setTab(tabs[tabIdx-1]);setPageKey(k=>k+1)}
        }
    };

    return(
        <div className="pb-20 min-h-screen" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
            <div className="px-4 pt-4 page-enter" key={pageKey}>
                {tab==='home'&&<Dash wallets={wallets} totalBal={totalBal} mIncome={mIncome} mExpense={mExpense} remain={remain} todayExp={todayExp} todayTxns={todayTxns} todos={todos} budgets={budgets} catSpend={catSpend} streak={streak} allCats={allCats} openM={openM}/>}
                {tab==='notes'&&<NotesMod notes={notes} todos={todos} addNote={addNote} updNote={updNote} delNote={delNote} addTodo={addTodo} togTodo={togTodo} delTodo={delTodo} openM={openM}/>}
                {tab==='finance'&&<FinMod wallets={wallets} txns={txns} mTxns={mTxns} budgets={budgets} catSpend={catSpend} mIncome={mIncome} mExpense={mExpense} debts={debts} totalBal={totalBal} allCats={allCats} getCat={getCat} setWallets={setWallets} setBudgets={setBudgets} addDebt={addDebt} togDebt={togDebt} delDebt={delDebt} delTxn={delTxn} openM={openM}/>}
                {tab==='settings'&&<SetMod wallets={wallets} setWallets={setWallets} txns={txns} budgets={budgets} setBudgets={setBudgets} notes={notes} todos={todos} debts={debts} expCats={expCats} incCats={incCats} setExpCats={setExpCats} setIncCats={setIncCats} streak={streak} openM={openM} ocrProvider={ocrProvider} setOcrProvider={setOcrProvider} ocrKey={ocrKey} setOcrKey={setOcrKey}/>}
            </div>
            
            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-dark-800/60 backdrop-blur-lg border-t border-white/10 px-2 pb-2 pt-1 z-40">
                <div className="flex items-center justify-around">
                    <NB ic={<I.Home/>} lb="Home" ac={tab==='home'} fn={()=>{setTab('home');setPageKey(k=>k+1)}}/>
                    <NB ic={<I.Notes/>} lb="Notes" ac={tab==='notes'} fn={()=>{setTab('notes');setPageKey(k=>k+1)}}/>
                    <button onClick={()=>{triggerHaptic();openM('quickAdd')}} className={`w-14 h-14 -mt-6 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-600/30 ch text-white ${txns.length===0?'animate-bounce':'fab-p'}`}>
                        <I.Plus/>
                    </button>
                    <NB ic={<I.Dollar/>} lb="Finance" ac={tab==='finance'} fn={()=>{setTab('finance');setPageKey(k=>k+1)}}/>
                    <NB ic={<I.Gear/>} lb="Setting" ac={tab==='settings'} fn={()=>{setTab('settings');setPageKey(k=>k+1)}}/>
                </div>
            </nav>
            
            {modal==='quickAdd'&&<QuickAddM close={closeM} openM={openM}/>}
            {modal==='scanReceipt'&&<SyncErrorBoundary close={closeM}><ScanReceiptM close={closeM} openM={openM} expCats={expCats} ocrProvider={ocrProvider} ocrKey={ocrKey} learnedKw={learnedKw} setLearnedKw={setLearnedKw}/></SyncErrorBoundary>}
            {modal==='addTxn'&&<TxnM close={closeM} save={saveTxn} wallets={wallets} expCats={expCats} incCats={incCats} ed={mData}/>}
            {modal==='addNote'&&<NoteM close={closeM} save={mData?.id?n=>updNote(mData.id,n):addNote} ed={mData}/>}
            {modal==='addWallet'&&<WalletM close={closeM} save={w=>setWallets(p=>[...p,{...w,id:genId(),balance:0}])}/>}
            {modal==='editBudget'&&<BudgetM close={closeM} budgets={budgets} expCats={expCats} save={setBudgets}/>}
            {modal==='addDebt'&&<DebtM close={closeM} save={addDebt}/>}
            {modal==='txnDetail'&&<TxnDetailM txn={mData} close={closeM} del={()=>{delTxn(mData.id, closeM)}} getCat={getCat} wallets={wallets}/>}
            {modal==='editCats'&&<CatEditM close={closeM} cats={mData==='expense'?expCats:incCats} save={mData==='expense'?setExpCats:setIncCats} type={mData}/>}
            {modal==='todoBudget'&&<TodoBudgetM close={closeM} todo={mData} completeWithExpense={completeTodoWithExpense} skipExpense={skipTodoExpense} wallets={wallets}/>}
            {modal==='p2pSync'&&<SyncErrorBoundary close={closeM}><P2PSync close={closeM}/></SyncErrorBoundary>}
            
            {undoTxn&&(
                <div className="fixed bottom-24 left-0 right-0 max-w-md mx-auto px-4 z-50 pointer-events-none">
                    <div className="pointer-events-auto bg-dark-700/95 backdrop-blur border border-white/10 rounded-2xl p-3 flex items-center justify-between shadow-2xl modal-ct">
                        <span className="text-sm">🗑️ Transaksi dihapus</span>
                        <button onClick={undoDelete} className="text-blue-400 text-sm font-bold px-3 py-1">UNDO</button>
                    </div>
                </div>
            )}
        </div>
    );
}

class SyncErrorBoundary extends React.Component {
    constructor(props){super(props);this.state={hasError:false};}
    static getDerivedStateFromError(){return{hasError:true};}
    componentDidCatch(err,info){console.error('P2P Sync error:',err,info);}
    render(){
        if(this.state.hasError){
            return(
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-ov" onClick={this.props.close}>
                    <div className="absolute inset-0 bg-black/60"/>
                    <div className="relative w-full max-w-md bg-dark-800 rounded-3xl p-6 text-center modal-ct mx-4" onClick={e=>e.stopPropagation()}>
                        <div className="w-16 h-16 bg-yellow-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-yellow-400 text-2xl">⚠️</div>
                        <p className="font-bold text-lg mb-2">Modul Sinkronisasi Gagal Dimuat</p>
                        <p className="text-dark-400 text-sm mb-5">Jangan khawatir, data Anda aman. Gunakan tombol Ekspor / Impor JSON di Pengaturan sebagai jalur alternatif yang 100% offline.</p>
                        <button onClick={this.props.close} className="w-full py-3 rounded-xl font-semibold text-white bg-blue-600">Tutup</button>
                    </div>
                </div>
            );
        }
        return this.props.children;
    }
}

function NB({ic,lb,ac,fn}){return<button onClick={fn} className={`flex flex-col items-center py-2 px-3 rounded-lg transition-all ${ac?'text-blue-400':'text-dark-400'}`}>{ic}<span className="text-[10px] mt-1 font-medium">{lb}</span></button>}

function Dash({wallets, totalBal, mIncome, mExpense, remain, todayExp, todayTxns, todos, budgets, catSpend, streak, allCats, openM}){
    const now=new Date();const g=now.getHours()<12?'Selamat Pagi':now.getHours()<18?'Selamat Siang':'Selamat Malam';
    const dn=now.toLocaleDateString('id-ID',{weekday:'long'});
    const pendTodos=todos.filter(t=>!t.completed).slice(0,4);
    const warnings=budgets.filter(b=>{const s=catSpend[b.category]||0;return b.limit>0&&s/b.limit>.7}).slice(0,3);
    const dim=daysInMonth(now.getFullYear(),now.getMonth()+1);
    const totalBudget=budgets.reduce((s,b)=>s+b.limit,0);
    const dailyLim=totalBudget/dim;
    const sc=streak.current;
    const milestone=sc>=365?'365 Hari':sc>=100?'100 Hari':sc>=50?'50 Hari':sc>=30?'Legendaris':sc>=14?'Luar Biasa':sc>=7?'Konsisten':sc>=3?'Mulai Bagus':'';
    const streakClass=sc>=365?'streak-legend':sc>=100?'streak-diamond':sc>=50?'streak-gold':'';
    const streakTextColor=sc>=50?'text-dark-900':'text-orange-400';
    const streakBgText=sc>=50?'text-dark-700':'text-dark-400';

    return(
        <div className="space-y-5">
            <div className="pt-2"><p className="text-dark-400 text-sm">{dn}, {fmtD(now)}</p><h1 className="text-2xl font-bold mt-1">{g}</h1></div>
            {sc>0&&(
                <div className={`${streakClass} rounded-2xl p-4 flex items-center gap-4 ${sc<50?'bg-gradient-to-r from-orange-600/20 to-amber-600/20 border border-orange-500/30':''}`}>
                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${sc>=50?'bg-white/30':'bg-orange-500/20'} ${streakTextColor}`}>{sc>=100?<I.Trophy/>:<I.Flame/>}</div>
                    <div className="flex-1">
                        <p className={`font-bold text-sm ${streakTextColor}`}>{sc} Hari Berturut-turut Hemat</p>
                        <p className={`${streakBgText} text-xs`}>Terpanjang: {streak.longest} hari{milestone&&<span className={`font-semibold ml-1 ${streakTextColor}`}>-- {milestone}</span>}</p>
                    </div>
                    {sc>=50&&<span className="text-2xl">🏆</span>}
                </div>
            )}
            <div className="bg-gradient-to-br from-blue-600 to-purple-700 rounded-2xl p-5 shadow-lg shadow-blue-600/20">
                <p className="text-blue-200 text-sm">Total Saldo</p>
                <p className="text-3xl font-bold mt-1">{fmtC(totalBal)}</p>
                <div className="flex justify-between mt-4 pt-4 border-t border-white/20">
                    <div><p className="text-blue-200 text-xs">Pemasukan</p><p className="text-sm font-semibold text-green-300 flex items-center gap-1"><I.Up/>{fmtC(mIncome)}</p></div>
                    <div className="text-right"><p className="text-blue-200 text-xs">Pengeluaran</p><p className="text-sm font-semibold text-red-300 flex items-center gap-1"><I.Down/>{fmtC(mExpense)}</p></div>
                </div>
            </div>
            <div className="bg-dark-700 rounded-2xl p-4">
                <div className="flex justify-between items-center mb-3">
                    <h3 className="font-semibold text-sm">Sisa Budget Bulan Ini</h3>
                    <span className={`text-sm font-bold ${remain>=0?'text-green-400':'text-red-400'}`}>{fmtC(remain)}</span>
                </div>
                <div className="w-full bg-dark-600 rounded-full h-3">
                    <div className={`h-3 rounded-full bb ${remain>500000?'bg-green-500':remain>0?'bg-yellow-500':'bg-red-500'}`} style={{width:`${Math.min(100,Math.max(0,mIncome>0?(remain/mIncome)*100:0))}%`}}/>
                </div>
                <div className="flex justify-between mt-2">
                    <p className="text-dark-400 text-xs">Limit harian: {fmtC(dailyLim)}</p>
                    <p className={`text-xs ${todayExp>dailyLim?'text-red-400 font-semibold':'text-dark-400'}`}>Hari ini: {fmtC(todayExp)}</p>
                </div>
            </div>
            {warnings.length>0&&(
                <div className="bg-dark-700 rounded-2xl p-4">
                    <h3 className="font-semibold text-sm mb-3 flex items-center gap-2 text-yellow-400"><I.Alert/> Peringatan Budget</h3>
                    <div className="space-y-3">
                        {warnings.map(bw=>{
                            const spent=catSpend[bw.category]||0;const pct=Math.min(100,(spent/bw.limit)*100);
                            const isOver=pct>=100;
                            return(
                                <div key={bw.id}>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="flex items-center gap-1.5"><CatBadge cat={{name:bw.category,color:'#6b7280'}} size="sm"/><span className="capitalize">{bw.category}</span></span>
                                        <span className={isOver?'text-red-400 font-bold':'text-yellow-400'}>{fmtC(spent)} / {fmtC(bw.limit)}</span>
                                    </div>
                                    <div className="w-full bg-dark-600 rounded-full h-2"><div className={`h-2 rounded-full bb ${isOver?'bg-red-500':'bg-yellow-500'}`} style={{width:`${pct}%`}}/></div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}
            <div className="bg-dark-700 rounded-2xl p-4">
                <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><I.Cal/> Hari Ini</h3>
                <div className="flex justify-between items-center mb-3 pb-3 border-b border-dark-600">
                    <span className="text-dark-300 text-sm">Pengeluaran hari ini</span>
                    <span className="font-bold text-sm">{fmtC(todayExp)}</span>
                </div>
                {todayTxns.length>0?(
                    <div className="space-y-2">{todayTxns.slice(0,3).map(t=>{
                        if(t.type==='transfer'){
                            const fromW=wallets.find(w=>w.id===t.transferFrom);
                            const toW=wallets.find(w=>w.id===t.transferTo);
                            return(<div key={t.id} className="flex items-center gap-3 py-1"><div className="w-6 h-6 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400"><I.Transfer/></div><div className="flex-1 min-w-0"><p className="text-sm truncate">Transfer: {fromW?.name} → {toW?.name}</p></div><span className="text-sm font-semibold text-blue-400">{fmtC(t.amount)}</span></div>);
                        }
                        const cat=allCats.find(c=>c.id===t.category)||{name:t.category,color:'#6b7280'};
                        return(<div key={t.id} className="flex items-center gap-3 py-1"><CatBadge cat={cat} size="sm"/><div className="flex-1 min-w-0"><p className="text-sm truncate">{t.note||cat.name}</p></div><span className={`text-sm font-semibold ${t.type==='income'?'text-green-400':'text-red-400'}`}>{t.type==='income'?'+':'-'}{fmtC(t.amount)}</span></div>);
                    })}</div>
                ):(<p className="text-dark-500 text-sm text-center py-2">Belum ada transaksi</p>)}
                {pendTodos.length>0&&(
                    <><div className="border-t border-dark-600 mt-3 pt-3"><p className="text-dark-400 text-xs mb-2">Tugas ({pendTodos.length})</p></div>
                    <div className="space-y-2">{pendTodos.map(t=>(<div key={t.id} className="flex items-center gap-2"><div className="w-4 h-4 border-2 border-dark-400 rounded shrink-0"/><span className="text-sm truncate flex-1">{t.title}</span>{t.deadline&&<span className="text-xs text-dark-500">{fmtD(t.deadline)}</span>}</div>))}</div></>
                )}
            </div>
        </div>
    );
}

function FinMod({wallets,txns,mTxns,budgets,catSpend,mIncome,mExpense,debts,totalBal,allCats,getCat,setWallets,setBudgets,addDebt,togDebt,delDebt,delTxn,openM}){
    const[sub,setSub]=useState('overview');
    return(
        <div className="space-y-4">

            <div className="flex gap-1 bg-dark-700 rounded-xl p-1 overflow-x-auto sb-hide">
                {[{id:'overview',l:'Ringkasan'},{id:'transactions',l:'Transaksi'},{id:'budget',l:'Budget'},{id:'debts',l:'Hutang'}].map(t=>(
                    <button key={t.id} onClick={()=>setSub(t.id)} className={`px-3 py-2 rounded-lg text-xs font-medium whitespace-nowrap transition-all ${sub===t.id?'bg-blue-600 text-white':'text-dark-400'}`}>{t.l}</button>

}

function FinOverview({wallets,mIncome,mExpense,totalBal,catSpend,allCats,txns,openM}){
    const totalExp=Object.values(catSpend).reduce((a,b)=>a+b,0);
    const chart=allCats.filter(c=>c.type==='expense').map(c=>({...c,amt:catSpend[c.id]||0,pct:totalExp>0?((catSpend[c.id]||0)/totalExp*100):0})).filter(d=>d.amt>0).sort((a,b)=>b.amt-a.amt);
    const transferCount=txns.filter(t=>t.type==='transfer'&&t.date.startsWith(getMY())).length;
    return(
        <div className="space-y-4">
            <div className="bg-dark-700 rounded-2xl p-4">
                <div className="flex justify-between items-center mb-3"><h3 className="font-semibold text-sm">Dompet & Rekening</h3><button onClick={()=>openM('addWallet')} className="text-blue-400 text-xs font-medium">+ Tambah</button></div>
                <div className="space-y-2">{wallets.map(w=>(<div key={w.id} className="flex items-center justify-between py-2.5 px-3 bg-dark-600 rounded-xl"><div className="flex items-center gap-3"><span className="text-dark-300"><WalletIcon type={w.type}/></span><div><p className="text-sm font-medium">{w.name}</p><p className="text-[10px] text-dark-400 uppercase">{w.type}</p></div></div><p className="font-bold text-sm">{fmtC(w.balance)}</p></div>))}</div>
            </div>
            <div className="grid grid-cols-2 gap-3">
                <div className="bg-dark-700 rounded-xl p-4"><div className="w-8 h-8 bg-green-500/20 rounded-lg flex items-center justify-center text-green-400 mb-2"><I.Up/></div><p className="text-dark-400 text-xs">Pemasukan</p><p className="text-lg font-bold text-green-400">{fmtC(mIncome)}</p></div>
                <div className="bg-dark-700 rounded-xl p-4"><div className="w-8 h-8 bg-red-500/20 rounded-lg flex items-center justify-center text-red-400 mb-2"><I.Down/></div><p className="text-dark-400 text-xs">Pengeluaran</p><p className="text-lg font-bold text-red-400">{fmtC(mExpense)}</p></div>
            </div>
            {transferCount>0&&(<div className="bg-blue-500/10 border border-blue-500/20 rounded-xl p-3 flex items-center gap-3"><div className="w-8 h-8 bg-blue-500/20 rounded-lg flex items-center justify-center text-blue-400"><I.Transfer/></div><div><p className="text-sm font-medium">{transferCount} Transfer Bulan Ini</p><p className="text-xs text-dark-400">Tidak dihitung sebagai pengeluaran</p></div></div>)}
            <div className="bg-dark-700 rounded-2xl p-4">
                <h3 className="font-semibold text-sm mb-4">Pengeluaran per Kategori</h3>

            </div>
        </div>
    );
}

function TxnList({txns,getCat,openM,delTxn,wallets}){
    const[filter,setFilter]=useState('all');const[q,setQ]=useState('');
    const filtered=useMemo(()=>{let f=txns;if(filter!=='all')f=f.filter(t=>t.type===filter);if(q.trim()){const s=q.toLowerCase();f=f.filter(t=>(t.note||'').toLowerCase().includes(s)||(t.category||'').toLowerCase().includes(s));}return f;},[txns,filter,q]);
    const grouped=useMemo(()=>{const g={};filtered.forEach(t=>{if(!g[t.date])g[t.date]=[];g[t.date].push(t)});return Object.entries(g).sort((a,b)=>b[0].localeCompare(a[0]))},[filtered]);
    const isEmpty = filtered.length === 0;

    return(
        <div className="space-y-4">
            <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-dark-400"><I.Search/></span><input type="text" placeholder="Cari berdasarkan catatan..." value={q} onChange={e=>setQ(e.target.value)} className="pl-10"/></div>
            <div className="flex gap-2 overflow-x-auto sb-hide">{[{id:'all',l:'Semua'},{id:'expense',l:'Keluar'},{id:'income',l:'Masuk'},{id:'transfer',l:'Transfer'}].map(f=>(<button key={f.id} onClick={()=>setFilter(f.id)} className={`px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap transition-all ${filter===f.id?'bg-blue-600 text-white':'bg-dark-700 text-dark-400'}`}>{f.l}</button>))}</div>
            
            {isEmpty ? (
                <div className="text-center py-12 relative">
                    <div className="w-16 h-16 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-400">
                        <I.Dollar />
                    </div>
                    <p className="text-dark-300 font-medium mb-1">{q.trim()?`Tidak ditemukan: "${q}"`:'Keuanganmu masih kosong'}</p>
                    <p className="text-dark-500 text-xs mb-6">Yuk, catat pemasukan atau pengeluaran pertamamu!</p>
                    <div className="absolute -bottom-10 left-1/2 -translate-x-4 opacity-50">
                        <svg width="40" height="60" viewBox="0 0 40 60" fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 4" strokeLinecap="round">
                            <path d="M 10 0 Q 30 20 20 50" />
                            <polyline points="10 40 20 50 30 45" />
                        </svg>
                    </div>
                </div>
            ) : (
                grouped.map(([date,items])=>(
                    <div key={date}>
                        <p className="text-dark-400 text-xs font-medium mb-2">{fmtD(date)}</p>
                        <div className="space-y-2">{items.map(t=>{
                            if(t.type==='transfer'){
                                const fromW=wallets.find(w=>w.id===t.transferFrom);
                                const toW=wallets.find(w=>w.id===t.transferTo);
                                return(<SwipeItem key={t.id} onDel={()=>delTxn(t.id)}><div className="p-3 flex items-center gap-3 ch" onClick={()=>openM('txnDetail',t)}><div className="w-8 h-8 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400"><I.Transfer/></div><div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">Transfer</p><p className="text-[10px] text-dark-400">{fromW?.name} → {toW?.name} -- {fmtT(t.createdAt)}</p></div><span className="text-sm font-bold text-blue-400">{fmtC(t.amount)}</span></div></SwipeItem>);
                            }
                            const cat=getCat(t.category)||{name:t.category,color:'#6b7280'};
                            return(<SwipeItem key={t.id} onDel={()=>delTxn(t.id)}><div className="p-3 flex items-center gap-3 ch" onClick={()=>openM('txnDetail',t)}><CatBadge cat={cat}/><div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">{t.note||cat.name}</p><p className="text-[10px] text-dark-400 flex items-center gap-1">{cat.name}{t.isRecurring&&<span className="text-blue-400 flex items-center"><I.Repeat/></span>} -- {fmtT(t.createdAt)}</p></div><span className={`text-sm font-bold ${t.type==='income'?'text-green-400':'text-red-400'}`}>{t.type==='income'?'+':'-'}{fmtC(t.amount)}</span></div></SwipeItem>);
                        })}</div>
                    </div>
                ))
            )}
        </div>
    );
}

function BudgetView({budgets,catSpend,allCats,openM}){
    const totalB=budgets.reduce((s,b)=>s+b.limit,0);
    const periodLabel={weekly:'Mingguan',monthly:'Bulanan',custom:'Custom'};
    return(
        <div className="space-y-4">
            <div className="flex justify-between items-center"><div><p className="text-dark-400 text-xs">Total Budget</p><p className="text-lg font-bold">{fmtC(totalB)}</p></div><button onClick={()=>openM('editBudget')} className="bg-blue-600 text-white text-xs px-4 py-2 rounded-lg font-medium">Edit Budget</button></div>
            <div className="space-y-3">{budgets.map(b=>{
                const spent=catSpend[b.category]||0;const pct=b.limit>0?Math.min(100,(spent/b.limit)*100):0;
                const cat=allCats.find(c=>c.id===b.category)||{name:b.category,color:'#6b7280'};
                const over=pct>=100;const warn=pct>=70&&!over;
                const trackedCats=(b.categories||[b.category]).map(cid=>allCats.find(c=>c.id===cid)).filter(Boolean);
                return(
                    <div key={b.id} className={`bg-dark-700 rounded-xl p-4 ${over?'border border-red-500/40':''}`}>
                        <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center gap-2"><CatBadge cat={cat} size="sm"/><span className="text-sm font-medium">{cat.name}</span></div>
                            <div className="flex items-center gap-1">
                                <span className="text-[9px] bg-dark-600 px-1.5 py-0.5 rounded text-dark-300">{periodLabel[b.period]||'Bulanan'}</span>
                                {over&&<span className="text-[10px] bg-red-500/20 text-red-400 px-2 py-1 rounded-full font-bold">LEBIH</span>}
                                {warn&&<span className="text-[10px] bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded-full">Hampir</span>}
                            </div>
                        </div>
                        {trackedCats.length>1&&(<div className="flex flex-wrap gap-1 mb-2">{trackedCats.map(tc=><span key={tc.id} className="text-[9px] bg-dark-600 px-1.5 py-0.5 rounded text-dark-300">{tc.name}</span>)}</div>)}
                        <div className="flex justify-between text-xs mb-2"><span className="text-dark-400">{fmtC(spent)}</span><span className="font-medium">{fmtC(b.limit)}</span></div>
                        <div className="w-full bg-dark-600 rounded-full h-3"><div className={`h-3 rounded-full bb ${over?'bg-red-500':warn?'bg-yellow-500':'bg-green-500'}`} style={{width:`${pct}%`}}/></div>
                        <p className="text-[10px] mt-1 text-dark-500">Sisa: {fmtC(Math.max(0,b.limit-spent))}</p>
                    </div>
                );
            })}</div>
        </div>
    );
}

function DebtView({debts,openM,tog,del}){
    const pending=debts.filter(d=>d.status==='pending');const paid=debts.filter(d=>d.status==='paid');
    const totalHutang=pending.filter(d=>d.dtype==='hutang').reduce((s,d)=>s+d.amount,0);
    const totalPiutang=pending.filter(d=>d.dtype==='piutang').reduce((s,d)=>s+d.amount,0);
    return(
        <div className="space-y-4">
            <div className="flex justify-between items-center"><p className="text-dark-400 text-sm">Catat hutang & piutang</p><button onClick={()=>openM('addDebt')} className="bg-blue-600 text-white text-xs px-4 py-2 rounded-lg font-medium">+ Tambah</button></div>
            <div className="grid grid-cols-2 gap-3">
                <div className="bg-red-500/10 border border-red-500/20 rounded-xl p-3"><p className="text-red-400 text-xs">Hutang (Kamu hutang)</p><p className="text-red-400 font-bold text-lg mt-1">{fmtC(totalHutang)}</p></div>
                <div className="bg-green-500/10 border border-green-500/20 rounded-xl p-3"><p className="text-green-400 text-xs">Piutang (Dihutang kamu)</p><p className="text-green-400 font-bold text-lg mt-1">{fmtC(totalPiutang)}</p></div>
            </div>
            {pending.length>0&&<><p className="text-dark-400 text-xs font-medium">Belum Lunas ({pending.length})</p><div className="space-y-2">{pending.map(d=>(<SwipeItem key={d.id} onDel={()=>del(d.id)}><div className="p-3 flex items-center gap-3 ch" onClick={()=>tog(d.id)}><div className={`w-8 h-8 rounded-lg flex items-center justify-center ${d.dtype==='hutang'?'bg-red-500/20 text-red-400':'bg-green-500/20 text-green-400'}`}><I.Handshake/></div><div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">{d.name}</p><p className="text-[10px] text-dark-400">{d.dtype==='hutang'?'Kamu hutang':'Dihutang kamu'}{d.dueDate&&` -- Jatuh tempo: ${fmtD(d.dueDate)}`}</p></div><span className={`text-sm font-bold ${d.dtype==='hutang'?'text-red-400':'text-green-400'}`}>{fmtC(d.amount)}</span></div></SwipeItem>))}</div></>}
            {paid.length>0&&<><p className="text-dark-400 text-xs font-medium mt-4">Lunas ({paid.length})</p><div className="space-y-2">{paid.map(d=>(<SwipeItem key={d.id} onDel={()=>del(d.id)}><div className="p-3 flex items-center gap-3 opacity-50 ch" onClick={()=>tog(d.id)}><div className="w-8 h-8 rounded-lg flex items-center justify-center bg-dark-600 text-dark-400"><I.Check/></div><div className="flex-1 min-w-0"><p className="text-sm line-through">{d.name}</p></div><span className="text-sm text-dark-400">{fmtC(d.amount)}</span></div></SwipeItem>))}</div></>}
            {debts.length===0&&<div className="text-center py-12"><p className="text-dark-500 text-3xl font-bold mb-2">--</p><p className="text-dark-400">Belum ada catatan hutang</p></div>}
        </div>
    );
}

function NotesMod({notes,todos,addNote,updNote,delNote,addTodo,togTodo,delTodo,openM}){
    const[sub,setSub]=useState('notes');const[q,setQ]=useState('');const[tag,setTag]=useState('all');
    const allTags=useMemo(()=>{const s=new Set();notes.forEach(n=>(n.tags||[]).forEach(t=>s.add(t)));return['all',...Array.from(s)]},[notes]);
    const filtered=useMemo(()=>{let f=notes;if(q)f=f.filter(n=>n.title.toLowerCase().includes(q.toLowerCase())||n.content.toLowerCase().includes(q.toLowerCase()));if(tag!=='all')f=f.filter(n=>(n.tags||[]).includes(tag));return f.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||new Date(b.updatedAt)-new Date(a.updatedAt))},[notes,q,tag]);
    const pend=todos.filter(t=>!t.completed);const done=todos.filter(t=>t.completed);
    return(
        <div className="space-y-4">
            <div className="pt-2"><h1 className="text-2xl font-bold">Catatan</h1><p className="text-dark-400 text-sm mt-1">Tulis dan atur semuanya di sini</p></div>
            <div className="flex gap-1 bg-dark-700 rounded-xl p-1">
                <button onClick={()=>setSub('notes')} className={`flex-1 py-2 rounded-lg text-xs font-medium transition-all ${sub==='notes'?'bg-blue-600 text-white':'text-dark-400'}`}>Catatan ({notes.length})</button>
                <button onClick={()=>setSub('todos')} className={`flex-1 py-2 rounded-lg text-xs font-medium transition-all ${sub==='todos'?'bg-blue-600 text-white':'text-dark-400'}`}>To-Do ({pend.length})</button>
            </div>
            {sub==='notes'&&(<div className="space-y-3">
                <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-dark-400"><I.Search/></span><input type="text" placeholder="Cari catatan..." value={q} onChange={e=>setQ(e.target.value)} className="pl-10"/></div>
                <div className="flex gap-2 overflow-x-auto sb-hide pb-1">{allTags.map(t=>(<button key={t} onClick={()=>setTag(t)} className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${tag===t?'bg-blue-600 text-white':'bg-dark-700 text-dark-400'}`}>{t==='all'?'Semua':`#${t}`}</button>))}</div>
                {filtered.length>0?<div className="grid grid-cols-2 gap-3">{filtered.map(n=>(<div key={n.id} className="bg-dark-700 rounded-xl p-3 ch cursor-pointer relative" onClick={()=>openM('addNote',n)}>{n.pinned&&<span className="absolute top-2 right-2 text-blue-400"><I.Pin/></span>}<p className="font-medium text-sm truncate pr-5">{n.title||'Tanpa Judul'}</p><p className="text-dark-400 text-xs mt-1" style={{display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{n.content}</p><div className="flex items-center justify-between mt-2"><div className="flex gap-1">{(n.tags||[]).slice(0,2).map(t=>(<span key={t} className="text-[9px] bg-dark-600 px-1.5 py-0.5 rounded text-dark-300">#{t}</span>))}</div><span className="text-[9px] text-dark-500">{fmtD(n.updatedAt)}</span></div></div>))}</div>:(<div className="text-center py-12"><p className="text-dark-500 text-3xl font-bold mb-2">--</p><p className="text-dark-400">Belum ada catatan</p><button onClick={()=>openM('addNote')} className="mt-3 text-blue-400 text-sm font-medium">+ Buat Catatan</button></div>)}
            </div>)}
            {sub==='todos'&&(<div className="space-y-4">
                <TodoQuick add={addTodo}/>
                {pend.length>0&&<><p className="text-dark-400 text-xs font-medium">Belum Selesai ({pend.length})</p><div className="space-y-2">{pend.map(t=>(<SwipeItem key={t.id} onDel={()=>delTodo(t.id)}><TodoItem t={t} tog={togTodo}/></SwipeItem>))}</div></>}
                {done.length>0&&<><p className="text-dark-400 text-xs font-medium mt-4">Selesai ({done.length})</p><div className="space-y-2">{done.map(t=>(<SwipeItem key={t.id} onDel={()=>delTodo(t.id)}><TodoItem t={t} tog={togTodo}/></SwipeItem>))}</div></>}
                {todos.length===0&&<div className="text-center py-12"><p className="text-dark-500 text-3xl font-bold mb-2">--</p><p className="text-dark-400">Belum ada tugas</p></div>}
            </div>)}
        </div>
    );
}

function TodoQuick({ add }) {
    const [t, setT] = useState('');
    const [deadline, setDeadline] = useState('');
    const [budget, setBudget] = useState('');
    const h = e => {
        e.preventDefault();
        if (!t.trim()) return;
        add({ title: t.trim(), deadline: deadline || null, budget: parseFloat(budget) || 0 });
        setT(''); setDeadline(''); setBudget('');
    };
    return (
        <form onSubmit={h} className="space-y-2">
            <div className="flex gap-2">
                <input type="text" placeholder="Tambah tugas baru..." value={t} onChange={e => setT(e.target.value)} className="flex-1" />
                <button type="submit" className="bg-blue-600 text-white px-4 rounded-lg text-sm font-medium shrink-0">+</button>
            </div>
            <div className="flex gap-2">
                <input type="date" value={deadline} onChange={e => setDeadline(e.target.value)} className="text-xs flex-1" />
                <input type="number" placeholder="Est. Biaya (Rp)" value={budget} onChange={e => setBudget(e.target.value)} className="text-xs flex-1" />
            </div>
        </form>
    );
}

function TodoItem({ t, tog }) {
    return (
        <div className={`bg-dark-700 rounded-xl p-3 flex items-center gap-3 ${t.completed ? 'opacity-50' : ''}`}>
            <button onClick={() => tog(t.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all shrink-0 ${t.completed ? 'bg-green-500 border-green-500' : 'border-dark-400'}`}>
                {t.completed && <I.Check />}
            </button>
            <div className="flex-1 min-w-0">
                <p className={`text-sm ${t.completed ? 'line-through text-dark-400' : ''}`}>{t.title}</p>
                <div className="flex items-center gap-2 mt-0.5">
                    {t.deadline && <p className="text-[10px] text-dark-400 flex items-center gap-1"><I.Cal />{fmtD(t.deadline)}</p>}
                    {t.budget > 0 && <p className="text-[10px] text-blue-400 font-medium">Est: {fmtC(t.budget)}</p>}
                </div>
            </div>
        </div>
    );
}

function SetMod({wallets,setWallets,txns,budgets,setBudgets,notes,todos,debts,expCats,incCats,setExpCats,setIncCats,streak,openM,ocrProvider,setOcrProvider,ocrKey,setOcrKey}){
    const[isInstalled,setIsInstalled]=useState(false);
    useEffect(()=>{if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){setIsInstalled(true)}},[]);
    const handleInstall=async()=>{
        if(window.deferredPrompt){window.deferredPrompt.prompt();const{outcome}=await window.deferredPrompt.userChoice;window.deferredPrompt=null;}
        else{alert('Untuk menginstall: buka menu browser (titik tiga) → "Install App" atau "Add to Home Screen"');}
    };
    const exp=()=>{const d={wallets,txns,budgets,notes,todos,debts,expCats,incCats,at:new Date().toISOString()};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`natahidup-${getToday()}.json`;a.click();URL.revokeObjectURL(u)};
    const imp=()=>{const fi=document.getElementById('nhImportFile');if(fi)fi.click();};
    const onImpFile=e=>{
        const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
        const reader=new FileReader();
        reader.onload=ev=>{
            try{
                const d=JSON.parse(ev.target.result);
                const map={wallets:'nh_w',txns:'nh_tx',budgets:'nh_bg',notes:'nh_n',todos:'nh_td',debts:'nh_db',expCats:'nh_ec',incCats:'nh_ic',streak:'nh_sk'};
                let n=0;
                Object.entries(map).forEach(([src,dst])=>{if(d[src]!==undefined){localStorage.setItem(dst,JSON.stringify(d[src]));n++;}});
                ['nh_w','nh_tx','nh_bg','nh_n','nh_td','nh_db','nh_ec','nh_ic','nh_sk'].forEach(k=>{if(d[k]!==undefined){localStorage.setItem(k,d[k]);n++;}});
                if(!n)throw new Error('empty');
                if(confirm(`Impor berhasil (${n} grup data). Muat ulang sekarang?`))location.reload();
            }catch(err){alert('File tidak valid. Gunakan file hasil Ekspor NataHidup.');}
        };
        reader.readAsText(file);
    };
    const reset=()=>{if(confirm('Hapus semua data? Tindakan ini tidak bisa dibatalkan.')){localStorage.clear();location.reload()}};
    return(
        <div className="space-y-4">
            <div className="pt-2"><h1 className="text-2xl font-bold">Pengaturan</h1><p className="text-dark-400 text-sm mt-1">Kelola aplikasi NataHidup</p></div>
            <div className="bg-dark-700 rounded-2xl p-5 text-center"><h2 className="text-xl font-bold">NataHidup</h2><p className="text-dark-400 text-sm mt-1">v2.3.0</p><p className="text-dark-500 text-xs mt-2">Produktivitas dan Keuangan Pribadi</p></div>
            {!isInstalled&&(<button onClick={handleInstall} className="w-full bg-blue-600 hover:bg-blue-700 rounded-2xl p-4 flex items-center justify-center gap-3 ch"><I.DL/><span className="font-semibold text-sm">Install App ke Homescreen</span></button>)}
            <div className="bg-dark-700 rounded-2xl p-4"><h3 className="font-semibold text-sm mb-3">Kategori</h3><div className="space-y-3"><CatEditInline cats={expCats} set={setExpCats} type="expense"/><CatEditInline cats={incCats} set={setIncCats} type="income"/></div></div>
            <div className="bg-dark-700 rounded-2xl p-4"><h3 className="font-semibold text-sm mb-3">Statistik</h3><div className="space-y-2">
                <div className="flex justify-between text-sm"><span className="text-dark-400">Transaksi</span><span>{txns.length}</span></div>
                <div className="flex justify-between text-sm"><span className="text-dark-400">Catatan</span><span>{notes.length}</span></div>
                <div className="flex justify-between text-sm"><span className="text-dark-400">To-Do</span><span>{todos.length}</span></div>
                <div className="flex justify-between text-sm"><span className="text-dark-400">Hutang/Piutang</span><span>{debts.length}</span></div>
                <div className="flex justify-between text-sm"><span className="text-dark-400">Streak Terpanjang</span><span>{streak.longest} hari</span></div>
            </div></div>
            
            <div className="bg-dark-700 rounded-2xl p-4 space-y-3">
                <h3 className="font-semibold text-sm">Scan Struk (OCR)</h3>
                <select value={ocrProvider} onChange={e=>setOcrProvider(e.target.value)}>
                    <option value="offline">Offline — Tesseract.js (gratis, tanpa internet)</option>
                    <option value="taggun">Taggun API (online, akurasi tinggi)</option>
                    <option value="mindee">Mindee API (online)</option>
                </select>
                {ocrProvider!=='offline'&&(<div className="space-y-2"><input type="password" placeholder="Masukkan API key..." value={ocrKey} onChange={e=>setOcrKey(e.target.value)}/>{!navigator.onLine&&<p className="text-[10px] text-yellow-400">Kamu sedang offline — scan akan otomatis memakai OCR offline.</p>}</div>)}
                <p className="text-[10px] text-dark-500">{ocrProvider==='offline'?'Model bahasa (~5 MB) diunduh sekali saat pertama dipakai, lalu tersimpan di perangkat.':'API key hanya disimpan di perangkatmu (localStorage) dan dikirim langsung ke provider. Jika API gagal atau kamu sedang offline, otomatis fallback ke OCR offline.'}</p>
            </div>
            <div className="bg-dark-700 rounded-2xl p-4 space-y-3">
                <h3 className="font-semibold text-sm">Data & Sinkronisasi</h3>
                <button onClick={() => openM('p2pSync')} className="w-full flex items-center gap-3 py-3 px-4 bg-blue-600/20 text-blue-400 rounded-xl text-sm ch border border-blue-500/30">
                    <I.Transfer />
                    <span>Sinkronisasi P2P (Tanpa Server)</span>
                </button>
                <button onClick={imp} className="w-full flex items-center gap-3 py-3 px-4 bg-dark-600 rounded-xl text-sm ch">
                    <I.Up />
                    <span>Impor Data (JSON)</span>
                </button>
                <input id="nhImportFile" type="file" accept=".json,application/json" className="hidden" onChange={onImpFile} />
                <button onClick={exp} className="w-full flex items-center gap-3 py-3 px-4 bg-dark-600 rounded-xl text-sm ch">
                    <I.DL />
                    <span>Ekspor Data (JSON)</span>
                </button>
                <button onClick={reset} className="w-full flex items-center gap-3 py-3 px-4 bg-red-500/10 rounded-xl text-sm text-red-400 ch">
                    <I.Trash />
                    <span>Reset Semua Data</span>
                </button>
            </div>

            <div className="bg-gradient-to-br from-blue-600/10 to-purple-600/10 border border-blue-500/20 rounded-2xl p-5"><h3 className="font-bold text-sm mb-3 flex items-center gap-2">Tentang NataHidup</h3><div className="space-y-3 text-xs text-dark-300 leading-relaxed"><p>NataHidup lahir dari frustrasi yang sama seperti kamu: buka aplikasi keuangan, malah jadi stress lihat angka merah. Buka notes, malah bingung cari catatan yang mana.</p><p>Kami percaya mengatur hidup nggak harus ribet. Makanya NataHidup didesain sederhana -- catat pengeluaran 5 detik, tulis catatan tanpa ribet, dan lihat progress hematmu dalam bentuk streak yang bikin ketagihan.</p><p className="text-blue-400 font-medium">Fitur favorit kami? Jeda 24 jam di Wishlist. Setiap kali kamu pengen beli barang impulsif, sistem maksa kamu tunggu sehari. 90% dari waktu, keesokan harinya kamu sadar: "Sebenarnya aku nggak butuh ini."</p><p>Itu inti NataHidup: bukan cuma catat, tapi bantu kamu <span className="text-white font-semibold">berpikir ulang sebelum bertindak</span>.</p></div></div>
            <div className="bg-dark-700 rounded-2xl p-4"><h3 className="font-semibold text-sm mb-2">Streak Milestones</h3><div className="space-y-2 text-xs"><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-500"></div><span className="text-dark-300">3 hari -- Mulai Bagus</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-500"></div><span className="text-dark-300">7 hari -- Konsisten</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-500"></div><span className="text-dark-300">14 hari -- Luar Biasa</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-500"></div><span className="text-dark-300">30 hari -- Legendaris</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-yellow-500"></div><span className="text-dark-300">50 hari -- Gold Badge</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-sky-400"></div><span className="text-dark-300">100 hari -- Diamond Badge</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-gradient-to-r from-yellow-400 to-amber-600"></div><span className="text-dark-300">365 hari -- Legendary (satu tahun!)</span></div></div></div>
        </div>
    );
}

function CatEditInline({cats,set,type}){
    const[newName,setNewName]=useState('');
    const add=()=>{if(!newName.trim())return;set(p=>[...p,{id:genId(),name:newName.trim(),color:['#f59e0b','#3b82f6','#8b5cf6','#ef4444','#ec4899','#10b981','#06b6d4','#f97316'][Math.floor(Math.random()*8)],type}]);setNewName('')};
    const del=id=>set(p=>p.filter(c=>c.id!==id));
    return(<div className="space-y-2"><p className="text-xs text-dark-400 font-medium">{type==='expense'?'Pengeluaran':'Pemasukan'}</p><div className="flex flex-wrap gap-1.5">{cats.map(c=>(<span key={c.id} className="flex items-center gap-1 bg-dark-600 rounded-full px-2.5 py-1 text-xs"><CatBadge cat={c} size="sm"/>{c.name}<button onClick={()=>del(c.id)} className="text-dark-400 ml-1 hover:text-red-400"><I.X/></button></span>))}</div><div className="flex gap-2 mt-1"><input type="text" placeholder="Kategori baru..." value={newName} onChange={e=>setNewName(e.target.value)} className="flex-1 text-xs"/><button onClick={add} className="bg-blue-600 text-white px-3 rounded-lg text-xs font-medium">+</button></div></div>);
}

function MW({close,children,title}){return(<div className="fixed inset-0 z-50 flex items-end justify-center modal-ov" onClick={close}><div className="absolute inset-0 bg-black/60"/><div className="relative w-full max-w-md bg-dark-800 rounded-t-3xl max-h-[92vh] overflow-y-auto modal-ct sb-hide" onClick={e=>e.stopPropagation()}><div className="sticky top-0 bg-dark-800 pt-3 pb-2 px-5 border-b border-dark-700 z-10"><div className="w-10 h-1 bg-dark-600 rounded-full mx-auto mb-3"/><div className="flex justify-between items-center"><h2 className="text-lg font-bold">{title}</h2><button onClick={close} className="text-dark-400 p-1"><I.X/></button></div></div><div className="p-5">{children}</div></div></div>);}

function QuickAddM({close,openM}){return(<MW close={close} title="Tambah Cepat"><div className="grid grid-cols-2 gap-4"><button onClick={()=>{close();setTimeout(()=>openM('addTxn',{type:'expense'}),200)}} className="bg-red-500/10 border border-red-500/30 rounded-2xl p-6 flex flex-col items-center gap-3 ch"><div className="w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center text-red-400"><I.Down/></div><span className="text-sm font-medium">Pengeluaran</span></button><button onClick={()=>{close();setTimeout(()=>openM('addTxn',{type:'income'}),200)}} className="bg-green-500/10 border border-green-500/30 rounded-2xl p-6 flex flex-col items-center gap-3 ch"><div className="w-10 h-10 rounded-xl bg-green-500/20 flex items-center justify-center text-green-400"><I.Up/></div><span className="text-sm font-medium">Pemasukan</span></button><button onClick={()=>{close();setTimeout(()=>openM('addTxn',{type:'transfer'}),200)}} className="bg-blue-500/10 border border-blue-500/30 rounded-2xl p-6 flex flex-col items-center gap-3 ch"><div className="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400"><I.Transfer/></div><span className="text-sm font-medium">Transfer</span></button><button onClick={()=>{close();setTimeout(()=>openM('addNote'),200)}} className="bg-purple-500/10 border border-purple-500/30 rounded-2xl p-6 flex flex-col items-center gap-3 ch"><div className="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-400"><I.Notes/></div><span className="text-sm font-medium">Catatan</span></button><button onClick={()=>{close();setTimeout(()=>openM('scanReceipt'),200)}} className="col-span-2 bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 flex items-center justify-center gap-3 ch"><div className="w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center text-amber-400"><I.Cam/></div><span className="text-sm font-medium">Scan Struk (OCR)</span></button></div></MW>);}

function TxnM({close,save,wallets,expCats,incCats,ed}){
    const[type,setType]=useState(ed?.type||'expense');
    const[amt,setAmt]=useState(ed?.amount?.toString()||'');
    const[cat,setCat]=useState(ed?.category||'');
