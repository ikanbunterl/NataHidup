<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Aplikasi Produktivitas dan Keuangan Pribadi" />
  <link rel="manifest" href="manifest.json" />
  <title>NataHidup</title>

  <!-- ═══════════════════════════════════════════════════════
       SARAN 3: Atribut DEFER pada Script Eksternal
       Mencegah blocking render → layar tidak kosong saat loading
       ═══════════════════════════════════════════════════════ -->
  <script defer src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script defer src="https://cdn.tailwindcss.com"></script>

  <!-- SARAN 2: Library QR Code untuk P2P Sync -->
  <script defer src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>

  <!-- SARAN LOC: File terpisah untuk Icons & Data Default -->
  <script defer src="./icons.js"></script>
  <script defer src="./data.js"></script>

  <!-- Babel tetap tanpa defer karena harus selesai sebelum JSX di-parse -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Loading screen agar user tidak melihat layar kosong */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #020617;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #e2e8f0; font-family: 'Inter', sans-serif;
      transition: opacity 0.4s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Loading Screen (menghilang setelah React mount) -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p class="mt-4 text-sm text-slate-400">Memuat NataHidup...</p>
  </div>

  <div id="root"></div>

  <!-- PWA Install Banner -->
  <div id="install-banner" class="hidden fixed bottom-4 left-4 right-4 z-50
    bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-2xl
    flex items-center justify-between">
    <div>
      <p class="font-semibold text-sm">Install NataHidup</p>
      <p class="text-xs text-slate-400">Jalankan seperti aplikasi native</p>
    </div>
    <div class="flex gap-2">
      <button id="btn-install" class="bg-blue-600 text-white text-xs px-4 py-2 rounded-lg font-medium">Install</button>
      <button id="btn-dismiss" class="text-slate-400 text-lg px-2">✕</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       KODE UTAMA APLIKASI (JSX via Babel)
       ═══════════════════════════════════════════════════════ -->
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ─── Utility: LocalStorage Hook ───
    function useLS(key, fallback) {
      const [val, setVal] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch { return fallback; }
      });
      useEffect(() => {
        localStorage.setItem(key, JSON.stringify(val));
      }, [key, val]);
      return [val, setVal];
    }

    // ═══════════════════════════════════════════════════════
    // SARAN LOC: Custom Hook — useNataState()
    // Membungkus belasan useState/useLS menjadi satu panggilan
    // ═══════════════════════════════════════════════════════
    function useNataState() {
      const [wallets, setWallets]       = useLS('nh_w', DEF_WALLETS);
      const [transactions, setTx]       = useLS('nh_tx', []);
      const [expCat, setExpCat]         = useLS('nh_ec', DEF_EXP_CAT);
      const [incCat, setIncCat]         = useLS('nh_ic', DEF_INC_CAT);
      const [budgets, setBudgets]       = useLS('nh_bg', DEF_BUDGETS);
      const [todos, setTodos]           = useLS('nh_todo', []);
      const [notes, setNotes]           = useLS('nh_note', []);
      const [activeTab, setActiveTab]   = useState('home');
      const [showModal, setShowModal]   = useState(null);

      return {
        wallets, setWallets,
        transactions, setTx,
        expCat, setExpCat,
        incCat, setIncCat,
        budgets, setBudgets,
        todos, setTodos,
        notes, setNotes,
        activeTab, setActiveTab,
        showModal, setShowModal,
      };
    }

    // ═══════════════════════════════════════════════════════
    // SARAN 1: Budget Link — Todo dengan Estimasi Biaya
    // ═══════════════════════════════════════════════════════
    function TodoWithBudget({ todos, setTodos, setTx, wallets, setWallets, expCat }) {
      const [newTask, setNewTask]       = useState('');
      const [newBudget, setNewBudget]   = useState('');
      const [promptTask, setPromptTask] = useState(null); // task yang baru dicentang
      const [actualCost, setActualCost] = useState('');

      // Tambah todo baru dengan optional budget link
      const addTodo = () => {
        if (!newTask.trim()) return;
        const todo = {
          id: Date.now().toString(),
          text: newTask.trim(),
          done: false,
          budget: newBudget ? parseFloat(newBudget) : null, // ⬅️ Budget Link
          walletId: wallets[0]?.id || 'w1',
          catId: expCat[0]?.id || 'e8',
          createdAt: new Date().toISOString(),
        };
        setTodos(prev => [todo, ...prev]);
        setNewTask('');
        setNewBudget('');
      };

      // Toggle done → munculkan prompt jika ada budget
      const toggleDone = (id) => {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;

        if (!todo.done && todo.budget) {
          // ⬅️ SARAN 1: Prompt instan saat task berbiaya selesai
          setPromptTask(todo);
          setActualCost(todo.budget.toString());
          return;
        }

        setTodos(prev =>
          prev.map(t => t.id === id ? { ...t, done: !t.done } : t)
        );
      };

      // Konfirmasi biaya → catat transaksi otomatis
      const confirmBudget = (editNominal) => {
        if (!promptTask) return;
        const finalAmount = editNominal ? parseFloat(actualCost) : promptTask.budget;

        if (finalAmount && finalAmount > 0) {
          // Buat transaksi pengeluaran otomatis
          const tx = {
            id: Date.now().toString(),
            type: 'expense',
            amount: finalAmount,
            catId: promptTask.catId,
            walletId: promptTask.walletId,
            note: `✅ ${promptTask.text}`,
            date: new Date().toISOString(),
          };
          setTx(prev => [tx, ...prev]);

          // Kurangi saldo wallet
          setWallets(prev =>
            prev.map(w =>
              w.id === promptTask.walletId
                ? { ...w, balance: w.balance - finalAmount }
                : w
            )
          );
        }

        // Tandai todo selesai
        setTodos(prev =>
          prev.map(t => t.id === promptTask.id ? { ...t, done: true } : t)
        );
        setPromptTask(null);
        setActualCost('');
      };

      const deleteTodo = (id) => {
        setTodos(prev => prev.filter(t => t.id !== id));
      };

      const formatRp = (n) =>
        new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);

      return (
        <div className="p-4 space-y-4">
          <h2 className="text-lg font-bold flex items-center gap-2">
            <span dangerouslySetInnerHTML={{ __html: I.todo }} className="w-5 h-5 text-blue-400" />
            To-Do List
            <span className="text-xs font-normal text-slate-500">+ Budget Link</span>
          </h2>

          {/* Input Todo + Budget */}
          <div className="bg-slate-800/50 rounded-xl p-3 space-y-2">
            <input
              type="text"
              placeholder="Contoh: Servis Motor"
              value={newTask}
              onChange={e => setNewTask(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addTodo()}
              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
            />
            <div className="flex gap-2">
              <div className="relative flex-1">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs">Rp</span>
                <input
                  type="number"
                  placeholder="Estimasi biaya (opsional)"
                  value={newBudget}
                  onChange={e => setNewBudget(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-2 text-sm focus:outline-none focus:border-green-500"
                />
              </div>
              <button
                onClick={addTodo}
                className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition"
              >
                + Tambah
              </button>
            </div>
          </div>

          {/* Daftar Todo */}
          <div className="space-y-2">
            {todos.map(todo => (
              <div
                key={todo.id}
                className={`flex items-center gap-3 bg-slate-800/30 rounded-xl p-3 border transition
                  ${todo.done ? 'border-green-900/30 opacity-60' : 'border-slate-700/50'}`}
              >
                <button
                  onClick={() => toggleDone(todo.id)}
                  className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition
                    ${todo.done
                      ? 'bg-green-500 border-green-500 text-white'
                      : 'border-slate-600 hover:border-blue-400'}`}
                >
                  {todo.done && <span className="text-xs">✓</span>}
                </button>

                <div className="flex-1 min-w-0">
                  <p className={`text-sm truncate ${todo.done ? 'line-through text-slate-500' : ''}`}>
                    {todo.text}
                  </p>
                  {todo.budget && (
                    <p className="text-xs text-amber-400 mt-0.5">
                      💰 {formatRp(todo.budget)}
                      {todo.done && <span className="text-green-400 ml-1">→ Tercatat</span>}
                    </p>
                  )}
                </div>

                <button
                  onClick={() => deleteTodo(todo.id)}
                  className="text-slate-600 hover:text-red-400 transition p-1"
                  dangerouslySetInnerHTML={{ __html: I.trash }}
                />
              </div>
            ))}
            {todos.length === 0 && (
              <p className="text-center text-slate-600 text-sm py-8">Belum ada tugas</p>
            )}
          </div>

          {/* ═══ PROMPT BUDGET (Saran 1) ═══ */}
          {promptTask && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
              <div className="bg-slate-800 rounded-2xl p-6 w-full max-w-sm space-y-4 border border-slate-700 shadow-2xl">
                <h3 className="font-bold text-green-400 text-lg">✅ Task Selesai!</h3>
                <p className="text-sm text-slate-300">
                  <strong>{promptTask.text}</strong> selesai!
                </p>
                <p className="text-sm text-slate-400">
                  Apakah biayanya pas <span className="text-amber-400 font-bold">{formatRp(promptTask.budget)}</span>?
                </p>

                <div className="space-y-2">
                  <label className="text-xs text-slate-500">Atau edit nominal aktual:</label>
                  <div className="relative">
                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">Rp</span>
                    <input
                      type="number"
                      value={actualCost}
                      onChange={e => setActualCost(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-600 rounded-lg pl-8 pr-3 py-2 text-sm focus:outline-none focus:border-amber-500"
                    />
                  </div>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => confirmBudget(false)}
                    className="flex-1 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl text-sm font-bold transition"
                  >
                    Ya, Catat {formatRp(promptTask.budget)}
                  </button>
                  <button
                    onClick={() => confirmBudget(true)}
                    className="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl text-sm font-bold transition"
                  >
                    Edit Nominal
                  </button>
                </div>
                <button
                  onClick={() => { setPromptTask(null); setTodos(prev => prev.map(t => t.id === promptTask.id ? {...t, done: true} : t)); }}
                  className="w-full text-slate-500 text-xs py-1 hover:text-slate-300 transition"
                >
                  Lewati (tandai selesai saja)
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════
    // SARAN 2: P2P Serverless Sync via WebRTC + QR Code
    // ═══════════════════════════════════════════════════════
    function P2PSyncPanel({ onDataReceived }) {
      const [mode, setMode]           = useState(null); // 'send' | 'receive'
      const [qrDataUrl, setQrDataUrl] = useState('');
      const [syncStatus, setSyncStatus] = useState('idle');
      const [receivedData, setReceivedData] = useState(null);
      const peerRef = useRef(null);
      const channelRef = useRef(null);
      const canvasRef = useRef(null);

      // Kumpulkan seluruh state localStorage NataHidup
      const gatherAllData = useCallback(() => {
        const keys = ['nh_w', 'nh_tx', 'nh_ec', 'nh_ic', 'nh_bg', 'nh_todo', 'nh_note'];
        const data = {};
        keys.forEach(k => {
          const raw = localStorage.getItem(k);
          if (raw) data[k] = JSON.parse(raw);
        });
        return data;
      }, []);

      // ─── MODE KIRIM: Generate QR berisi signaling data ───
      const startSend = async () => {
        setMode('send');
        setSyncStatus('connecting');

        try {
          const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
          });
          peerRef.current = pc;

          const channel = pc.createDataChannel('natahidup-sync');
          channelRef.current = channel;

          channel.onopen = () => {
            setSyncStatus('sending');
            const allData = gatherAllData();
            // Kirim data dalam chunk jika terlalu besar
            const jsonStr = JSON.stringify(allData);
            const chunkSize = 16000;
            for (let i = 0; i < jsonStr.length; i += chunkSize) {
              channel.send(jsonStr.slice(i, i + chunkSize));
            }
            channel.send('__END__');
            setSyncStatus('done');
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          // Tunggu ICE gathering selesai
          await new Promise(resolve => {
            if (pc.iceGatheringState === 'complete') resolve();
            else pc.addEventListener('icegatheringstatechange', () => {
              if (pc.iceGatheringState === 'complete') resolve();
            });
          });

          // Encode SDP ke Base64 untuk QR Code
          const sdpB64 = btoa(JSON.stringify(pc.localDescription));
          // QR Code punya limit ~2953 bytes, jadi kita gunakan URL shortener approach
          // Untuk demo, kita tampilkan sebagai teks jika terlalu panjang
          if (sdpB64.length < 2500) {
            const qrUrl = `natahidup://sync?s=${sdpB64}`;
            if (typeof QRCode !== 'undefined') {
              const dataUrl = await QRCode.toDataURL(qrUrl, { width: 280, margin: 2, color: { dark: '#e2e8f0', light: '#0f172a' } });
              setQrDataUrl(dataUrl);
            }
          }
          setSyncStatus('qr-ready');
        } catch (err) {
          console.error('P2P Send Error:', err);
          setSyncStatus('error');
        }
      };

      // ─── MODE TERIMA: Scan/paste SDP dari HP lama ───
      const startReceive = () => {
        setMode('receive');
        setSyncStatus('waiting-paste');
      };

      const handlePasteSDP = async (sdpText) => {
        setSyncStatus('connecting');
        try {
          const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
          });
          peerRef.current = pc;

          pc.ondatachannel = (e) => {
            const channel = e.channel;
            let buffer = '';
            channel.onmessage = (msg) => {
              if (msg.data === '__END__') {
                const parsed = JSON.parse(buffer);
                setReceivedData(parsed);
                setSyncStatus('done');
                // Terapkan data ke localStorage
                Object.entries(parsed).forEach(([key, val]) => {
                  localStorage.setItem(key, JSON.stringify(val));
                });
                if (onDataReceived) onDataReceived();
              } else {
                buffer += msg.data;
              }
            };
          };

          const offer = JSON.parse(atob(sdpText.trim()));
          await pc.setRemoteDescription(offer);
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          setSyncStatus('connected');
        } catch (err) {
          console.error('P2P Receive Error:', err);
          setSyncStatus('error');
        }
      };

      const reset = () => {
        if (peerRef.current) peerRef.current.close();
        setMode(null);
        setSyncStatus('idle');
        setQrDataUrl('');
        setReceivedData(null);
      };

      return (
        <div className="p-4 space-y-4">
          <h2 className="text-lg font-bold flex items-center gap-2">
            <span dangerouslySetInnerHTML={{ __html: I.sync }} className="w-5 h-5 text-purple-400" />
            P2P Sync
            <span className="text-xs font-normal text-slate-500">Tanpa Server</span>
          </h2>

          <p className="text-xs text-slate-400">
            Transfer seluruh data NataHidup antar HP via koneksi lokal.
            100% offline, tanpa server, tanpa biaya.
          </p>

          {!mode && (
            <div className="grid grid-cols-2 gap-3">
              <button
                onClick={startSend}
                className="bg-purple-600/20 border border-purple-500/30 rounded-xl p-4 text-center hover:bg-purple-600/30 transition"
              >
                <span className="text-2xl">📤</span>
                <p className="text-sm font-medium mt-1">Kirim Data</p>
                <p className="text-xs text-slate-500">HP Lama</p>
              </button>
              <button
                onClick={startReceive}
                className="bg-blue-600/20 border border-blue-500/30 rounded-xl p-4 text-center hover:bg-blue-600/30 transition"
              >
                <span className="text-2xl">📥</span>
                <p className="text-sm font-medium mt-1">Terima Data</p>
                <p className="text-xs text-slate-500">HP Baru</p>
              </button>
            </div>
          )}

          {mode === 'send' && (
            <div className="space-y-3">
              <div className="bg-slate-800/50 rounded-xl p-4 text-center">
                {syncStatus === 'qr-ready' && qrDataUrl ? (
                  <>
                    <img src={qrDataUrl} alt="QR Sync" className="mx-auto rounded-lg" />
                    <p className="text-xs text-slate-400 mt-2">Scan QR ini dari HP baru</p>
                  </>
                ) : syncStatus === 'qr-ready' ? (
                  <p className="text-xs text-amber-400">Data terlalu besar untuk QR. Gunakan copy-paste SDP.</p>
                ) : (
                  <p className="text-sm text-slate-400">
                    {syncStatus === 'connecting' && '⏳ Membangun koneksi...'}
                    {syncStatus === 'sending' && '📡 Mengirim data...'}
                    {syncStatus === 'done' && '✅ Transfer selesai!'}
                    {syncStatus === 'error' && '❌ Gagal. Coba lagi.'}
                  </p>
                )}
              </div>
              <button onClick={reset} className="w-full text-slate-500 text-xs py-2 hover:text-slate-300">← Kembali</button>
            </div>
          )}

          {mode === 'receive' && (
            <div className="space-y-3">
              <div className="bg-slate-800/50 rounded-xl p-4 space-y-2">
                <p className="text-xs text-slate-400">Paste kode SDP dari HP lama:</p>
                <textarea
                  id="sdp-input"
                  rows={4}
                  placeholder="Paste Base64 SDP di sini..."
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:border-blue-500"
                />
                <button
                  onClick={() => handlePasteSDP(document.getElementById('sdp-input').value)}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition"
                >
                  Hubungkan & Terima
                </button>
              </div>
              {syncStatus === 'done' && (
                <div className="bg-green-900/30 border border-green-700/50 rounded-xl p-3 text-center">
                  <p className="text-green-400 font-bold text-sm">✅ Data berhasil diterima!</p>
                  <p className="text-xs text-slate-400 mt-1">Seluruh data sudah dipulihkan. Reload halaman.</p>
                </div>
              )}
              <button onClick={reset} className="w-full text-slate-500 text-xs py-2 hover:text-slate-300">← Kembali</button>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════
    // KOMPONEN UTAMA APP
    // ═══════════════════════════════════════════════════════
    function App() {
      // SARAN LOC: Satu baris saja! Semua state terbungkus di custom hook
      const state = useNataState();

      // Hilangkan loading screen setelah mount
      useEffect(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) loader.classList.add('hidden');
      }, []);

      const formatRp = (n) =>
        new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);

      const totalBalance = useMemo(
        () => state.wallets.reduce((s, w) => s + w.balance, 0),
        [state.wallets]
      );

      const pendingTodos = useMemo(
        () => state.todos.filter(t => !t.done).length,
        [state.todos]
      );

      const linkedBudgetTodos = useMemo(
        () => state.todos.filter(t => t.budget && !t.done).length,
        [state.todos]
      );

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-950">

          {/* Header */}
          <header className="bg-gradient-to-br from-slate-900 to-slate-800 p-5 pb-8 rounded-b-3xl border-b border-slate-800">
            <h1 className="text-xl font-bold text-white">NataHidup</h1>
            <p className="text-xs text-slate-400 mt-0.5">Life OS — Keuangan & Produktivitas</p>

            {state.activeTab === 'home' && (
              <div className="mt-4 bg-slate-800/60 rounded-2xl p-4 border border-slate-700/50">
                <p className="text-xs text-slate-400">Total Saldo</p>
                <p className="text-2xl font-bold text-green-400 mt-1">{formatRp(totalBalance)}</p>
                <div className="flex gap-4 mt-3 text-xs">
                  <span className="text-blue-400">📋 {pendingTodos} tugas</span>
                  <span className="text-amber-400">💰 {linkedBudgetTodos} berbiaya</span>
                </div>
              </div>
            )}
          </header>

          {/* Konten Tab */}
          <main className="flex-1 overflow-y-auto pb-20">
            {state.activeTab === 'home' && (
              <div className="p-4 space-y-3">
                <p className="text-sm text-slate-400 font-medium">Ringkasan Hari Ini</p>
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-800/40 rounded-xl p-3 border border-slate-700/30">
                    <p className="text-xs text-slate-500">Wallet</p>
                    <p className="text-lg font-bold">{state.wallets.length}</p>
                  </div>
                  <div className="bg-slate-800/40 rounded-xl p-3 border border-slate-700/30">
                    <p className="text-xs text-slate-500">Transaksi</p>
                    <p className="text-lg font-bold">{state.transactions.length}</p>
                  </div>
                </div>

                {/* Quick insight: Budget-linked todos */}
                {linkedBudgetTodos > 0 && (
                  <div className="bg-amber-900/20 border border-amber-700/30 rounded-xl p-3">
                    <p className="text-xs text-amber-400 font-medium">
                      💡 {linkedBudgetTodos} tugas punya estimasi biaya.
                      Selesaikan untuk catat pengeluaran otomatis!
                    </p>
                  </div>
                )}
              </div>
            )}

            {state.activeTab === 'todo' && (
              <TodoWithBudget
                todos={state.todos}
                setTodos={state.setTodos}
                setTx={state.setTx}
                wallets={state.wallets}
                setWallets={state.setWallets}
                expCat={state.expCat}
              />
            )}

            {state.activeTab === 'sync' && (
              <P2PSyncPanel
                onDataReceived={() => window.location.reload()}
              />
            )}

            {state.activeTab === 'finance' && (
              <div className="p-4">
                <h2 className="text-lg font-bold mb-4">💰 Keuangan</h2>
                <p className="text-sm text-slate-400">
                  Modul keuangan (wallet, transaksi, budget) — integrasikan kode asli kamu di sini.
                </p>
              </div>
            )}

            {state.activeTab === 'notes' && (
              <div className="p-4">
                <h2 className="text-lg font-bold mb-4">📝 Catatan</h2>
                <p className="text-sm text-slate-400">
                  Modul catatan — integrasikan kode asli kamu di sini.
                </p>
              </div>
            )}
          </main>

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 z-40">
            <div className="max-w-md mx-auto flex justify-around py-2">
              {[
                { key: 'home',    icon: I.home,    label: 'Home' },
                { key: 'finance', icon: I.wallet,   label: 'Keuangan' },
                { key: 'todo',    icon: I.todo,     label: 'To-Do' },
                { key: 'notes',   icon: I.note,     label: 'Catatan' },
                { key: 'sync',    icon: I.sync,     label: 'Sync' },
              ].map(tab => (
                <button
                  key={tab.key}
                  onClick={() => state.setActiveTab(tab.key)}
                  className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg transition
                    ${state.activeTab === tab.key
                      ? 'text-blue-400'
                      : 'text-slate-600 hover:text-slate-400'}`}
                >
                  <span
                    className="w-5 h-5"
                    dangerouslySetInnerHTML={{ __html: tab.icon }}
                  />
                  <span className="text-[10px]">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    // ─── Mount React ───
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- PWA Install Logic -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] SW registered:', reg.scope))
          .catch(err => console.error('[PWA] SW failed:', err));
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').classList.remove('hidden');
    });

    document.getElementById('btn-install')?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('install-banner').classList.add('hidden');
      }
      deferredPrompt = null;
    });

    document.getElementById('btn-dismiss')?.addEventListener('click', () => {
      document.getElementById('install-banner').classList.add('hidden');
    });
  </script>
</body>
</html>
