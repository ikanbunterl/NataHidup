<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW registration failed:', err));
        });
    }
    let deferredPrompt;
    const banner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.deferredPrompt = e;
        banner.classList.remove('hidden');
        clearTimeout(window.__nhBannerTimer);
        window.__nhBannerTimer = setTimeout(() => banner.classList.add('hidden'), 8000);
    });
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            banner.classList.add('hidden');
        }
    });
    dismissBtn.addEventListener('click', () => { banner.classList.add('hidden'); });
    window.addEventListener('appinstalled', () => { banner.classList.add('hidden'); deferredPrompt = null; });
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
        banner.classList.add('hidden');
    }
</script>

const evalAmt=s=>{try{if(!/[+\-*/]/.test(s))return parseFloat(s);if(!/^[\d+\-*/().\s]+$/.test(s)||!/\d/.test(s))return NaN;const r=Function('"use strict";return('+s+')')();return typeof r==='number'&&isFinite(r)?Math.round(r):NaN;}catch(e){return NaN;}};
const mungeSdp=sdp=>{try{return sdp.split(/\r?\n/).filter(line=>{if(!line.startsWith('a=candidate'))return true;const p=line.split(' ');const addr=p[4]||'';return p[2]==='udp'&&addr!==''&&!addr.includes(':');}).join('\r\n');}catch(e){return sdp;}};

// ===== FUNGSI OCR (Tetap sama seperti sebelumnya) =====
const ensureTesseract=()=>new Promise((res,rej)=>{
    if(typeof Tesseract!=='undefined')return res();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('Gagal memuat library OCR. Butuh internet sekali saat pertama dipakai.'));
    document.head.appendChild(s);
});
const normDate=s=>{if(!s)return'';s=String(s).trim();let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;m=s.match(/\b(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2,4})\b/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}return'';};

const toNum = n => {
    n = String(n).replace(/rp\.?/gi, '').replace(/\s/g, '').replace(/[oO]/g, '0');
    if (!n) return 0;
    if (n.includes(',') && n.includes('.')) {
        n = n.replace(/\./g, '').replace(',', '.');
    } else if (n.includes(',')) {
        if (/,\d{3}$/.test(n)) n = n.replace(/,/g, ''); 
        else n = n.replace(',', '.'); 
    } else {
        n = n.replace(/\./g, '');
    }
    const v = parseFloat(n);
    return isFinite(v) ? v : 0;
};

const guessCat = (text, expCats, learnedKw = {}) => {
    const t = String(text).toLowerCase();
    for (const [word, catId] of Object.entries(learnedKw)) {
        if (t.includes(word)) return catId;
    }
    for (const cat of expCats) {
        if (cat.type === 'expense' && t.includes(cat.name.toLowerCase())) return cat.id;
    }
    const kwMap = [
        { rx: /(spbu|bensin|pertalite|pertamax|shell|parkir|\btol\b|gojek|grab|krl|mrt|angkot|ojol)/, key: 'transport' },
        { rx: /(kopi|coffee|cafe|starbucks|janji jiwa|kenangan)/, key: 'kopi' },
        { rx: /(resto|restoran|warung|sate|bakso|mie |mcd|kfc|ayam goreng|padang)/, key: 'makan' },
        { rx: /(apotek|apotik|klinik|rumah sakit|rs\.|farmasi|guardian|watsons)/, key: 'kesehatan' },
        { rx: /(pln|listrik|pulsa|telkomsel|token|indihome|bpjs)/, key: 'tagihan' },
        { rx: /(cinema|xxi|cgv|bioskop|netflix|spotify|google play|ovo)/, key: 'hiburan' },
        { rx: /(mart|supermarket|alfamart|indomaret|hypermart|lotte|transmart|grosir|buah)/, key: 'belanja' },
        { rx: /(smk|sma|smp|sd|sekolah|spp|universitas|kampus|yayasan)/, key: 'pendidikan' }
    ];
    for (const kw of kwMap) {
        if (kw.rx.test(t)) {
            const matched = expCats.find(c => c.type === 'expense' && (c.id === kw.key || c.name.toLowerCase().includes(kw.key)));
            if (matched) return matched.id;
        }
    }
    return '';
};

const parseReceipt = (text, expCats, learnedKw = {}) => {
    const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
    let amount = 0;
    const allNumbers = [];
    const numRegex = /[\d.,]+/g;
    for (const line of lines) {
        const matches = line.replace(/rp\.?/gi, '').match(numRegex);
        if (matches) {
            matches.forEach(m => {
                const val = toNum(m);
                if (val > 100) allNumbers.push(val);
            });
        }
    }
    let mathTotal = 0;
    const sortedNums = [...new Set(allNumbers)].sort((a, b) => b - a);
    for (let i = 0; i < sortedNums.length; i++) {
        for (let j = i + 1; j < sortedNums.length; j++) {
            const diff = sortedNums[i] - sortedNums[j];
            if (diff > 0 && sortedNums.includes(diff)) {
                mathTotal = Math.max(mathTotal, diff);
            }
        }
    }
    let regexTotal = 0;
    const totalRx = /(total|amount|jumlah|grand|bayar)[^\d]{0,20}([\d.,\s]+)/i;
    for (const line of lines) {
        if (totalRx.test(line)) {
            const nums = line.replace(/rp\.?/gi, '').match(/[\d.,]+/g) || [];
            const mx = Math.max(...nums.map(toNum), 0);
            if (mx > regexTotal) regexTotal = mx;
        }
    }
    amount = mathTotal > 0 ? mathTotal : regexTotal;
    if (!amount && sortedNums.length > 1) amount = sortedNums[1];
    else if (!amount && sortedNums.length > 0) amount = sortedNums[0];
    const note = (lines.find(l => l.length > 3 && !/(cabang|alamat|telp|kota|npwp|gst|vat|no\.|nomor)/i.test(l)) || 'Scan struk').slice(0, 40);
    return { amount: Math.round(amount), date: normDate(text) || getToday(), note, category: guessCat(text, expCats, learnedKw) };
};

const fieldVal=f=>{if(!f)return null;if(f.value!==undefined&&f.value!==null)return f.value;if(f.data&&f.data.value!==undefined&&f.data.value!==null)return f.data.value;if(typeof f.data==='string'||typeof f.data==='number')return f.data;return null;};

const runOcr = async (blob, provider, apiKey, expCats, learnedKw, onProg) => {
    if (provider !== 'offline' && apiKey && navigator.onLine) {
        try {
            const fd = new FormData();
            if (provider === 'taggun') {
                onProg(10, 'Mengirim ke Taggun...');
                fd.append('file', blob, 'struk.jpg'); fd.append('incognito', 'true');
                const r = await fetch('https://api.taggun.io/api/receipt/v1/scan', { method: 'POST', headers: { apikey: apiKey }, body: fd });
                if (!r.ok) throw new Error('Taggun error ' + r.status);
                const j = await r.json();
                const amount = fieldVal(j.totalAmount) || 0;
                const dt = normDate(fieldVal(j.date)) || getToday();
                const note = String(fieldVal(j.merchantName) || 'Scan struk').slice(0, 40);
                return { amount: Math.round(amount), date: dt, note, category: guessCat(note, expCats, learnedKw) };
            }
            onProg(10, 'Mengirim ke Mindee...');
            fd.append('document', blob, 'struk.jpg');
            const r = await fetch('https://api.mindee.net/v1/products/mindee/expense_receipts/v5/predict', { method: 'POST', headers: { Authorization: 'Token ' + apiKey }, body: fd });
            if (!r.ok) throw new Error('Mindee error ' + r.status);
            const j = await r.json();
            const p = ((((j.document || {}).inference || {}).prediction) || {});
            const amount = fieldVal(p.total_amount) || 0;
            const dt = normDate(fieldVal(p.date)) || getToday();
            const note = String(fieldVal(p.supplier_name) || 'Scan struk').slice(0, 40);
            return { amount: Math.round(amount), date: dt, note, category: guessCat(note + ' ' + JSON.stringify(p), expCats, learnedKw) };
        } catch (e) { onProg(null, (e && e.message ? e.message : 'API gagal') + ' — beralih ke OCR offline...'); }
    }
    if (provider === 'offline' || !navigator.onLine) {
        onProg(5, 'Mengunduh mesin OCR (~5MB)... Mohon tunggu.');
    } else {
        onProg(5, 'Menyiapkan mesin OCR...');
    }
    await ensureTesseract();
    const res = await Tesseract.recognize(blob, 'ind+eng', { logger: m => {
        if (m.status === 'recognizing text') onProg(10 + Math.round(m.progress * 85), 'Membaca teks struk...');
        else if (m.status) onProg(null, 'OCR: ' + m.status);
    } });
    return parseReceipt(res.data.text, expCats, learnedKw);
};

function fireConfetti(){
    const container=document.getElementById('confettiContainer');
    const colors=['#fbbf24','#f59e0b','#3b82f6','#8b5cf6','#ef4444','#10b981','#ec4899'];

        const c=document.createElement('div');
        c.className='confetti';
        c.style.left=Math.random()*100+'%';
        c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDelay=Math.random()*0.5+'s';
        c.style.animationDuration=(2+Math.random()*2)+'s';
        c.style.width=(6+Math.random()*8)+'px';
        c.style.height=(6+Math.random()*8)+'px';
        c.style.borderRadius=Math.random()>.5?'50%':'2px';
        container.appendChild(c);
    }
    setTimeout(()=>{container.innerHTML=''},4000);
}

// ===== KOMPONEN LOGIN =====
function LoginPage({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [isRegister, setIsRegister] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    const { data, error } = isRegister 
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
      
    setLoading(false);
    if (error) toast.error(error.message);
    else if (data.user) {
      toast.success(isRegister ? 'Akun dibuat! Silakan login.' : 'Berhasil masuk!');
      if (!isRegister && data.session) onLogin(data.session);
    }
  };

  return (
    <div className="min-h-screen bg-dark-900 flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-dark-800 rounded-2xl p-6 shadow-2xl border border-dark-700">
        <div className="text-center mb-6">
          <h1 className="text-2xl font-bold text-white">NataHidup ☁️</h1>
          <p className="text-dark-400 text-sm mt-1">{isRegister ? 'Buat akun baru' : 'Masuk ke akunmu'}</p>
        </div>
        <form onSubmit={handleSubmit} className="space-y-4">
          <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full" />
          <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full" />
          <button type="submit" disabled={loading} className="w-full py-3 rounded-xl font-semibold text-white bg-blue-600 disabled:opacity-50">
            {loading ? 'Memproses...' : (isRegister ? 'Daftar' : 'Masuk')}
          </button>
        </form>
        <p className="text-center text-xs text-dark-400 mt-6">
          {isRegister ? 'Sudah punya akun?' : 'Belum punya akun?'} 
          <button onClick={() => setIsRegister(!isRegister)} className="text-blue-400 ml-1 font-bold">
            {isRegister ? 'Masuk' : 'Daftar'}
          </button>
        </p>
      </div>
    </div>
  );
}

// ===== APP WRAPPER =====
function AppWrapper() {
  const [session, setSession] = useState(null);
  const [loadingAuth, setLoadingAuth] = useState(true);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      setLoadingAuth(false);
    });
    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
      setSession(session);
    });
    return () => subscription.unsubscribe();
  }, []);

  if (loadingAuth) {
    return (
      <div className="min-h-screen bg-dark-900 flex items-center justify-center">
        <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      </div>
    );
  }

  if (!session) {
    return <LoginPage onLogin={setSession} />;
  }

  return (
    <QueryClientProvider client={queryClient}>
      <Toaster position="top-center" />
      <App session={session} />
    </QueryClientProvider>
  );
}

// ===== DEFAULT DATA =====
const DEF_WALLETS=[{id:'w1',name:'Cash',type:'cash',balance:0},{id:'w2',name:'Bank Utama',type:'bank',balance:0},{id:'w3',name:'E-Wallet',type:'ewallet',balance:0}];
const DEF_EXP_CAT=[
    {id:'makan',name:'Makan & Minum',color:'#f59e0b',type:'expense'},
    {id:'transport',name:'Transport',color:'#3b82f6',type:'expense'},
    {id:'hiburan',name:'Hiburan',color:'#8b5cf6',type:'expense'},
    {id:'tagihan',name:'Tagihan',color:'#ef4444',type:'expense'},
    {id:'kopi',name:'Kopi & Jajan',color:'#a855f7',type:'expense'},
    {id:'belanja',name:'Belanja',color:'#ec4899',type:'expense'},
    {id:'kesehatan',name:'Kesehatan',color:'#10b981',type:'expense'},
    {id:'pendidikan',name:'Pendidikan',color:'#06b6d4',type:'expense'},
    {id:'cicilan',name:'Cicilan',color:'#f97316',type:'expense'},
    {id:'lainnya_e',name:'Lainnya',color:'#6b7280',type:'expense'},
];
const DEF_INC_CAT=[
    {id:'gaji',name:'Gaji',color:'#10b981',type:'income'},
    {id:'freelance',name:'Freelance',color:'#3b82f6',type:'income'},
    {id:'bonus',name:'Bonus',color:'#f59e0b',type:'income'},
    {id:'lainnya_i',name:'Lainnya',color:'#6b7280',type:'income'},
];
const DEF_BUDGETS=[
    {id:'b1',category:'makan',limit:1500000,period:'monthly',categories:['makan','kopi','belanja']},
    {id:'b2',category:'transport',limit:500000,period:'monthly',categories:['transport']},
    {id:'b3',category:'hiburan',limit:300000,period:'monthly',categories:['hiburan']},
];

// ===== MAIN APP COMPONENT =====
function App({ session }) {
  const queryClient = useQueryClient();
  const userId = session.user.id;
  const[tab,setTab]=useState('home');const[modal,setModal]=useState(null);const[mData,setMData]=useState(null);
  const[learnedKw,setLearnedKw]=useState({});
  const[ocrProvider,setOcrProvider]=useState('offline');
  const[ocrKey,setOcrKey]=useState('');
  const[pageKey,setPageKey]=useState(0);
  const [undoTxn, setUndoTxn] = useState(null);
  
  // FASE 2: Fetch data dari Supabase menggunakan React Query
  const { data: wallets = [], isLoading: walletsLoading } = useQuery({
    queryKey: ['wallets', userId],
    queryFn: async () => {
      const { data, error } = await sb.from('wallets').select('*').eq('user_id', userId);
      if (error) throw error;
      if (data.length === 0) {
        // Insert default wallets jika belum ada
        const defaultWallets = DEF_WALLETS.map(w => ({ ...w, user_id: userId }));
        const { data: inserted } = await sb.from('wallets').insert(defaultWallets).select();
        return inserted || [];
      }
      return data;
    },
  });

  const { data: txns = [], isLoading: txnsLoading } = useQuery({
    queryKey: ['transactions', userId],
    queryFn: async () => {
      const { data, error } = await sb
        .from('transactions')
        .select('*')
        .eq('user_id', userId)
        .eq('is_deleted', false)
        .order('created_at', { ascending: false });
      if (error) throw error;
      return data || [];
    },
  });

  const { data: expCats = [] } = useQuery({
    queryKey: ['categories', userId, 'expense'],
    queryFn: async () => {
      const { data, error } = await sb.from('categories').select('*').eq('user_id', userId).eq('type', 'expense');
      if (error) throw error;
      if (data.length === 0) {
        const defaultCats = DEF_EXP_CAT.map(c => ({ ...c, user_id: userId }));
        const { data: inserted } = await sb.from('categories').insert(defaultCats).select();
        return inserted || [];
      }
      return data;
    },
  });

  const { data: incCats = [] } = useQuery({
    queryKey: ['categories', userId, 'income'],
    queryFn: async () => {
      const { data, error } = await sb.from('categories').select('*').eq('user_id', userId).eq('type', 'income');
      if (error) throw error;
      if (data.length === 0) {
        const defaultCats = DEF_INC_CAT.map(c => ({ ...c, user_id: userId }));
        const { data: inserted } = await sb.from('categories').insert(defaultCats).select();
        return inserted || [];
      }
      return data;
    },
  });

  // Mutations untuk transaksi
  const addTxnMutation = useMutation({
    mutationFn: async (newTxn) => {
      const { data, error } = await sb
        .from('transactions')
        .insert([{ ...newTxn, user_id: userId, is_deleted: false }])
        .select()
        .single();
      if (error) throw error;
      return data;
    },
    onSuccess: () => {
      queryClient.invalidateQueries(['transactions', userId]);
      queryClient.invalidateQueries(['wallets', userId]);
    },
    onError: (err) => {
      toast.error('Gagal menyimpan transaksi: ' + err.message);
    },
  });

  const deleteTxnMutation = useMutation({
    mutationFn: async (txnId) => {
      const { error } = await sb
        .from('transactions')
        .update({ is_deleted: true })
        .eq('id', txnId);
      if (error) throw error;
    },
    onSuccess: () => {
      queryClient.invalidateQueries(['transactions', userId]);
      queryClient.invalidateQueries(['wallets', userId]);
    },
    onError: (err) => {
      toast.error('Gagal menghapus: ' + err.message);
    },
  });

  const addTxn = (t) => {
    const n = { ...t, id: genId(), date: t.date || getToday(), createdAt: new Date().toISOString() };
    addTxnMutation.mutate(n);
  };

  const saveTxn = (t) => {
    triggerHaptic();
    if (mData?.id) {
      // Update existing
      const updateMutation = useMutation({
        mutationFn: async () => {
          const { error } = await sb
            .from('transactions')
            .update(t)
            .eq('id', mData.id);
          if (error) throw error;
        },
        onSuccess: () => {
          queryClient.invalidateQueries(['transactions', userId]);
          closeM();
        },
        onError: (err) => toast.error('Gagal update: ' + err.message),
      });
      updateMutation.mutate();
    } else {
      addTxn(t);
      closeM();
    }
  };

  const delTxn = (id, callback) => {
    if (!id) return;
    const t = txns.find(x => x.id === id);
    if (!t) return;
    triggerHaptic();
    setUndoTxn({ txn: t });
    deleteTxnMutation.mutate(id);
    if (callback) callback();
    setTimeout(() => setUndoTxn(null), 3000);
  };

  const undoDelete = () => {
    if (!undoTxn) return;
    const t = undoTxn.txn;
    const restoreMutation = useMutation({
      mutationFn: async () => {
        const { error } = await sb
          .from('transactions')
          .update({ is_deleted: false })
          .eq('id', t.id);
        if (error) throw error;
      },
      onSuccess: () => {
        queryClient.invalidateQueries(['transactions', userId]);
        setUndoTxn(null);
      },
    });
    restoreMutation.mutate();
  };

  const allCats = useMemo(() => [...expCats, ...incCats], [expCats, incCats]);
  const getCat = id => allCats.find(c => c.id === id);
  const totalBal = useMemo(() => wallets.reduce((s, w) => s + (w.balance || 0), 0), [wallets]);
  
  const mTxns = useMemo(() => txns.filter(t => t.date && t.date.startsWith(getMY()) && t.type !== 'transfer'), [txns]);
  const mIncome = useMemo(() => mTxns.filter(t => t.type === 'income').reduce((s, t) => s + (t.amount || 0), 0), [mTxns]);
  const mExpense = useMemo(() => mTxns.filter(t => t.type === 'expense').reduce((s, t) => s + (t.amount || 0), 0), [mTxns]);
  const todayTxns = useMemo(() => txns.filter(t => t.date === getToday()), [txns]);
  const todayExp = useMemo(() => todayTxns.filter(t => t.type === 'expense').reduce((s, t) => s + (t.amount || 0), 0), [todayTxns]);
  const catSpend = useMemo(() => { const s = {}; mTxns.filter(t => t.type === 'expense').forEach(t => { s[t.category] = (s[t.category] || 0) + t.amount }); return s }, [mTxns]);
  const remain = mIncome - mExpense;

  const openM = (t, d = null) => { setMData(d); setModal(t) };
  const closeM = () => { setModal(null); setMData(null) };
  
  const tabs = ['home', 'notes', 'finance', 'settings'];
  const tabIdx = tabs.indexOf(tab);
  const touchStartX = useRef(0);
  const handleTouchStart = e => { touchStartX.current = e.touches[0].clientX };
  const handleTouchEnd = e => {
    const diff = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(diff) > 80) {
      if (diff < 0 && tabIdx < tabs.length - 1) { setTab(tabs[tabIdx + 1]); setPageKey(k => k + 1) }
      else if (diff > 0 && tabIdx > 0) { setTab(tabs[tabIdx - 1]); setPageKey(k => k + 1) }
    }
  };

  // Loading state
  if (walletsLoading || txnsLoading) {
    return (
      <div className="min-h-screen bg-dark-900 flex items-center justify-center">
        <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      </div>
    );
  }

  return (
    <div className="pb-20 min-h-screen" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
      <div className="px-4 pt-4 page-enter" key={pageKey}>
        {tab === 'home' && <Dash wallets={wallets} totalBal={totalBal} mIncome={mIncome} mExpense={mExpense} remain={remain} todayExp={todayExp} todayTxns={todayTxns} todos={[]} budgets={DEF_BUDGETS} catSpend={catSpend} streak={{current:0,longest:0}} allCats={allCats} openM={openM}/>}
        {tab === 'notes' && <NotesMod notes={[]} todos={[]} addNote={()=>{}} updNote={()=>{}} delNote={()=>{}} addTodo={()=>{}} togTodo={()=>{}} delTodo={()=>{}} openM={openM}/>}
        {tab === 'finance' && <FinMod wallets={wallets} txns={txns} mTxns={mTxns} budgets={DEF_BUDGETS} catSpend={catSpend} mIncome={mIncome} mExpense={mExpense} debts={[]} totalBal={totalBal} allCats={allCats} getCat={getCat} setWallets={()=>{}} setBudgets={()=>{}} addDebt={()=>{}} togDebt={()=>{}} delDebt={()=>{}} delTxn={delTxn} openM={openM}/>}
        {tab === 'settings' && <SetMod wallets={wallets} setWallets={()=>{}} txns={txns} budgets={DEF_BUDGETS} setBudgets={()=>{}} notes={[]} todos={[]} debts={[]} expCats={expCats} incCats={incCats} setExpCats={()=>{}} setIncCats={()=>{}} streak={{current:0,longest:0}} openM={openM} ocrProvider={ocrProvider} setOcrProvider={setOcrProvider} ocrKey={ocrKey} setOcrKey={setOcrKey} session={session}/>}
      </div>
      
      <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-dark-800/60 backdrop-blur-lg border-t border-white/10 px-2 pb-2 pt-1 z-40">
        <div className="flex items-center justify-around">
          <NB ic={<I.Home/>} lb="Home" ac={tab === 'home'} fn={() => { setTab('home'); setPageKey(k => k + 1) }}/>
          <NB ic={<I.Notes/>} lb="Notes" ac={tab === 'notes'} fn={() => { setTab('notes'); setPageKey(k => k + 1) }}/>
          <button onClick={() => { triggerHaptic(); openM('quickAdd') }} className={`w-14 h-14 -mt-6 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-600/30 ch text-white ${txns.length === 0 ? 'animate-bounce' : 'fab-p'}`}>
            <I.Plus/>
          </button>
          <NB ic={<I.Dollar/>} lb="Finance" ac={tab === 'finance'} fn={() => { setTab('finance'); setPageKey(k => k + 1) }}/>
          <NB ic={<I.Gear/>} lb="Setting" ac={tab === 'settings'} fn={() => { setTab('settings'); setPageKey(k => k + 1) }}/>
        </div>
      </nav>
      
      {modal === 'quickAdd' && <QuickAddM close={closeM} openM={openM}/>}
      {modal === 'addTxn' && <TxnM close={closeM} save={saveTxn} wallets={wallets} expCats={expCats} incCats={incCats} ed={mData}/>}
      
      {undoTxn && (
        <div className="fixed bottom-24 left-0 right-0 max-w-md mx-auto px-4 z-50 pointer-events-none">
          <div className="pointer-events-auto bg-dark-700/95 backdrop-blur border border-white/10 rounded-2xl p-3 flex items-center justify-between shadow-2xl modal-ct">
            <span className="text-sm">🗑️ Transaksi dihapus</span>
            <button onClick={undoDelete} className="text-blue-400 text-sm font-bold px-3 py-1">UNDO</button>
          </div>
        </div>
      )}
    </div>
  );
}

function NB({ic,lb,ac,fn}){return<button onClick={fn} className={`flex flex-col items-center py-2 px-3 rounded-lg transition-all ${ac?'text-blue-400':'text-dark-400'}`}>{ic}<span className="text-[10px] mt-1 font-medium">{lb}</span></button>}

// Komponen Dash (versi sederhana untuk demo)
function Dash({wallets, totalBal, mIncome, mExpense, remain, todayExp, todayTxns, allCats, openM}){
    const now = new Date();
    const g = now.getHours() < 12 ? 'Selamat Pagi' : now.getHours() < 18 ? 'Selamat Siang' : 'Selamat Malam';
    const dn = now.toLocaleDateString('id-ID', { weekday: 'long' });

    return(
        <div className="space-y-5">
            <div className="pt-2"><p className="text-dark-400 text-sm">{dn}, {fmtD(now)}</p><h1 className="text-2xl font-bold mt-1">{g}</h1></div>
            <div className="bg-gradient-to-br from-blue-600 to-purple-700 rounded-2xl p-5 shadow-lg shadow-blue-600/20">
                <p className="text-blue-200 text-sm">Total Saldo</p>
                <p className="text-3xl font-bold mt-1">{fmtC(totalBal)}</p>
                <div className="flex justify-between mt-4 pt-4 border-t border-white/20">
                    <div><p className="text-blue-200 text-xs">Pemasukan</p><p className="text-sm font-semibold text-green-300 flex items-center gap-1"><I.Up/>{fmtC(mIncome)}</p></div>
                    <div className="text-right"><p className="text-blue-200 text-xs">Pengeluaran</p><p className="text-sm font-semibold text-red-300 flex items-center gap-1"><I.Down/>{fmtC(mExpense)}</p></div>
                </div>
            </div>
            <div className="bg-dark-700 rounded-2xl p-4">
                <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><I.Cal/> Hari Ini</h3>
                <div className="flex justify-between items-center mb-3 pb-3 border-b border-dark-600">
                    <span className="text-dark-300 text-sm">Pengeluaran hari ini</span>
                    <span className="font-bold text-sm">{fmtC(todayExp)}</span>
                </div>
                {todayTxns.length > 0 ? (
                    <div className="space-y-2">{todayTxns.slice(0, 3).map(t => {
                        const cat = allCats.find(c => c.id === t.category) || { name: t.category, color: '#6b7280' };
                        return (
                            <div key={t.id} className="flex items-center gap-3 py-1">
                                <div className="w-8 h-8 rounded-lg flex items-center justify-center text-white" style={{ backgroundColor: cat.color }}>
                                    {cat.name.charAt(0)}
                                </div>
                                <div className="flex-1 min-w-0">
                                    <p className="text-sm truncate">{t.note || cat.name}</p>
                                </div>
                                <span className={`text-sm font-semibold ${t.type === 'income' ? 'text-green-400' : 'text-red-400'}`}>
                                    {t.type === 'income' ? '+' : '-'}{fmtC(t.amount)}
                                </span>
                            </div>
                        );
                    })}</div>
                ) : (<p className="text-dark-500 text-sm text-center py-2">Belum ada transaksi</p>)}
            </div>
        </div>
    );
}

function FinMod({wallets,txns,mTxns,budgets,catSpend,mIncome,mExpense,debts,totalBal,allCats,getCat,setWallets,setBudgets,addDebt,togDebt,delDebt,delTxn,openM}){
    const[sub,setSub]=useState('overview');
    return(
        <div className="space-y-4">
            <div className="pt-2"><h1 className="text-2xl font-bold">Keuangan</h1><p className="text-dark-400 text-sm mt-1">Kelola keuanganmu dengan bijak</p></div>
            <div className="flex gap-1 bg-dark-700 rounded-xl p-1 overflow-x-auto sb-hide">
                {[{id:'overview',l:'Ringkasan'},{id:'transactions',l:'Transaksi'},{id:'budget',l:'Budget'},{id:'debts',l:'Hutang'}].map(t=>(
                    <button key={t.id} onClick={()=>setSub(t.id)} className={`px-3 py-2 rounded-lg text-xs font-medium whitespace-nowrap transition-all ${sub===t.id?'bg-blue-600 text-white':'text-dark-400'}`}>{t.l}</button>
                ))}
            </div>
            {sub==='overview'&&<FinOverview wallets={wallets} mIncome={mIncome} mExpense={mExpense} totalBal={totalBal} catSpend={catSpend} allCats={allCats} txns={txns} openM={openM}/>}
            {sub==='transactions'&&<TxnList txns={txns} getCat={getCat} openM={openM} delTxn={delTxn} wallets={wallets}/>}
            {sub==='budget'&&<BudgetView budgets={budgets} catSpend={catSpend} allCats={allCats} openM={openM}/>}
            {sub==='debts'&&<DebtView debts={debts} openM={openM} tog={togDebt} del={delDebt}/>}
        </div>
    );
}

function FinOverview({wallets,mIncome,mExpense,totalBal,catSpend,allCats,txns,openM}){
    return(
        <div className="space-y-4">
            <div className="bg-dark-700 rounded-2xl p-4">
                <div className="flex justify-between items-center mb-3"><h3 className="font-semibold text-sm">Dompet & Rekening</h3><button onClick={()=>openM('addWallet')} className="text-blue-400 text-xs font-medium">+ Tambah</button></div>
                <div className="space-y-2">{wallets.map(w=>(<div key={w.id} className="flex items-center justify-between py-2.5 px-3 bg-dark-600 rounded-xl"><div className="flex items-center gap-3"><span className="text-dark-300"><WalletIcon type={w.type}/></span><div><p className="text-sm font-medium">{w.name}</p><p className="text-[10px] text-dark-400 uppercase">{w.type}</p></div></div><p className="font-bold text-sm">{fmtC(w.balance)}</p></div>))}</div>
            </div>
            <div className="grid grid-cols-2 gap-3">
                <div className="bg-dark-700 rounded-xl p-4"><div className="w-8 h-8 bg-green-500/20 rounded-lg flex items-center justify-center text-green-400 mb-2"><I.Up/></div><p className="text-dark-400 text-xs">Pemasukan</p><p className="text-lg font-bold text-green-400">{fmtC(mIncome)}</p></div>
                <div className="bg-dark-700 rounded-xl p-4"><div className="w-8 h-8 bg-red-500/20 rounded-lg flex items-center justify-center text-red-400 mb-2"><I.Down/></div><p className="text-dark-400 text-xs">Pengeluaran</p><p className="text-lg font-bold text-red-400">{fmtC(mExpense)}</p></div>
            </div>
        </div>
    );
}

function TxnList({txns,getCat,openM,delTxn,wallets}){
    const[filter,setFilter]=useState('all');const[q,setQ]=useState('');
    const filtered = useMemo(() => {
        let f = txns;
        if (filter !== 'all') f = f.filter(t => t.type === filter);
        if (q.trim()) {
            const s = q.toLowerCase();
            f = f.filter(t => (t.note || '').toLowerCase().includes(s) || (t.category || '').toLowerCase().includes(s));
        }
        return f;
    }, [txns, filter, q]);

    return(
        <div className="space-y-4">
            <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-dark-400"><I.Search/></span><input type="text" placeholder="Cari berdasarkan catatan..." value={q} onChange={e=>setQ(e.target.value)} className="pl-10"/></div>
            <div className="flex gap-2 overflow-x-auto sb-hide">{[{id:'all',l:'Semua'},{id:'expense',l:'Keluar'},{id:'income',l:'Masuk'},{id:'transfer',l:'Transfer'}].map(f=>(<button key={f.id} onClick={()=>setFilter(f.id)} className={`px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap transition-all ${filter===f.id?'bg-blue-600 text-white':'bg-dark-700 text-dark-400'}`}>{f.l}</button>))}</div>
            <div className="space-y-2">
                {filtered.length === 0 ? (
                    <p className="text-dark-500 text-center py-8">Belum ada transaksi</p>
                ) : (
                    filtered.map(t => {
                        const cat = getCat(t.category) || { name: t.category, color: '#6b7280' };
                        return (
                            <div key={t.id} className="bg-dark-700 rounded-xl p-3 flex items-center gap-3">
                                <div className="w-8 h-8 rounded-lg flex items-center justify-center text-white" style={{ backgroundColor: cat.color }}>
                                    {cat.name.charAt(0)}
                                </div>
                                <div className="flex-1">
                                    <p className="text-sm font-medium">{t.note || cat.name}</p>
                                    <p className="text-xs text-dark-400">{fmtD(t.date)}</p>
                                </div>
                                <div className="text-right">
                                    <p className={`text-sm font-bold ${t.type === 'income' ? 'text-green-400' : 'text-red-400'}`}>
                                        {t.type === 'income' ? '+' : '-'}{fmtC(t.amount)}
                                    </p>
                                    <button onClick={() => delTxn(t.id)} className="text-xs text-red-400 mt-1">Hapus</button>
                                </div>
                            </div>
                        );
                    })
                )}
            </div>
        </div>
    );
}

function BudgetView({budgets,catSpend,allCats,openM}){
    return(
        <div className="space-y-4">
            <p className="text-dark-400 text-sm">Fitur budget coming soon...</p>
        </div>
    );
}

function DebtView({debts,openM,tog,del}){
    return(
        <div className="space-y-4">
            <p className="text-dark-400 text-sm">Fitur hutang coming soon...</p>
        </div>
    );
}

function NotesMod({notes,todos,addNote,updNote,delNote,addTodo,togTodo,delTodo,openM}){
    return(
        <div className="space-y-4">
            <div className="pt-2"><h1 className="text-2xl font-bold">Catatan</h1><p className="text-dark-400 text-sm mt-1">Coming soon...</p></div>
        </div>
    );
}

function WalletIcon({type}){
    if(type==='cash') return <I.Wallet/>;
    if(type==='bank') return <I.Building/>;
    return <I.Phone/>;
}

function QuickAddM({close,openM}){
    return(
        <MW close={close} title="Tambah Cepat">
            <div className="grid grid-cols-2 gap-4">
                <button onClick={() => { close(); setTimeout(() => openM('addTxn', { type: 'expense' }), 200); }} className="bg-red-500/10 border border-red-500/30 rounded-2xl p-6 flex flex-col items-center gap-3 ch">
                    <div className="w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center text-red-400"><I.Down/></div>
                    <span className="text-sm font-medium">Pengeluaran</span>
                </button>
                <button onClick={() => { close(); setTimeout(() => openM('addTxn', { type: 'income' }), 200); }} className="bg-green-500/10 border border-green-500/30 rounded-2xl p-6 flex flex-col items-center gap-3 ch">
                    <div className="w-10 h-10 rounded-xl bg-green-500/20 flex items-center justify-center text-green-400"><I.Up/></div>
                    <span className="text-sm font-medium">Pemasukan</span>
                </button>
            </div>
        </MW>
    );
}

function TxnM({close,save,wallets,expCats,incCats,ed}){
    const[type,setType]=useState(ed?.type||'expense');
    const[amt,setAmt]=useState(ed?.amount?.toString()||'');
    const[cat,setCat]=useState(ed?.category||'');
    const[note,setNote]=useState(ed?.note||'');
    const[wid,setWid]=useState(ed?.walletId||wallets[0]?.id||'');
    const[date,setDate]=useState(ed?.date||getToday());
    const cats=type==='expense'?expCats:incCats;
    const amtVal=evalAmt(amt);
    const amtOk=!isNaN(amtVal)&&amtVal>0;

    const sub=e=>{
        e.preventDefault();
        if(!amtOk)return;
        if(!cat)return;
        save({type,amount:amtVal,category:cat,note,walletId:wid,date});
    };
    
    return(
        <MW close={close} title={ed?'Edit Transaksi':'Tambah Transaksi'}>
            <form onSubmit={sub} className="space-y-4">
                <div className="flex gap-2 bg-dark-700 rounded-xl p-1">
                    <button type="button" onClick={()=>{setType('expense');setCat('')}} className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ${type==='expense'?'bg-red-500 text-white':'text-dark-400'}`}>Keluar</button>
                    <button type="button" onClick={()=>{setType('income');setCat('')}} className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ${type==='income'?'bg-green-500 text-white':'text-dark-400'}`}>Masuk</button>
                </div>
                <div>
                    <label className="text-xs text-dark-400 mb-1 block">Jumlah (Rp)</label>
                    <input type="text" inputMode="decimal" placeholder="0" value={amt} onChange={e=>setAmt(e.target.value)} className="text-2xl font-bold text-center" autoFocus/>
                </div>
                <div>
                    <label className="text-xs text-dark-400 mb-2 block">Kategori</label>
                    <div className="grid grid-cols-3 gap-2">
                        {cats.map(c=>(
                            <button key={c.id} type="button" onClick={()=>setCat(c.id)} className={`p-2.5 rounded-xl text-center transition-all ${cat===c.id?'bg-blue-500/20 border-2 border-blue-500':'bg-dark-700 border-2 border-transparent'}`}>
                                <div className="w-8 h-8 rounded-lg mx-auto flex items-center justify-center text-white text-sm font-bold" style={{backgroundColor:c.color}}>
                                    {c.name.charAt(0)}
                                </div>
                                <p className="text-[9px] mt-1 truncate">{c.name}</p>
                            </button>
                        ))}
                    </div>
                </div>
                <div>
                    <label className="text-xs text-dark-400 mb-1 block">Catatan</label>
                    <input type="text" placeholder="Deskripsi singkat" value={note} onChange={e=>setNote(e.target.value)}/>
                </div>
                <div>
                    <label className="text-xs text-dark-400 mb-1 block">Dompet</label>
                    <select value={wid} onChange={e=>setWid(e.target.value)}>
                        {wallets.map(w=>(<option key={w.id} value={w.id}>{w.name} ({fmtC(w.balance)})</option>))}
                    </select>
                </div>
                <div>
                    <label className="text-xs text-dark-400 mb-1 block">Tanggal</label>
                    <input type="date" value={date} onChange={e=>setDate(e.target.value)}/>
                </div>
                <button type="submit" disabled={!amtOk||!cat} className={`w-full py-3.5 rounded-xl font-semibold text-white transition-all ${!amtOk||!cat?'bg-dark-600 text-dark-400':'bg-blue-600'}`}>Simpan</button>
            </form>
        </MW>
    );
}

function MW({close,children,title}){
    return(
        <div className="fixed inset-0 z-50 flex items-end justify-center modal-ov" onClick={close}>
            <div className="absolute inset-0 bg-black/60"/>
            <div className="relative w-full max-w-md bg-dark-800 rounded-t-3xl max-h-[92vh] overflow-y-auto modal-ct sb-hide" onClick={e=>e.stopPropagation()}>
                <div className="sticky top-0 bg-dark-800 pt-3 pb-2 px-5 border-b border-dark-700 z-10">
                    <div className="w-10 h-1 bg-dark-600 rounded-full mx-auto mb-3"/>
                    <div className="flex justify-between items-center">
                        <h2 className="text-lg font-bold">{title}</h2>
                        <button onClick={close} className="text-dark-400 p-1"><I.X/></button>
                    </div>
                </div>
                <div className="p-5">{children}</div>
            </div>
        </div>
    );
}

function SetMod({wallets,setWallets,txns,budgets,setBudgets,notes,todos,debts,expCats,incCats,setExpCats,setIncCats,streak,openM,ocrProvider,setOcrProvider,ocrKey,setOcrKey,session}){
    const handleLogout = async () => {
        await sb.auth.signOut();
        window.location.reload();
    };

    return(
        <div className="space-y-4">
            <div className="pt-2"><h1 className="text-2xl font-bold">Pengaturan</h1><p className="text-dark-400 text-sm mt-1">Kelola aplikasi NataHidup</p></div>
            <div className="bg-dark-700 rounded-2xl p-5 text-center">
                <h2 className="text-xl font-bold">NataHidup ☁️</h2>
                <p className="text-dark-400 text-sm mt-1">v3.0.0 (Online)</p>
                <p className="text-xs text-dark-500 mt-2 break-all">{session.user.email}</p>
            </div>
            <button onClick={handleLogout} className="w-full py-3 rounded-xl font-semibold text-white bg-red-600">
                Logout
            </button>
            <div className="bg-dark-700 rounded-2xl p-4">
                <h3 className="font-semibold text-sm mb-3">Scan Struk (OCR)</h3>
                <select value={ocrProvider} onChange={e=>setOcrProvider(e.target.value)}>
                    <option value="offline">Offline — Tesseract.js</option>
                    <option value="taggun">Taggun API</option>
                    <option value="mindee">Mindee API</option>
                </select>
                {ocrProvider!=='offline'&&(
                    <div className="mt-2">
                        <input type="password" placeholder="Masukkan API key..." value={ocrKey} onChange={e=>setOcrKey(e.target.value)}/>
                    </div>
                )}
            </div>
        </div>
    );
}

// Render aplikasi
ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>
</body>
</html>
