                        <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center gap-2"><CatBadge cat={cat} size="sm"/><span className="text-sm font-medium">{cat.name}</span></div>
                            <div className="flex items-center gap-1">
                                <span className="text-[9px] bg-dark-600 px-1.5 py-0.5 rounded text-dark-300">{periodLabel[b.period]||'Bulanan'}</span>
                                {over&&<span className="text-[10px] bg-red-500/20 text-red-400 px-2 py-1 rounded-full font-bold">LEBIH</span>}
                                {warn&&<span className="text-[10px] bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded-full">Hampir</span>}
                            </div>
                        </div>
                        {trackedCats.length>1&&(<div className="flex flex-wrap gap-1 mb-2">{trackedCats.map(tc=><span key={tc.id} className="text-[9px] bg-dark-600 px-1.5 py-0.5 rounded text-dark-300">{tc.name}</span>)}</div>)}
                        <div className="flex justify-between text-xs mb-2"><span className="text-dark-400">{fmtC(spent)}</span><span className="font-medium">{fmtC(b.limit)}</span></div>
                        <div className="w-full bg-dark-600 rounded-full h-3"><div className={`h-3 rounded-full bb ${over?'bg-red-500':warn?'bg-yellow-500':'bg-green-500'}`} style={{width:`${pct}%`}}/></div>
                        <p className="text-[10px] mt-1 text-dark-500">Sisa: {fmtC(Math.max(0,b.limit-spent))}</p>
                    </div>
                );
            })}</div>
        </div>
    );
}

function DebtView({debts,openM,tog,del}){
    const pending=debts.filter(d=>d.status==='pending');const paid=debts.filter(d=>d.status==='paid');
    const totalHutang=pending.filter(d=>d.dtype==='hutang').reduce((s,d)=>s+d.amount,0);
    const totalPiutang=pending.filter(d=>d.dtype==='piutang').reduce((s,d)=>s+d.amount,0);
    return(
        <div className="space-y-4">
            <div className="flex justify-between items-center"><p className="text-dark-400 text-sm">Catat hutang & piutang</p><button onClick={()=>openM('addDebt')} className="bg-blue-600 text-white text-xs px-4 py-2 rounded-lg font-medium">+ Tambah</button></div>
            <div className="grid grid-cols-2 gap-3">
                <div className="bg-red-500/10 border border-red-500/20 rounded-xl p-3"><p className="text-red-400 text-xs">Hutang (Kamu hutang)</p><p className="text-red-400 font-bold text-lg mt-1">{fmtC(totalHutang)}</p></div>
                <div className="bg-green-500/10 border border-green-500/20 rounded-xl p-3"><p className="text-green-400 text-xs">Piutang (Dihutang kamu)</p><p className="text-green-400 font-bold text-lg mt-1">{fmtC(totalPiutang)}</p></div>
            </div>
            {pending.length>0&&<><p className="text-dark-400 text-xs font-medium">Belum Lunas ({pending.length})</p><div className="space-y-2">{pending.map(d=>(<SwipeItem key={d.id} onDel={()=>del(d.id)}><div className="p-3 flex items-center gap-3 ch" onClick={()=>tog(d.id)}><div className={`w-8 h-8 rounded-lg flex items-center justify-center ${d.dtype==='hutang'?'bg-red-500/20 text-red-400':'bg-green-500/20 text-green-400'}`}><I.Handshake/></div><div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">{d.name}</p><p className="text-[10px] text-dark-400">{d.dtype==='hutang'?'Kamu hutang':'Dihutang kamu'}{d.dueDate&&` -- Jatuh tempo: ${fmtD(d.dueDate)}`}</p></div><span className={`text-sm font-bold ${d.dtype==='hutang'?'text-red-400':'text-green-400'}`}>{fmtC(d.amount)}</span></div></SwipeItem>))}</div></>}
            {paid.length>0&&<><p className="text-dark-400 text-xs font-medium mt-4">Lunas ({paid.length})</p><div className="space-y-2">{paid.map(d=>(<SwipeItem key={d.id} onDel={()=>del(d.id)}><div className="p-3 flex items-center gap-3 opacity-50 ch" onClick={()=>tog(d.id)}><div className="w-8 h-8 rounded-lg flex items-center justify-center bg-dark-600 text-dark-400"><I.Check/></div><div className="flex-1 min-w-0"><p className="text-sm line-through">{d.name}</p></div><span className="text-sm text-dark-400">{fmtC(d.amount)}</span></div></SwipeItem>))}</div></>}
            {debts.length===0&&<div className="text-center py-12"><p className="text-dark-500 text-3xl font-bold mb-2">--</p><p className="text-dark-400">Belum ada catatan hutang</p></div>}
        </div>
    );
}

function NotesMod({notes,todos,addNote,updNote,delNote,addTodo,togTodo,delTodo,openM,loading}){
    const[sub,setSub]=useState('notes');const[q,setQ]=useState('');const[tag,setTag]=useState('all');
    const allTags=useMemo(()=>{const s=new Set();notes.forEach(n=>(n.tags||[]).forEach(t=>s.add(t)));return['all',...Array.from(s)]},[notes]);
    const filtered=useMemo(()=>{let f=notes;if(q)f=f.filter(n=>n.title.toLowerCase().includes(q.toLowerCase())||n.content.toLowerCase().includes(q.toLowerCase()));if(tag!=='all')f=f.filter(n=>(n.tags||[]).includes(tag));return f.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||new Date(b.updatedAt)-new Date(a.updatedAt))},[notes,q,tag]);
    const pend=todos.filter(t=>!t.completed);const done=todos.filter(t=>t.completed);
    return(
        <div className="space-y-4">
            <div className="pt-2"><h1 className="text-2xl font-bold">Catatan</h1><p className="text-dark-400 text-sm mt-1">Tulis dan atur semuanya di sini</p></div>
            <div className="flex gap-1 bg-dark-700 rounded-xl p-1">
                <button onClick={()=>setSub('notes')} className={`flex-1 py-2 rounded-lg text-xs font-medium transition-all ${sub==='notes'?'bg-blue-600 text-white':'text-dark-400'}`}>Catatan ({notes.length})</button>
                <button onClick={()=>setSub('todos')} className={`flex-1 py-2 rounded-lg text-xs font-medium transition-all ${sub==='todos'?'bg-blue-600 text-white':'text-dark-400'}`}>To-Do ({pend.length})</button>
            </div>
            {sub==='notes'&&(loading?<div className="grid grid-cols-2 gap-3">{[1,2,3,4].map(i=><div key={i} className="h-32 bg-dark-700 rounded-xl animate-pulse"/>)}</div>:<div className="space-y-3">
                <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-dark-400"><I.Search/></span><input type="text" placeholder="Cari catatan..." value={q} onChange={e=>setQ(e.target.value)} className="pl-10"/></div>
                <div className="flex gap-2 overflow-x-auto sb-hide pb-1">{allTags.map(t=>(<button key={t} onClick={()=>setTag(t)} className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${tag===t?'bg-blue-600 text-white':'bg-dark-700 text-dark-400'}`}>{t==='all'?'Semua':`#${t}`}</button>))}</div>
                {filtered.length>0?<div className="grid grid-cols-2 gap-3">{filtered.map(n=>(<div key={n.id} className="bg-dark-700 rounded-xl p-3 ch cursor-pointer relative" onClick={()=>openM('addNote',n)}>{n.pinned&&<span className="absolute top-2 right-2 text-blue-400"><I.Pin/></span>}<p className="font-medium text-sm truncate pr-5">{n.title||'Tanpa Judul'}</p><p className="text-dark-400 text-xs mt-1" style={{display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{n.content}</p><div className="flex items-center justify-between mt-2"><div className="flex gap-1">{(n.tags||[]).slice(0,2).map(t=>(<span key={t} className="text-[9px] bg-dark-600 px-1.5 py-0.5 rounded text-dark-300">#{t}</span>))}</div><span className="text-[9px] text-dark-500">{fmtD(n.updatedAt)}</span></div></div>))}</div>:(<div className="text-center py-12"><p className="text-dark-500 text-3xl font-bold mb-2">--</p><p className="text-dark-400">Belum ada catatan</p><button onClick={()=>openM('addNote')} className="mt-3 text-blue-400 text-sm font-medium">+ Buat Catatan</button></div>)}
            </div>)}
            {sub==='todos'&&(loading?<div className="space-y-2">{[1,2,3].map(i=><div key={i} className="h-14 bg-dark-700 rounded-xl animate-pulse"/>)}</div>:<div className="space-y-4">
                <TodoQuick add={addTodo}/>
                {pend.length>0&&<><p className="text-dark-400 text-xs font-medium">Belum Selesai ({pend.length})</p><div className="space-y-2">{pend.map(t=>(<SwipeItem key={t.id} onDel={()=>delTodo(t.id)}><TodoItem t={t} tog={togTodo}/></SwipeItem>))}</div></>}
                {done.length>0&&<><p className="text-dark-400 text-xs font-medium mt-4">Selesai ({done.length})</p><div className="space-y-2">{done.map(t=>(<SwipeItem key={t.id} onDel={()=>delTodo(t.id)}><TodoItem t={t} tog={togTodo}/></SwipeItem>))}</div></>}
                {todos.length===0&&<div className="text-center py-12"><p className="text-dark-500 text-3xl font-bold mb-2">--</p><p className="text-dark-400">Belum ada tugas</p></div>}
            </div>)}
        </div>
    );
}

function TodoQuick({ add }) {
    const [t, setT] = useState('');
    const [deadline, setDeadline] = useState('');
    const [budget, setBudget] = useState('');
    const [busy, setBusy] = useState(false);
    const h = async e => {
        e.preventDefault();
        if (!t.trim() || busy) return;
        setBusy(true);
        const ok = await add({ title: t.trim(), deadline: deadline || null, budget: parseFloat(budget) || 0 });
        setBusy(false);
        if (ok !== false) { setT(''); setDeadline(''); setBudget(''); }
    };
    return (
        <form onSubmit={h} className="space-y-2">
            <div className="flex gap-2">
                <input type="text" placeholder="Tambah tugas baru..." value={t} onChange={e => setT(e.target.value)} className="flex-1" />
                <button type="submit" disabled={busy} className="bg-blue-600 text-white px-4 rounded-lg text-sm font-medium shrink-0 disabled:opacity-50">{busy?'...':'+'}</button>
            </div>
            <div className="flex gap-2">
                <input type="date" value={deadline} onChange={e => setDeadline(e.target.value)} className="text-xs flex-1" />
                <input type="number" placeholder="Est. Biaya (Rp)" value={budget} onChange={e => setBudget(e.target.value)} className="text-xs flex-1" />
            </div>
        </form>
    );
}

function TodoItem({ t, tog }) {
    return (
        <div className={`bg-dark-700 rounded-xl p-3 flex items-center gap-3 ${t.completed ? 'opacity-50' : ''}`}>
            <button onClick={() => tog(t.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all shrink-0 ${t.completed ? 'bg-green-500 border-green-500' : 'border-dark-400'}`}>
                {t.completed && <I.Check />}
            </button>
            <div className="flex-1 min-w-0">
                <p className={`text-sm ${t.completed ? 'line-through text-dark-400' : ''}`}>{t.title}</p>
                <div className="flex items-center gap-2 mt-0.5">
                    {t.deadline && <p className="text-[10px] text-dark-400 flex items-center gap-1"><I.Cal />{fmtD(t.deadline)}</p>}
                    {t.budget > 0 && <p className="text-[10px] text-blue-400 font-medium">Est: {fmtC(t.budget)}</p>}
                </div>
            </div>
        </div>
    );
}

function SetMod({wallets,txns,notes,todos,debts,expCats,incCats,addCat,delCat,streak,user,toast,ocrProvider,setOcrProvider,ocrKey,setOcrKey,onRefresh}){
    const[isInstalled,setIsInstalled]=useState(false);
    const[busy,setBusy]=useState(false);
    const[testBusy,setTestBusy]=useState(false);
    const[testRes,setTestRes]=useState('');
    useEffect(()=>{if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){setIsInstalled(true)}},[]);
    const handleInstall=async()=>{
        if(window.deferredPrompt){window.deferredPrompt.prompt();const{outcome}=await window.deferredPrompt.userChoice;window.deferredPrompt=null;}
        else{alert('Untuk menginstall: buka menu browser (titik tiga) \u2192 "Install App" atau "Add to Home Screen"');}
    };
    const refresh=async()=>{
        if(busy)return;
        setBusy(true);
        await onRefresh();
        setBusy(false);
        toast('Data dimuat ulang dari server','ok');
    };
    // Fase 4: pengganti ekspor JSON = unduh laporan transaksi (CSV)
    const dlReport=()=>{
        if(!txns.length){alert('Belum ada transaksi untuk dilaporkan.');return;}
        const esc=v=>{const s=(v===null||v===undefined)?'':String(v);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
        const allC=[...expCats,...incCats];
        const catName=id=>{const c=allC.find(x=>x.id===id);return c?c.name:(id||'-')};
        const wName=id=>{const w=wallets.find(x=>x.id===id);return w?w.name:'-'};
        const rows=[['Tanggal','Tipe','Kategori','Dompet','Jumlah','Catatan']];
        [...txns].sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>{
            const dompet=t.type==='transfer'?(wName(t.transferFrom)+' -> '+wName(t.transferTo)):wName(t.walletId);
            rows.push([t.date,t.type,t.type==='transfer'?'Transfer':catName(t.category),dompet,t.amount,(t.note||'').replace(/\r?\n/g,' ')]);
        });
        const csv='\uFEFF'+rows.map(r=>r.map(esc).join(';')).join('\r\n');
        const b=new Blob([csv],{type:'text/csv;charset=utf-8'});
        const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`natahidup-laporan-${getToday()}.csv`;a.click();URL.revokeObjectURL(u);
    };
    // Uji API key dengan gambar kecil supaya kegagalan tidak lagi silent
    const testKey=async()=>{
        const key=String(ocrKey||'').trim();
        if(!key){setTestRes('Isi / tempel API key dulu.');return;}
        setTestBusy(true);setTestRes('');
        try{
            const blob=await new Promise(res=>{const c=document.createElement('canvas');c.width=8;c.height=8;c.toBlob(b=>res(b),'image/jpeg',0.9);});
            const fd=new FormData();let r;
            if(ocrProvider==='taggun'){
                fd.append('file',blob,'struk.jpg');fd.append('incognito','true');
                r=await fetch('https://api.taggun.io/api/receipt/v1/scan',{method:'POST',headers:{apikey:key},body:fd});
            }else{
                fd.append('document',blob,'struk.jpg');
                r=await fetch('https://api.mindee.net/v1/products/mindee/expense_receipts/v5/predict',{method:'POST',headers:{Authorization:'Token '+key},body:fd});
            }
            const prov=ocrProvider==='taggun'?'Taggun':'Mindee';
            if(r.ok||r.status===201)setTestRes('\u2705 Key valid! Terhubung ke '+prov+'.');
            else if(r.status===400)setTestRes('\u2705 Auth lolos (key valid). File tes 8x8 px ditolak provider \u2014 wajar, struk asli akan diproses.');
            else if(r.status===401||r.status===403)setTestRes('\u274c Ditolak (401/403): key salah, terpotong, atau belum aktif. Salin ulang seluruh key tanpa spasi.');
            else if(r.status===402)setTestRes('\u274c 402: plan/kuota provider tidak aktif untuk key ini.');
            else if(r.status===429)setTestRes('\u274c 429: rate limit provider \u2014 coba lagi nanti.');
            else setTestRes('\u274c HTTP '+r.status+': '+(await r.text()).slice(0,120));
        }catch(e){
            setTestRes('\u274c Tidak bisa menghubungi provider: '+errMsg(e));
        }
        setTestBusy(false);
    };
    const signOut=async()=>{if(confirm('Keluar dari akun ini?'))await sb.auth.signOut();};
    return(
        <div className="space-y-4">
            <div className="pt-2"><h1 className="text-2xl font-bold">Pengaturan</h1><p className="text-dark-400 text-sm mt-1">Kelola aplikasi NataHidup</p></div>
            <div className="bg-dark-700 rounded-2xl p-5 text-center"><h2 className="text-xl font-bold">NataHidup</h2><p className="text-dark-400 text-sm mt-1">v3.0.0 \u00b7 Online</p><p className="text-dark-500 text-xs mt-2">Produktivitas dan Keuangan Pribadi</p></div>
            <div className="bg-dark-700 rounded-2xl p-4">
                <h3 className="font-semibold text-sm mb-3">Akun</h3>
                <div className="flex items-center gap-3 bg-dark-600 rounded-xl p-3">
                    <div className="w-9 h-9 rounded-full bg-blue-600/30 text-blue-300 flex items-center justify-center font-bold text-sm shrink-0">{String(user.email||'?').charAt(0).toUpperCase()}</div>
                    <div className="flex-1 min-w-0"><p className="text-sm truncate">{user.email}</p><p className="text-[10px] text-green-400 flex items-center gap-1">\u2601 Data tersinkronisasi ke cloud</p></div>
                </div>
                <button onClick={signOut} className="w-full mt-3 py-2.5 rounded-xl bg-dark-600 text-sm text-dark-300 ch">Keluar (Sign Out)</button>
            </div>
            {!isInstalled&&(<button onClick={handleInstall} className="w-full bg-blue-600 hover:bg-blue-700 rounded-2xl p-4 flex items-center justify-center gap-3 ch"><I.DL/><span className="font-semibold text-sm">Install App ke Homescreen</span></button>)}
            <div className="bg-dark-700 rounded-2xl p-4"><h3 className="font-semibold text-sm mb-3">Kategori</h3><div className="space-y-3"><CatEditInline cats={expCats} addCat={addCat} delCat={delCat} type="expense"/><CatEditInline cats={incCats} addCat={addCat} delCat={delCat} type="income"/></div></div>
            <div className="bg-dark-700 rounded-2xl p-4"><h3 className="font-semibold text-sm mb-3">Statistik</h3><div className="space-y-2">
                <div className="flex justify-between text-sm"><span className="text-dark-400">Transaksi</span><span>{txns.length}</span></div>
                <div className="flex justify-between text-sm"><span className="text-dark-400">Catatan</span><span>{notes.length}</span></div>
                <div className="flex justify-between text-sm"><span className="text-dark-400">To-Do</span><span>{todos.length}</span></div>
                <div className="flex justify-between text-sm"><span className="text-dark-400">Hutang/Piutang</span><span>{debts.length}</span></div>
                <div className="flex justify-between text-sm"><span className="text-dark-400">Streak Terpanjang</span><span>{streak.longest} hari</span></div>
            </div></div>

            <div className="bg-dark-700 rounded-2xl p-4 space-y-3">
                <h3 className="font-semibold text-sm">Scan Struk (OCR)</h3>
                <select value={ocrProvider} onChange={e=>setOcrProvider(e.target.value)}>
                    <option value="offline">Offline \u2014 Tesseract.js (gratis)</option>
                    <option value="taggun">Taggun API (online, akurasi tinggi)</option>
                    <option value="mindee">Mindee API (online)</option>
                </select>
                {ocrProvider!=='offline'&&(
                    <div className="space-y-2">
                        <input type="password" placeholder="Masukkan API key..." value={ocrKey} onChange={e=>setOcrKey(e.target.value.replace(/\s+/g,''))}/>
                        <button type="button" onClick={testKey} disabled={testBusy} className="w-full py-2 rounded-xl bg-dark-600 text-xs font-medium text-dark-300 ch disabled:opacity-50">{testBusy?'Menguji koneksi...':'Tes Koneksi API Key'}</button>
                        {testRes!==''&&<p className={`text-[11px] rounded-xl p-2.5 border leading-relaxed ${testRes.charAt(0)==='\u2705'?'text-green-300 bg-green-500/10 border-green-500/30':'text-red-300 bg-red-500/10 border-red-500/30'}`}>{testRes}</p>}
                    </div>
                )}
                <p className="text-[10px] text-dark-500">{ocrProvider==='offline'?'Model bahasa (~5 MB) diunduh sekali saat pertama dipakai, lalu tersimpan di perangkat.':'API key hanya disimpan di perangkat ini dan dikirim langsung ke provider. Jika API gagal, otomatis fallback ke OCR offline.'}</p>
            </div>
            <div className="bg-dark-700 rounded-2xl p-4 space-y-3">
                <h3 className="font-semibold text-sm">Data Cloud</h3>
                <button onClick={refresh} disabled={busy} className="w-full flex items-center gap-3 py-3 px-4 bg-blue-600/20 text-blue-400 rounded-xl text-sm ch border border-blue-500/30 disabled:opacity-50">
                    <I.Repeat />
                    <span>{busy?'Memuat ulang...':'Muat Ulang Data dari Server'}</span>
                </button>
                <button onClick={dlReport} className="w-full flex items-center gap-3 py-3 px-4 bg-dark-600 rounded-xl text-sm ch">
                    <I.DL />
                    <span>Unduh Laporan Transaksi (CSV)</span>
                </button>
                <p className="text-[10px] text-dark-500">Data tersimpan otomatis di cloud dan mengikuti akun ini di perangkat mana pun \u2014 fitur sinkronisasi P2P serta ekspor/impor JSON tidak diperlukan lagi.</p>
            </div>

            <div className="bg-gradient-to-br from-blue-600/10 to-purple-600/10 border border-blue-500/20 rounded-2xl p-5"><h3 className="font-bold text-sm mb-3 flex items-center gap-2">Tentang NataHidup</h3><div className="space-y-3 text-xs text-dark-300 leading-relaxed"><p>NataHidup lahir dari frustrasi yang sama seperti kamu: buka aplikasi keuangan, malah jadi stress lihat angka merah. Buka notes, malah bingung cari catatan yang mana.</p><p>Kami percaya mengatur hidup nggak harus ribet. Makanya NataHidup didesain sederhana -- catat pengeluaran 5 detik, tulis catatan tanpa ribet, dan lihat progress hematmu dalam bentuk streak yang bikin ketagihan.</p><p className="text-blue-400 font-medium">Fitur favorit kami? Jeda 24 jam di Wishlist. Setiap kali kamu pengen beli barang impulsif, sistem maksa kamu tunggu sehari. 90% dari waktu, keesokan harinya kamu sadar: "Sebenarnya aku nggak butuh ini."</p><p>Itu inti NataHidup: bukan cuma catat, tapi bantu kamu <span className="text-white font-semibold">berpikir ulang sebelum bertindak</span>.</p></div></div>
            <div className="bg-dark-700 rounded-2xl p-4"><h3 className="font-semibold text-sm mb-2">Streak Milestones</h3><div className="space-y-2 text-xs"><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-500"></div><span className="text-dark-300">3 hari -- Mulai Bagus</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-500"></div><span className="text-dark-300">7 hari -- Konsisten</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-500"></div><span className="text-dark-300">14 hari -- Luar Biasa</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-500"></div><span className="text-dark-300">30 hari -- Legendaris</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-yellow-500"></div><span className="text-dark-300">50 hari -- Gold Badge</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-sky-400"></div><span className="text-dark-300">100 hari -- Diamond Badge</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-gradient-to-r from-yellow-400 to-amber-600"></div><span className="text-dark-300">365 hari -- Legendary (satu tahun!)</span></div></div></div>

function TxnM({close,save,wallets,expCats,incCats,ed}){
    const[type,setType]=useState(ed?.type||'expense');
    const[amt,setAmt]=useState(ed?.amount?.toString()||'');
    const[cat,setCat]=useState(ed?.category||'');
    const[note,setNote]=useState(ed?.note||'');
    const[wid,setWid]=useState(ed?.walletId||wallets[0]?.id||'');
    const[transferFrom,setTransferFrom]=useState(ed?.transferFrom||wallets[0]?.id||'');
    const[transferTo,setTransferTo]=useState(ed?.transferTo||(wallets[1]?.id||wallets[0]?.id)||'');
    const[date,setDate]=useState(ed?.date||getToday());
    const[recurring,setRec]=useState(ed?.isRecurring||false);
    const[recDay,setRecDay]=useState(ed?.recurringDay||new Date().getDate());
    const[busy,setBusy]=useState(false);
    const cats=type==='expense'?expCats:incCats;
    const amtVal=evalAmt(amt);const amtOk=!isNaN(amtVal)&&amtVal>0;const showCalc=amtOk&&/[+\-*/]/.test(amt);

    useEffect(()=>{
        if(type==='transfer' && transferFrom===transferTo && wallets.length>1){
            const nextW=wallets.find(w=>w.id!==transferFrom);
            if(nextW) setTransferTo(nextW.id);
        }
    },[transferFrom, type, wallets]);

    // Fase 2: kirim ke server dulu; modal hanya tertutup jika server menjawab sukses
    const sub=async e=>{
        e.preventDefault();
        if(!amtOk||busy)return;
        let payload;
        if(type==='transfer'){
            if(!transferFrom||!transferTo||transferFrom===transferTo)return;
            payload={type:'transfer',amount:amtVal,note,transferFrom,transferTo,date};
        }else{
            if(!cat)return;
            payload={type,amount:amtVal,category:cat,note,walletId:wid,date,isRecurring:recurring,recurringDay:recurring?recDay:null};
        }
        setBusy(true);
        const ok=await save(payload);
        setBusy(false);
        if(ok!==false)close();
    };
    const invalid=!amtOk||(type!=='transfer'&&!cat)||(type==='transfer'&&(transferFrom===transferTo));
    return(<MW close={close} title={ed&&ed.id?'Edit Transaksi':'Tambah Transaksi'}>
        <form onSubmit={sub} className="space-y-4">
            <div className="flex gap-2 bg-dark-700 rounded-xl p-1">
                <button type="button" onClick={()=>{setType('expense');setCat('')}} className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ${type==='expense'?'bg-red-500 text-white':'text-dark-400'}`}>Keluar</button>
                <button type="button" onClick={()=>{setType('income');setCat('')}} className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ${type==='income'?'bg-green-500 text-white':'text-dark-400'}`}>Masuk</button>
                <button type="button" onClick={()=>setType('transfer')} className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ${type==='transfer'?'bg-blue-500 text-white':'text-dark-400'}`}>Transfer</button>
            </div>
            <div><label className="text-xs text-dark-400 mb-1 block">Jumlah (Rp) \u2014 bisa ketik hitungan, misal: 50000+12000</label><input type="text" inputMode="decimal" placeholder="0" value={amt} onChange={e=>setAmt(e.target.value)} className="text-2xl font-bold text-center" autoFocus/>{showCalc&&<p className="text-xs text-center text-green-400 font-semibold mt-1">= {fmtC(amtVal)}</p>}</div>
            {type==='transfer'?(
                <>
                    <div><label className="text-xs text-dark-400 mb-1 block">Dari Dompet</label><select value={transferFrom} onChange={e=>setTransferFrom(e.target.value)}>{wallets.map(w=>(<option key={w.id} value={w.id}>{w.name} ({fmtC(w.balance)})</option>))}</select></div>
                    <div><label className="text-xs text-dark-400 mb-1 block">Ke Dompet</label>
                        <select value={transferTo} onChange={e=>setTransferTo(e.target.value)}>
                            {wallets.filter(w=>w.id!==transferFrom).map(w=>(<option key={w.id} value={w.id}>{w.name} ({fmtC(w.balance)})</option>))}
                        </select>
                    </div>
                    <div className="bg-blue-500/10 border border-blue-500/20 rounded-xl p-3"><p className="text-xs text-blue-400">Transfer tidak dihitung sebagai pengeluaran atau pemasukan. Hanya memindahkan saldo antar dompet.</p></div>
                </>
            ):(
                <div><label className="text-xs text-dark-400 mb-2 block">Kategori</label><div className="grid grid-cols-3 gap-2">{cats.map(c=>(<button key={c.id} type="button" onClick={()=>setCat(c.id)} className={`p-2.5 rounded-xl text-center transition-all ${cat===c.id?'bg-blue-500/20 border-2 border-blue-500':'bg-dark-700 border-2 border-transparent'}`}><CatBadge cat={c} size="sm"/><p className="text-[9px] mt-1 truncate">{c.name}</p></button>))}</div></div>
            )}
            <div><label className="text-xs text-dark-400 mb-1 block">Catatan</label><input type="text" placeholder="Deskripsi singkat" value={note} onChange={e=>setNote(e.target.value)}/></div>
            {type!=='transfer'&&(
                <div><label className="text-xs text-dark-400 mb-1 block">Dompet</label><select value={wid} onChange={e=>setWid(e.target.value)}>{wallets.map(w=>(<option key={w.id} value={w.id}>{w.name} ({fmtC(w.balance)})</option>))}</select></div>
            )}
            <div><label className="text-xs text-dark-400 mb-1 block">Tanggal</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
            {type!=='transfer'&&(
                <>
                    <label className="flex items-center gap-3 py-2 cursor-pointer">
                        <input type="checkbox" checked={recurring} onChange={e=>setRec(e.target.checked)} className="w-4 h-4 accent-blue-600"/>
                        <div><span className="text-sm">Transaksi Berulang</span><p className="text-[10px] text-dark-400">Otomatis dicatat setiap bulan</p></div>
                    </label>
                    {recurring&&<div><label className="text-xs text-dark-400 mb-1 block">Tanggal Berulang (tiap bulan)</label><input type="number" min="1" max="28" value={recDay} onChange={e=>setRecDay(parseInt(e.target.value)||1)}/></div>}
                </>
            )}
            <button type="submit" disabled={invalid||busy} className={`w-full py-3.5 rounded-xl font-semibold text-white transition-all ${invalid||busy?'bg-dark-600 text-dark-400':'bg-blue-600'}`}>{busy?'Menyimpan...':'Simpan'}</button>
        </form>
    </MW>);
}

function BudgetM({close,budgets,expCats,save}){
    const[local,setLocal]=useState(budgets);
    const[busy,setBusy]=useState(false);
    const upd=(id,field,v)=>setLocal(p=>p.map(b=>b.id===id?{...b,[field]:field==='limit'?parseFloat(v)||0:v}:b));
    const toggleCategory=(budgetId,catId)=>{setLocal(p=>p.map(b=>{if(b.id!==budgetId) return b;const cats=b.categories||[b.category];const has=cats.includes(catId);return{...b,categories:has?cats.filter(c=>c!==catId):[...cats,catId]};}))};
    const simpan=async()=>{
        if(busy)return;
        setBusy(true);
        const ok=await save(local);
        setBusy(false);
        if(ok!==false)close();
    };
    return(<MW close={close} title="Atur Budget"><div className="space-y-4"><p className="text-dark-400 text-xs">Atur limit, periode, dan kategori yang dipantau.</p>{local.map(b=>{const cat=expCats.find(c=>c.id===b.category)||{name:b.category,color:'#6b7280'};const trackedCats=b.categories||[b.category];return(<div key={b.id} className="bg-dark-700 rounded-xl p-3 space-y-3"><div className="flex items-center gap-2"><CatBadge cat={cat} size="sm"/><span className="text-sm font-medium">{cat.name}</span></div><div><label className="text-[10px] text-dark-400 mb-1 block">Limit</label><input type="number" value={b.limit} onChange={e=>upd(b.id,'limit',e.target.value)} className="text-sm"/></div><div><label className="text-[10px] text-dark-400 mb-1 block">Periode</label><select value={b.period||'monthly'} onChange={e=>upd(b.id,'period',e.target.value)} className="text-sm"><option value="weekly">Mingguan</option><option value="monthly">Bulanan</option><option value="custom">Custom</option></select></div><div><label className="text-[10px] text-dark-400 mb-1 block">Kategori Dipantau</label><div className="flex flex-wrap gap-1.5">{expCats.map(ec=>(<button key={ec.id} type="button" onClick={()=>toggleCategory(b.id,ec.id)} className={`px-2 py-1 rounded text-[10px] transition-all ${trackedCats.includes(ec.id)?'bg-blue-500/30 text-blue-300 border border-blue-500/50':'bg-dark-600 text-dark-400 border border-transparent'}`}>{ec.name}</button>))}</div></div></div>)})}<button onClick={simpan} disabled={busy} className={`w-full py-3.5 rounded-xl font-semibold text-white ${busy?'bg-dark-600 text-dark-400':'bg-blue-600'}`}>{busy?'Menyimpan...':'Simpan'}</button></div></MW>);
}

    return(<MW close={close} title={`Edit Kategori ${catType==='expense'?'Pengeluaran':'Pemasukan'}`}><div className="space-y-3">{cats.map(c=>(<div key={c.id} className="flex items-center justify-between bg-dark-700 rounded-xl p-3"><div className="flex items-center gap-2"><CatBadge cat={c} size="sm"/><span className="text-sm">{c.name}</span></div><button onClick={()=>delCat(c.id)} className="text-dark-400"><I.Trash/></button></div>))}<div className="flex gap-2"><input type="text" placeholder="Nama kategori..." value={nn} onChange={e=>setNn(e.target.value)}/><button onClick={add} disabled={busy} className="bg-blue-600 text-white px-4 rounded-lg text-sm disabled:opacity-50">{busy?'...':'+'}</button></div><button onClick={close} className="w-full py-3.5 rounded-xl font-semibold text-white bg-blue-600 mt-2">Selesai</button></div></MW>);
}

function TodoBudgetM({ close, todo, completeWithExpense, skipExpense, wallets }) {
    const [realCost, setRealCost] = useState(todo.budget.toString());
    const [walletId, setWalletId] = useState(wallets[0]?.id || '');
    const [busy, setBusy] = useState(false);

    const handleConfirm = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true);
        await completeWithExpense(todo.id, parseFloat(realCost) || 0, walletId);
        setBusy(false);
    };

    const handleSkip = async () => {
        if (busy) return;
        setBusy(true);
        await skipExpense(todo.id);
        setBusy(false);
    };

    return (
        <MW close={close} title="Tugas Selesai!">
            <form onSubmit={handleConfirm} className="space-y-4">
                <p className="text-sm text-dark-300">"<strong>{todo.title}</strong>" selesai.</p>
                <p className="text-sm text-dark-400">Estimasi biaya: {fmtC(todo.budget)}. Catat sebagai pengeluaran?</p>
                <div>
                    <label className="text-xs text-dark-400 mb-1 block">Nominal Realisasi (Rp)</label>
                    <input type="number" value={realCost} onChange={e => setRealCost(e.target.value)} className="text-xl font-bold text-center" autoFocus />
                </div>
                <div>
                    <label className="text-xs text-dark-400 mb-1 block">Dari Dompet</label>
                    <select value={walletId} onChange={e => setWalletId(e.target.value)}>
                        {wallets.map(w => (<option key={w.id} value={w.id}>{w.name} ({fmtC(w.balance)})</option>))}
                    </select>
                </div>
                <div className="flex gap-3 mt-4">
                    <button type="button" onClick={handleSkip} disabled={busy} className="flex-1 py-3 rounded-xl font-semibold text-dark-300 bg-dark-700 disabled:opacity-50">Lewati</button>
                    <button type="submit" disabled={busy} className={`flex-1 py-3 rounded-xl font-semibold text-white ${busy?'bg-dark-600 text-dark-400':'bg-blue-600'}`}>{busy?'Menyimpan...':'Catat Pengeluaran'}</button>
                </div>
            </form>
        </MW>
    );
}

function ScanReceiptM({close, openM, expCats, ocrProvider, ocrKey, learnedKw, setLearnedKw, toast}){
    const[step,setStep]=useState('menu');
    const[prog,setProg]=useState(0);
    const[status,setStatus]=useState('');
    const[err,setErr]=useState('');
    const[camErr,setCamErr]=useState(false);
    const[amt,setAmt]=useState('');
    const[note,setNote]=useState('');
    const[date,setDate]=useState(getToday());
    const[cat,setCat]=useState('');
    const videoRef=useRef(null);
    const streamRef=useRef(null);
    const fileRef=useRef(null);
    const amtVal=evalAmt(amt);
    const showCalc=!isNaN(amtVal)&&/[+\-*/]/.test(amt);

    useEffect(()=>()=>{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop())},[]);

    const stopCam=()=>{if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}};

    const startCam=async()=>{
        setErr('');setCamErr(false);
        try{
            const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
            streamRef.current=stream;setStep('camera');
            setTimeout(()=>{if(videoRef.current){videoRef.current.srcObject=stream;videoRef.current.play().catch(()=>{});}},150);
        }catch(e){setCamErr(true);}
    };

    const process=async blob=>{
        stopCam();setErr('');setStep('processing');setProg(0);
        setStatus(ocrProvider!=='offline'&&ocrKey&&navigator.onLine?'Mengirim gambar ke API OCR...':'Menyiapkan OCR offline...');
        try{
            const r=await runOcr(blob,ocrProvider,ocrKey,expCats,learnedKw,(p,l)=>{if(p!==null)setProg(p);if(l){setStatus(l);if(/beralih ke OCR offline/i.test(l)&&toast)toast(l,'info');}});
            setAmt(String(r.amount||''));setNote(r.note||'');setDate(r.date||getToday());setCat(r.category||'');
            setStep('confirm');
        }catch(e){
            setStep('menu');setErr('❌ '+(e&&e.message?e.message:'OCR gagal. Coba foto lebih dekat & terang.'));
        }
    };

    const capture=()=>{
        const v=videoRef.current;if(!v||!v.videoWidth)return;
        const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
        c.getContext('2d').drawImage(v,0,0);
        c.toBlob(b=>{if(b)process(b);},'image/jpeg',0.92);
    };

    const onFile=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)process(f);};

    // 4. Modifikasi fungsi confirmGo di dalam komponen <ScanReceiptM/>
    const confirmGo = () => {
        const a = evalAmt(String(amt));
        if (isNaN(a) || a <= 0) { setErr('Nominal tidak valid'); return; }
        
        const finalNote = note.trim();
        
        // Proses Auto-Learn saat menyimpan form
        if (finalNote && cat && typeof setLearnedKw === 'function') {
            const keyword = finalNote.toLowerCase().split(' ').slice(0, 2).join(' ');
            if (keyword.length > 3) {
                setLearnedKw(prev => ({ ...prev, [keyword]: cat }));
            }
        }
        
        const payload = { type: 'expense', amount: a, note: finalNote, date: date || getToday() };
        if (cat) payload.category = cat;
        stopCam(); close();
        setTimeout(() => openM('addTxn', payload), 200);
    };

    return(
        <MW close={close} title="Scan Struk (OCR)">
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onFile}/>
            <div className="space-y-4">
                {step==='menu'&&(
                    <div className="space-y-3">
                        {err&&<p className="text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-xl p-3">{err}</p>}
                        <p className="text-xs text-dark-400">Foto struk belanja — OCR mengisi nominal, tanggal & nama toko otomatis. Kamu tetap bisa mengoreksi hasilnya sebelum disimpan.</p>
                        {camErr&&<CamError onBack={()=>setCamErr(false)}/>}
                        {!camErr&&(
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={startCam} className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-5 flex flex-col items-center gap-2 ch"><div className="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400"><I.Cam/></div><span className="text-sm font-medium">Foto Struk</span></button>
                                <button onClick={()=>fileRef.current&&fileRef.current.click()} className="bg-dark-700 rounded-2xl p-5 flex flex-col items-center gap-2 ch"><div className="w-10 h-10 rounded-xl bg-dark-600 flex items-center justify-center text-dark-300"><I.DL/></div><span className="text-sm font-medium">Dari Galeri</span></button>
                            </div>
                        )}
                        <p className="text-[10px] text-dark-500 text-center">Mode aktif: {ocrProvider==='offline'?'Offline (Tesseract.js)':ocrProvider==='taggun'?'Taggun API':'Mindee API'}{ocrProvider!=='offline'&&' — otomatis fallback ke offline jika gagal'}. Ubah di Pengaturan.</p>
                    </div>
                )}
                {step==='camera'&&(
                    <div className="space-y-3">
                        <div className="relative rounded-2xl overflow-hidden bg-black">
                            <video ref={videoRef} playsInline muted className="w-full"/>
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div className="w-72 h-44 border-2 border-dashed border-amber-400 rounded-xl"/>
                            </div>
                        </div>
                        <p className="text-xs text-dark-300 text-center">Posisikan bagian <b>TOTAL</b> & nama toko dalam kotak.<br/>Pastikan struk rata dan pencahayaan terang.</p>
                        <div className="flex gap-3">
                            <button onClick={()=>{stopCam();setStep('menu');}} className="flex-1 py-3 rounded-xl font-semibold text-dark-300 bg-dark-700">Kembali</button>
                            <button onClick={capture} className="flex-1 py-3 rounded-xl font-semibold text-dark-900 bg-amber-400">📸 Ambil Foto</button>
                        </div>
                    </div>
                )}
                {step==='processing'&&(
                    <div className="space-y-4 text-center py-6">
                        <div className="w-14 h-14 border-4 border-dark-600 border-t-amber-400 rounded-full animate-spin mx-auto"/>
                        <p className="text-sm font-medium">{status||'Memproses...'}</p>
                        <div className="w-full bg-dark-600 rounded-full h-2"><div className="h-2 rounded-full bg-amber-400 bb" style={{width:`${Math.min(100,Math.max(3,prog))}%`}}/></div>
                        <p className="text-[10px] text-dark-500">Pemakaian pertama butuh mengunduh model bahasa (~5 MB). Setelah itu pemindaian jauh lebih cepat.</p>
                    </div>
                )}
                {step==='confirm'&&(
                    <div className="space-y-4">
                        <p className="text-sm text-dark-300">Periksa hasil ekstraksi. <span className="text-amber-400">OCR bisa salah baca angka</span> (mis. 8 → B), pastikan nominal benar.</p>
                        <div><label className="text-xs text-dark-400 mb-1 block">Nominal (Rp)</label><input type="text" inputMode="decimal" value={amt} onChange={e=>setAmt(e.target.value)} className="text-2xl font-bold text-center"/>{showCalc&&<p className="text-xs text-center text-green-400 font-semibold mt-1">= {fmtC(amtVal)}</p>}</div>
                        <div><label className="text-xs text-dark-400 mb-1 block">Tanggal</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
                        <div><label className="text-xs text-dark-400 mb-1 block">Nama Toko / Catatan</label><input type="text" value={note} onChange={e=>setNote(e.target.value)}/></div>
                        <div><label className="text-xs text-dark-400 mb-2 block">Kategori (opsional)</label><div className="grid grid-cols-3 gap-2">{expCats.map(c=>(<button key={c.id} type="button" onClick={()=>setCat(cat===c.id?'':c.id)} className={`p-2.5 rounded-xl text-center transition-all ${cat===c.id?'bg-blue-500/20 border-2 border-blue-500':'bg-dark-700 border-2 border-transparent'}`}><CatBadge cat={c} size="sm"/><p className="text-[9px] mt-1 truncate">{c.name}</p></button>))}</div></div>
                        <div className="flex gap-3">
                            <button onClick={()=>{setErr('');setStep('menu');}} className="flex-1 py-3 rounded-xl font-semibold text-dark-300 bg-dark-700">Ulangi</button>
                            <button onClick={confirmGo} className="flex-1 py-3 rounded-xl font-semibold text-white bg-blue-600">Isi ke Form ✓</button>
                        </div>
                    </div>
                )}
            </div>
        </MW>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
