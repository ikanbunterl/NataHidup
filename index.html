function P2PSync({ close }) {
    const [step, setStep] = useState('menu');
    const [status, setStatus] = useState('');
    const [pc, setPc] = useState(null);
    const [scanner, setScanner] = useState(null);
    const [camError, setCamError] = useState(false);
    const [pasteTxt, setPasteTxt] = useState('');

    useEffect(() => {
        return () => {
            if (scanner) scanner.stop().catch(() => {});
            if (pc) pc.close();
        };
    }, [scanner, pc]);

    const waitForIce = (peerConnection) => {
        return new Promise(resolve => {
            if (peerConnection.iceGatheringState === 'complete') resolve();
            else {
                const check = () => {
                    if (peerConnection.iceGatheringState === 'complete') {
                        peerConnection.removeEventListener('icegatheringstatechange', check);
                        resolve();
                    }
                };
                peerConnection.addEventListener('icegatheringstatechange', check);
            }
        });
    };

    const startHost = async () => {
        setStatus('Membuat koneksi...');
        const newPc = new RTCPeerConnection();
        const dc = newPc.createDataChannel('nata_sync');
        
        dc.onopen = () => {
            setStatus('Mengirim data...');
            const payload = {
                nh_w: localStorage.getItem('nh_w'), nh_tx: localStorage.getItem('nh_tx'),
                nh_bg: localStorage.getItem('nh_bg'), nh_n: localStorage.getItem('nh_n'),
                nh_td: localStorage.getItem('nh_td'), nh_db: localStorage.getItem('nh_db'),
                nh_ec: localStorage.getItem('nh_ec'), nh_ic: localStorage.getItem('nh_ic'),
                nh_sk: localStorage.getItem('nh_sk')
            };
            const compressed = LZString.compressToUTF16(JSON.stringify(payload));
            dc.send(compressed);
            setStatus('✅ Data berhasil dikirim!');
        };

        const offer = await newPc.createOffer();
        offer.sdp = mungeSdp(offer.sdp);
        await newPc.setLocalDescription(offer);
        await waitForIce(newPc);
        
        setPc(newPc);
        setStep('host_qr');
        setStatus('Scan QR ini dengan HP Baru (Pilih "Terima Data")');
    };

    const startGuest = () => {
        setStep('guest_scan');
        setCamError(false);
        setStatus('Arahkan kamera ke QR Code di HP Lama...');
        if (typeof Html5Qrcode === 'undefined') { setCamError(true); return; }
        setTimeout(() => {
            const html5QrCode = new Html5Qrcode("qr-reader");
            setScanner(html5QrCode);
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    await html5QrCode.stop();
                    setScanner(null);
                    processOffer(decodedText);
                },
                () => {}
            ).catch(() => setCamError(true));
        }, 300);
    };

    const processOffer = async (decodedText) => {
        try {
        setStatus('Memproses koneksi...');
        const newPc = new RTCPeerConnection();
        
        newPc.ondatachannel = (event) => {
            const dc = event.channel;
            dc.onmessage = (e) => {
                setStatus('Menerima data...');
                const jsonStr = LZString.decompressFromUTF16(e.data);
                const payload = JSON.parse(jsonStr);
                
                Object.keys(payload).forEach(key => {
                    if (payload[key]) localStorage.setItem(key, payload[key]);
                });
                
                setStatus('✅ Data berhasil diterima! Memuat ulang...');
                setTimeout(() => window.location.reload(), 1500);
            };
        };

        const offerSdp = JSON.parse(LZString.decompressFromEncodedURIComponent(decodedText));
        await newPc.setRemoteDescription(offerSdp);
        const answer = await newPc.createAnswer();
        answer.sdp = mungeSdp(answer.sdp);
        await newPc.setLocalDescription(answer);
        await waitForIce(newPc);
        
        setPc(newPc);
        setStep('guest_qr');
        setStatus('Scan QR ini dengan HP Lama untuk menyelesaikan');
        } catch (err) {
            setStatus('❌ Teks SDP tidak valid. Pastikan salinan lengkap, lalu tempel lagi.');
            setCamError(true);
        }
    };

    const completeHandshake = () => {
        setStep('host_scan');
        setCamError(false);
        setStatus('Arahkan kamera ke QR Code di HP Baru...');
        if (typeof Html5Qrcode === 'undefined') { setCamError(true); return; }
        setTimeout(() => {
            const html5QrCode = new Html5Qrcode("qr-reader");
            setScanner(html5QrCode);
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    await html5QrCode.stop();
                    setScanner(null);
                    const answerSdp = JSON.parse(LZString.decompressFromEncodedURIComponent(decodedText));
                    await pc.setRemoteDescription(answerSdp);
                    setStatus('Handshake berhasil! Mengirim data...');
                },
                () => {}
            ).catch(() => setCamError(true));
        }, 300);
    };

    const renderQR = (data) => {
        const raw = typeof data === 'string' ? data : JSON.stringify(data);
        try {
            if (typeof qrcode !== 'function') throw new Error('Modul QR tidak termuat');
            const compressed = LZString.compressToEncodedURIComponent(raw);
            const qr = qrcode(0, 'L');
            qr.addData(compressed);
            qr.make();
            if (qr.getModuleCount() > 120) throw new Error('Data QR terlalu padat untuk dipindai');
            return <div className="flex justify-center my-4" dangerouslySetInnerHTML={{ __html: qr.createImgTag(4, 8) }} />;
        } catch (e) {
            const compressed = LZString.compressToEncodedURIComponent(raw);
            return (
                <div className="my-4 space-y-2">
                    <p className="text-xs text-yellow-400 text-center">⚠️ QR otomatis gagal ({e.message}). Salin teks ini, kirim via WA/Telegram, lalu tempel di HP lain.</p>
                    <textarea readOnly rows={6} value={compressed} className="text-[10px] leading-tight" onFocus={ev => ev.target.select()} />
                    <button type="button" onClick={ev => { if (navigator.clipboard) navigator.clipboard.writeText(compressed).then(() => { ev.target.textContent = '✅ Tersalin!'; }).catch(() => {}); }} className="w-full py-2 rounded-lg bg-dark-600 text-xs font-medium">Salin Teks</button>
                </div>
            );
        }
    };

    return (
        <MW close={close} title="Sinkronisasi P2P">
            <div className="space-y-4 text-center">
                <p className="text-xs text-dark-400">Pindahkan data antar perangkat via Wi-Fi Lokal/Hotspot. 100% Offline & Privat.</p>
                
                {step === 'menu' && (
                    <div className="space-y-3 mt-4">
                        <button onClick={startHost} className="w-full py-3 rounded-xl font-semibold text-white bg-blue-600">📤 Kirim Data (HP Lama)</button>
                        <button onClick={startGuest} className="w-full py-3 rounded-xl font-semibold text-white bg-dark-700 border border-dark-600">📥 Terima Data (HP Baru)</button>
                    </div>
                )}

                {step === 'host_qr' && (
                    <div className="space-y-3">
                        <p className="text-sm font-medium text-blue-400">{status}</p>
                        {renderQR(JSON.stringify(pc.localDescription))}
                        <button onClick={completeHandshake} className="w-full py-3 rounded-xl font-semibold text-white bg-green-600 mt-4">Scan QR Jawaban (HP Baru)</button>
                    </div>
                )}

                {step === 'guest_scan' && (
                    camError ? <CamError onBack={() => { setCamError(false); setStep('menu'); }} onPaste={(txt) => { setCamError(false); processOffer(txt); }} pasteValue={pasteTxt} setPaste={setPasteTxt} /> : (
                    <div className="space-y-3">
                        <p className="text-sm font-medium text-blue-400">{status}</p>
                        <div id="qr-reader" className="w-full max-w-xs mx-auto rounded-xl overflow-hidden border-2 border-dark-600"></div>
                    </div>
                    )
                )}

                {step === 'guest_qr' && (
                    <div className="space-y-3">
                        <p className="text-sm font-medium text-green-400">{status}</p>
                        {renderQR(JSON.stringify(pc.localDescription))}
                    </div>
                )}

                {step === 'host_scan' && (
                    camError ? <CamError onBack={() => { setCamError(false); setStep('host_qr'); }} onPaste={async (txt) => {
                        try {
                            const answerSdp = JSON.parse(LZString.decompressFromEncodedURIComponent(txt));
                            await pc.setRemoteDescription(answerSdp);
                            setCamError(false);
                            setStatus('Handshake berhasil! Mengirim data...');
                        } catch (e2) { setStatus('❌ Teks jawaban tidak valid, coba lagi.'); }
                    }} pasteValue={pasteTxt} setPaste={setPasteTxt} /> : (
                    <div className="space-y-3">
                        <p className="text-sm font-medium text-blue-400">{status}</p>
                        <div id="qr-reader" className="w-full max-w-xs mx-auto rounded-xl overflow-hidden border-2 border-dark-600"></div>
                    </div>
                    )
                )}
                
                <button onClick={close} className="w-full py-3 rounded-xl font-semibold text-dark-300 bg-dark-700 mt-4">Tutup</button>
            </div>
        </MW>
    );
}

function ScanReceiptM({close, openM, expCats, ocrProvider, ocrKey, learnedKw, setLearnedKw}){
    const[step,setStep]=useState('menu');
    const[prog,setProg]=useState(0);
    const[status,setStatus]=useState('');
    const[err,setErr]=useState('');
    const[camErr,setCamErr]=useState(false);
    const[amt,setAmt]=useState('');
    const[note,setNote]=useState('');
    const[date,setDate]=useState(getToday());
    const[cat,setCat]=useState('');
    const videoRef=useRef(null);
    const streamRef=useRef(null);
    const fileRef=useRef(null);
    const amtVal=evalAmt(amt);
    const showCalc=!isNaN(amtVal)&&/[+\-*/]/.test(amt);

    useEffect(()=>()=>{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop())},[]);

    const stopCam=()=>{if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}};

    const startCam=async()=>{
        setErr('');setCamErr(false);
        try{
            const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
            streamRef.current=stream;setStep('camera');
            setTimeout(()=>{if(videoRef.current){videoRef.current.srcObject=stream;videoRef.current.play().catch(()=>{});}},150);
        }catch(e){setCamErr(true);}
    };

    const process=async blob=>{
        stopCam();setErr('');setStep('processing');setProg(0);
        setStatus(ocrProvider!=='offline'&&ocrKey&&navigator.onLine?'Mengirim gambar ke API OCR...':'Menyiapkan OCR offline...');
        try{
            const r=await runOcr(blob,ocrProvider,ocrKey,expCats,learnedKw,(p,l)=>{if(p!==null)setProg(p);if(l)setStatus(l);});
            setAmt(String(r.amount||''));setNote(r.note||'');setDate(r.date||getToday());setCat(r.category||'');
            setStep('confirm');
        }catch(e){
            setStep('menu');setErr('❌ '+(e&&e.message?e.message:'OCR gagal. Coba foto lebih dekat & terang.'));
        }
    };

    const capture=()=>{
        const v=videoRef.current;if(!v||!v.videoWidth)return;
        const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
        c.getContext('2d').drawImage(v,0,0);
        c.toBlob(b=>{if(b)process(b);},'image/jpeg',0.92);
    };

    const onFile=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)process(f);};

    // 4. Modifikasi fungsi confirmGo di dalam komponen <ScanReceiptM/>
    const confirmGo = () => {
        const a = evalAmt(String(amt));
        if (isNaN(a) || a <= 0) { setErr('Nominal tidak valid'); return; }
        
        const finalNote = note.trim();
        
        // Proses Auto-Learn saat menyimpan form
        if (finalNote && cat && typeof setLearnedKw === 'function') {
            const keyword = finalNote.toLowerCase().split(' ').slice(0, 2).join(' ');
            if (keyword.length > 3) {
                setLearnedKw(prev => ({ ...prev, [keyword]: cat }));
            }
        }
        
        const payload = { type: 'expense', amount: a, note: finalNote, date: date || getToday() };
        if (cat) payload.category = cat;
        stopCam(); close();
        setTimeout(() => openM('addTxn', payload), 200);
    };

    return(
        <MW close={close} title="Scan Struk (OCR)">
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onFile}/>
            <div className="space-y-4">
                {step==='menu'&&(
                    <div className="space-y-3">
                        {err&&<p className="text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-xl p-3">{err}</p>}
                        <p className="text-xs text-dark-400">Foto struk belanja — OCR mengisi nominal, tanggal & nama toko otomatis. Kamu tetap bisa mengoreksi hasilnya sebelum disimpan.</p>
                        {camErr&&<CamError onBack={()=>setCamErr(false)}/>}
                        {!camErr&&(
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={startCam} className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-5 flex flex-col items-center gap-2 ch"><div className="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400"><I.Cam/></div><span className="text-sm font-medium">Foto Struk</span></button>
                                <button onClick={()=>fileRef.current&&fileRef.current.click()} className="bg-dark-700 rounded-2xl p-5 flex flex-col items-center gap-2 ch"><div className="w-10 h-10 rounded-xl bg-dark-600 flex items-center justify-center text-dark-300"><I.DL/></div><span className="text-sm font-medium">Dari Galeri</span></button>
                            </div>
                        )}
                        <p className="text-[10px] text-dark-500 text-center">Mode aktif: {ocrProvider==='offline'?'Offline (Tesseract.js)':ocrProvider==='taggun'?'Taggun API':'Mindee API'}{ocrProvider!=='offline'&&' — otomatis fallback ke offline jika gagal'}. Ubah di Pengaturan.</p>
                    </div>
                )}
                {step==='camera'&&(
                    <div className="space-y-3">
                        <div className="relative rounded-2xl overflow-hidden bg-black">
                            <video ref={videoRef} playsInline muted className="w-full"/>
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div className="w-72 h-44 border-2 border-dashed border-amber-400 rounded-xl"/>
                            </div>
                        </div>
                        <p className="text-xs text-dark-300 text-center">Posisikan bagian <b>TOTAL</b> & nama toko dalam kotak.<br/>Pastikan struk rata dan pencahayaan terang.</p>
                        <div className="flex gap-3">
                            <button onClick={()=>{stopCam();setStep('menu');}} className="flex-1 py-3 rounded-xl font-semibold text-dark-300 bg-dark-700">Kembali</button>
                            <button onClick={capture} className="flex-1 py-3 rounded-xl font-semibold text-dark-900 bg-amber-400">📸 Ambil Foto</button>
                        </div>
                    </div>
                )}
                {step==='processing'&&(
                    <div className="space-y-4 text-center py-6">
                        <div className="w-14 h-14 border-4 border-dark-600 border-t-amber-400 rounded-full animate-spin mx-auto"/>
                        <p className="text-sm font-medium">{status||'Memproses...'}</p>
                        <div className="w-full bg-dark-600 rounded-full h-2"><div className="h-2 rounded-full bg-amber-400 bb" style={{width:`${Math.min(100,Math.max(3,prog))}%`}}/></div>
                        <p className="text-[10px] text-dark-500">Pemakaian pertama butuh mengunduh model bahasa (~5 MB). Setelah itu pemindaian jauh lebih cepat.</p>
                    </div>
                )}
                {step==='confirm'&&(
                    <div className="space-y-4">
                        <p className="text-sm text-dark-300">Periksa hasil ekstraksi. <span className="text-amber-400">OCR bisa salah baca angka</span> (mis. 8 → B), pastikan nominal benar.</p>
                        <div><label className="text-xs text-dark-400 mb-1 block">Nominal (Rp)</label><input type="text" inputMode="decimal" value={amt} onChange={e=>setAmt(e.target.value)} className="text-2xl font-bold text-center"/>{showCalc&&<p className="text-xs text-center text-green-400 font-semibold mt-1">= {fmtC(amtVal)}</p>}</div>
                        <div><label className="text-xs text-dark-400 mb-1 block">Tanggal</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
                        <div><label className="text-xs text-dark-400 mb-1 block">Nama Toko / Catatan</label><input type="text" value={note} onChange={e=>setNote(e.target.value)}/></div>
                        <div><label className="text-xs text-dark-400 mb-2 block">Kategori (opsional)</label><div className="grid grid-cols-3 gap-2">{expCats.map(c=>(<button key={c.id} type="button" onClick={()=>setCat(cat===c.id?'':c.id)} className={`p-2.5 rounded-xl text-center transition-all ${cat===c.id?'bg-blue-500/20 border-2 border-blue-500':'bg-dark-700 border-2 border-transparent'}`}><CatBadge cat={c} size="sm"/><p className="text-[9px] mt-1 truncate">{c.name}</p></button>))}</div></div>
                        <div className="flex gap-3">
                            <button onClick={()=>{setErr('');setStep('menu');}} className="flex-1 py-3 rounded-xl font-semibold text-dark-300 bg-dark-700">Ulangi</button>
                            <button onClick={confirmGo} className="flex-1 py-3 rounded-xl font-semibold text-white bg-blue-600">Isi ke Form ✓</button>
                        </div>
                    </div>
                )}
            </div>
        </MW>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
