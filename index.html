    if ('serviceWorker' in navigator) {

            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW registration failed:', err));
        });
    }
    let deferredPrompt;
    const banner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.deferredPrompt = e;
        banner.classList.remove('hidden');
        clearTimeout(window.__nhBannerTimer);
        window.__nhBannerTimer = setTimeout(() => banner.classList.add('hidden'), 8000);
    });
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            banner.classList.add('hidden');
        }
    });
    dismissBtn.addEventListener('click', () => { banner.classList.add('hidden'); });
    window.addEventListener('appinstalled', () => { banner.classList.add('hidden'); deferredPrompt = null; });
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
        banner.classList.add('hidden');
    }

<script type="text/babel">
const{useState,useEffect,useCallback,useMemo,useRef}=React;

const fmtC=a=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0,maximumFractionDigits:0}).format(a);
const fmtD=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const fmtT=d=>new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const genId=()=>Date.now().toString(36)+Math.random().toString(36).substr(2);
const getToday=()=>new Date().toISOString().split('T')[0];
const getMY=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`};
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
const evalAmt=s=>{try{if(!/[+\-*/]/.test(s))return parseFloat(s);if(!/^[\d+\-*/().\s]+$/.test(s)||!/\d/.test(s))return NaN;const r=Function('"use strict";return('+s+')')();return typeof r==='number'&&isFinite(r)?Math.round(r):NaN;}catch(e){return NaN;}};

const ensureTesseract=()=>new Promise((res,rej)=>{
    if(typeof Tesseract!=='undefined')return res();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('Gagal memuat library OCR. Butuh internet sekali saat pertama dipakai.'));
    document.head.appendChild(s);
});
const normDate=s=>{if(!s)return'';s=String(s).trim();let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;m=s.match(/\b(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2,4})\b/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}return'';};

// 1. Pembersihan Angka (Mengatasi salah baca titik/koma & huruf o/O)
const toNum = n => {
    n = String(n).replace(/rp\.?/gi, '').replace(/\s/g, '').replace(/[oO]/g, '0');
    if (!n) return 0;
    if (n.includes(',') && n.includes('.')) {
        n = n.replace(/\./g, '').replace(',', '.');
    } else if (n.includes(',')) {
        if (/,\d{3}$/.test(n)) n = n.replace(/,/g, ''); 
        else n = n.replace(',', '.'); 
    } else {
        n = n.replace(/\./g, '');
    }
    const v = parseFloat(n);
    return isFinite(v) ? v : 0;
};

// 2. Mesin Penebak Kategori + Auto-Learn Memori
const guessCat = (text, expCats, learnedKw = {}) => {
    const t = String(text).toLowerCase();
    
    // A. Cek dari memori hasil belajar (Auto-Learn) terlebih dahulu
    for (const [word, catId] of Object.entries(learnedKw)) {
        if (t.includes(word)) return catId;
    }

    // B. Cek nama kategori persis
    for (const cat of expCats) {
        if (cat.type === 'expense' && t.includes(cat.name.toLowerCase())) return cat.id;
    }
    
    // C. Pola statis bawaan
    const kwMap = [
        { rx: /(spbu|bensin|pertalite|pertamax|shell|parkir|\btol\b|gojek|grab|krl|mrt|angkot|ojol)/, key: 'transport' },
        { rx: /(kopi|coffee|cafe|starbucks|janji jiwa|kenangan)/, key: 'kopi' },
        { rx: /(resto|restoran|warung|sate|bakso|mie |mcd|kfc|ayam goreng|padang)/, key: 'makan' },
        { rx: /(apotek|apotik|klinik|rumah sakit|rs\.|farmasi|guardian|watsons)/, key: 'kesehatan' },
        { rx: /(pln|listrik|pulsa|telkomsel|token|indihome|bpjs)/, key: 'tagihan' },
        { rx: /(cinema|xxi|cgv|bioskop|netflix|spotify|google play|ovo)/, key: 'hiburan' },
        { rx: /(mart|supermarket|alfamart|indomaret|hypermart|lotte|transmart|grosir|buah)/, key: 'belanja' },
        { rx: /(smk|sma|smp|sd|sekolah|spp|universitas|kampus|yayasan)/, key: 'pendidikan' }
    ];
    
    for (const kw of kwMap) {
        if (kw.rx.test(t)) {
            const matched = expCats.find(c => c.type === 'expense' && (c.id === kw.key || c.name.toLowerCase().includes(kw.key)));
            if (matched) return matched.id;
        }
    }
    return '';
};

// 3. Ekstraksi Data Utama + Logika Validasi Matematika
const parseReceipt = (text, expCats, learnedKw = {}) => {
    const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
    let amount = 0;
    
    // A. Kumpulkan semua angka valid > 100 rupiah
    const allNumbers = [];
    const numRegex = /[\d.,]+/g;
    for (const line of lines) {
        const matches = line.replace(/rp\.?/gi, '').match(numRegex);
        if (matches) {
            matches.forEach(m => {
                const val = toNum(m);
                if (val > 100) allNumbers.push(val);
            });
        }
    }
    
    // B. Cari relasi Matematika (Tunai - Kembali = Total Belanja)
    let mathTotal = 0;
    const sortedNums = [...new Set(allNumbers)].sort((a, b) => b - a);
    for (let i = 0; i < sortedNums.length; i++) {
        for (let j = i + 1; j < sortedNums.length; j++) {
            const diff = sortedNums[i] - sortedNums[j];
            if (diff > 0 && sortedNums.includes(diff)) {
                mathTotal = Math.max(mathTotal, diff);
            }
        }
    }
    
    // C. Fallback pencarian teks konvensional
    let regexTotal = 0;
    const totalRx = /(total|amount|jumlah|grand|bayar)[^\d]{0,20}([\d.,\s]+)/i;
    for (const line of lines) {
        if (totalRx.test(line)) {
            const nums = line.replace(/rp\.?/gi, '').match(/[\d.,]+/g) || [];
            const mx = Math.max(...nums.map(toNum), 0);
            if (mx > regexTotal) regexTotal = mx;
        }
    }
    
    // D. Penentuan nilai akhir (Matematika diutamakan)
    amount = mathTotal > 0 ? mathTotal : regexTotal;
    if (!amount && sortedNums.length > 1) amount = sortedNums[1];
    else if (!amount && sortedNums.length > 0) amount = sortedNums[0];

    const note = (lines.find(l => l.length > 3 && !/(cabang|alamat|telp|kota|npwp|gst|vat|no\.|nomor)/i.test(l)) || 'Scan struk').slice(0, 40);
    return { amount: Math.round(amount), date: normDate(text) || getToday(), note, category: guessCat(text, expCats, learnedKw) };
};

const fieldVal=f=>{if(!f)return null;if(f.value!==undefined&&f.value!==null)return f.value;if(f.data&&f.data.value!==undefined&&f.data.value!==null)return f.data.value;if(typeof f.data==='string'||typeof f.data==='number')return f.data;return null;};

const runOcr = async (blob, provider, apiKey, expCats, learnedKw, onProg) => {
    apiKey = String(apiKey || '').trim();
    if (provider !== 'offline' && apiKey && navigator.onLine) {
        try {
            const fd = new FormData();
            if (provider === 'taggun') {
                onProg(10, 'Mengirim ke Taggun...');
                fd.append('file', blob, 'struk.jpg'); fd.append('incognito', 'true');
                const r = await fetch('https://api.taggun.io/api/receipt/v1/scan', { method: 'POST', headers: { apikey: apiKey }, body: fd });
                if (!r.ok) throw new Error('Taggun error ' + r.status);
                const j = await r.json();
                const amount = fieldVal(j.totalAmount) || 0;
                const dt = normDate(fieldVal(j.date)) || getToday();
                const note = String(fieldVal(j.merchantName) || 'Scan struk').slice(0, 40);
                return { amount: Math.round(amount), date: dt, note, category: guessCat(note, expCats, learnedKw) };
            }
            onProg(10, 'Mengirim ke Mindee...');
            fd.append('document', blob, 'struk.jpg');
            const r = await fetch('https://api.mindee.net/v1/products/mindee/expense_receipts/v5/predict', { method: 'POST', headers: { Authorization: 'Token ' + apiKey }, body: fd });
            if (!r.ok) throw new Error('Mindee error ' + r.status);
            const j = await r.json();
            const p = ((((j.document || {}).inference || {}).prediction) || {});
            const amount = fieldVal(p.total_amount) || 0;
            const dt = normDate(fieldVal(p.date)) || getToday();
            const note = String(fieldVal(p.supplier_name) || 'Scan struk').slice(0, 40);
            return { amount: Math.round(amount), date: dt, note, category: guessCat(note + ' ' + JSON.stringify(p), expCats, learnedKw) };
        } catch (e) { onProg(null, (e && e.message ? e.message : 'API gagal') + ' — beralih ke OCR offline...'); }
    }
    
    if (provider === 'offline' || !navigator.onLine) {
        onProg(5, 'Mengunduh mesin OCR (~5MB)... Mohon tunggu.');
    } else {
        onProg(5, 'Menyiapkan mesin OCR...');
    }
    await ensureTesseract();
    
    const res = await Tesseract.recognize(blob, 'ind+eng', { logger: m => {
        if (m.status === 'recognizing text') onProg(10 + Math.round(m.progress * 85), 'Membaca teks struk...');
        else if (m.status) onProg(null, 'OCR: ' + m.status);
    } });
    return parseReceipt(res.data.text, expCats, learnedKw);
};

function usePref(k,v){
    const[s,set]=useState(()=>{try{const i=localStorage.getItem(k);return i?JSON.parse(i):v}catch{return v}});

const rowToWallet=r=>({id:r.id,name:r.name,type:r.type,balance:Number(r.balance)||0});

// Delta saldo dompet yang dihasilkan sebuah transaksi
const txnDelta=t=>{
    const d={};
    if(t.type==='transfer'){
        if(t.transferFrom)d[t.transferFrom]=-t.amount;
        if(t.transferTo)d[t.transferTo]=(d[t.transferTo]||0)+t.amount;
    }else if(t.walletId){
        d[t.walletId]=(t.type==='income'?1:-1)*t.amount;
    }
    return d;
};
const flipDelta=d=>{const o={};Object.keys(d||{}).forEach(k=>{o[k]=-d[k]});return o;};
const mergeDelta=(a,b)=>{const o={...(a||{})};Object.keys(b||{}).forEach(k=>{o[k]=(o[k]||0)+b[k]});return o;};
const errMsg=e=>{
    const m=String((e&&(e.message||e))||'Terjadi kesalahan');
    if(/failed to fetch|fetch failed|networkerror|network request|load failed|timeout|econnrefused/i.test(m))return 'Tidak ada koneksi internet. Periksa jaringanmu, lalu coba lagi.';
    return m;
};

// ===== Cek kelengkapan skema database (Fase 1 + SQL suplemen Fase 2) =====
async function checkSchema(){
    const probes=await Promise.all([
        sb.from('categories').select('code').limit(1),
        sb.from('transactions').select('recurring_pid').limit(1),
        sb.from('budgets').select('id').limit(1),
        sb.from('notes').select('id').limit(1),
        sb.from('todos').select('id').limit(1),
        sb.from('debts').select('id').limit(1),
    ]);
    const labels=['kolom categories.code','kolom transactions.recurring_pid','tabel budgets','tabel notes','tabel todos','tabel debts'];
    return probes.map((p,i)=>p.error?labels[i]:null).filter(Boolean);
}

// ===== Sinkronisasi awal (Read): unduh semua data dari server + seed default =====
async function loadAllData(uid){
    const [wR,cR,tR]=await Promise.all([
        sb.from('wallets').select('*').eq('user_id',uid).order('created_at',{ascending:true}),
        sb.from('categories').select('*').eq('user_id',uid).order('created_at',{ascending:true}),
        sb.from('transactions').select('*').eq('user_id',uid).eq('is_deleted',false).order('date',{ascending:false}).order('created_at',{ascending:false}),
    ]);
    if(wR.error)throw wR.error;
    if(cR.error)throw cR.error;
    if(tR.error)throw tR.error;
    const [bgR,nR,tdR,dbR]=await Promise.all([
        sb.from('budgets').select('*').eq('user_id',uid),
        sb.from('notes').select('*').eq('user_id',uid).order('updated_at',{ascending:false}),
        sb.from('todos').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
        sb.from('debts').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    ]);
    if(bgR.error)throw bgR.error;
    if(nR.error)throw nR.error;
    if(tdR.error)throw tdR.error;
    if(dbR.error)throw dbR.error;

    // Seed data default untuk akun yang masih kosong
    let cats=cR.data.filter(r=>r.code).map(rowToCat);
    if(!cR.data.length){
        const seed=[...DEF_EXP_CAT,...DEF_INC_CAT].map(c=>({user_id:uid,name:c.name,color:c.color,type:c.type,code:c.id}));
        const {data,error}=await sb.from('categories').insert(seed).select();
        if(error)throw error;
        cats=data.map(rowToCat);
    }
    let wallets=wR.data.map(rowToWallet);
    if(!wR.data.length){
        const seed=DEF_WALLETS.map(w=>({user_id:uid,name:w.name,type:w.type,balance:0}));
        const {data,error}=await sb.from('wallets').insert(seed).select();
        if(error)throw error;
        wallets=data.map(rowToWallet);
    }
    let budgets=bgR.data.map(rowToBudget);
    if(!bgR.data.length){
        const seed=DEF_BUDGETS.map(b=>({user_id:uid,category:b.category,categories:b.categories,amount_limit:b.limit,period:b.period}));
        const {data,error}=await sb.from('budgets').insert(seed).select();
        if(error)throw error;
        budgets=data.map(rowToBudget);
    }
    return {
        wallets,
        txns:tR.data.map(rowToTxn),
        budgets,
        notes:nR.data.map(rowToNote),
        todos:tdR.data.map(rowToTodo),
        debts:dbR.data.map(rowToDebt),
        expCats:cats.filter(c=>c.type==='expense'),
        incCats:cats.filter(c=>c.type==='income'),
    };
}

function fireConfetti(){
    const container=document.getElementById('confettiContainer');
    const colors=['#fbbf24','#f59e0b','#3b82f6','#8b5cf6','#ef4444','#10b981','#ec4899'];
    for(let i=0;i<60;i++){
        const c=document.createElement('div');
        c.className='confetti';
        c.style.left=Math.random()*100+'%';
        c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDelay=Math.random()*0.5+'s';
        c.style.animationDuration=(2+Math.random()*2)+'s';
        c.style.width=(6+Math.random()*8)+'px';
        c.style.height=(6+Math.random()*8)+'px';
        c.style.borderRadius=Math.random()>.5?'50%':'2px';
        container.appendChild(c);
    }
    setTimeout(()=>{container.innerHTML=''},4000);
}

function SwipeItem({children,onDel}){
    const[off,setOff]=useState(0);const[drag,setDrag]=useState(false);const sx=useRef(0);const TH=70;
    const ts=e=>{e.stopPropagation(); sx.current=e.touches[0].clientX;setDrag(true)};
    const tm=e=>{e.stopPropagation(); if(!drag)return;const d=e.touches[0].clientX-sx.current;if(d<0)setOff(Math.max(d,-TH-30))};
    const te=e=>{e.stopPropagation(); setDrag(false);if(off<-TH)setOff(-TH);else setOff(0)};
    return(
        <div className="swipe-wrap">
            <div className="swipe-bg bg-red-600 rounded-r-xl">
                <button onClick={(e)=>{e.stopPropagation(); onDel();}} className="text-white text-xs font-semibold px-3 py-1 rounded bg-red-700">Hapus</button>
            </div>
            <div className={`swipe-fg bg-dark-700 rounded-xl ${drag?'dragging':''}`} style={{transform:`translateX(${off}px)`}} onTouchStart={ts} onTouchMove={tm} onTouchEnd={te}>
                {children}
            </div>
        </div>
    );
}

function Toasts({toasts}){
    if(!toasts.length)return null;
    return(
        <div className="fixed top-3 left-0 right-0 max-w-md mx-auto px-4 z-[70] space-y-2 pointer-events-none">
            {toasts.map(t=>(
                <div key={t.id} className={`pointer-events-auto rounded-xl px-4 py-3 text-sm shadow-2xl border modal-ct flex items-start gap-2 ${t.type==='ok'?'bg-green-600/25 border-green-500/40 text-green-300':t.type==='info'?'bg-blue-600/25 border-blue-500/40 text-blue-300':'bg-red-600/25 border-red-500/40 text-red-300'}`}>
                    <span className="shrink-0">{t.type==='ok'?'✅':'⚠️'}</span>
                    <span className="flex-1 break-words">{t.msg}</span>
                </div>
            ))}
        </div>
    );
}

function Root(){
    const[session,setSession]=useState(null);
    const[authReady,setAuthReady]=useState(false);
    const[toasts,setToasts]=useState([]);
    const toast=useCallback((msg,type='error')=>{
        const id=genId();
        setToasts(p=>[...p,{id,msg,type}].slice(-3));
        setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)),4500);
    },[]);
    useEffect(()=>{
        let mounted=true;
        sb.auth.getSession().then(({data})=>{if(mounted){setSession(data.session);setAuthReady(true);}}).catch(()=>{if(mounted)setAuthReady(true);});
        const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>{if(mounted){setSession(s);setAuthReady(true);}});
        return()=>{mounted=false;try{sub.subscription.unsubscribe();}catch(e){}};
    },[]);
    if(!authReady)return(<div className="min-h-screen"><Splash/><Toasts toasts={toasts}/></div>);
    return(
        <div className="min-h-screen">
            {session?<App key={session.user.id} user={session.user} toast={toast}/>:<AuthScreen toast={toast}/>}
            <Toasts toasts={toasts}/>
        </div>
    );
}

// ===== Layar Autentikasi (Fase 1: Login / Register sebelum dashboard) =====
const AUTH_ERR_MAP={
    'Invalid login credentials':'Email atau password salah.',
    'Email not confirmed':'Email belum dikonfirmasi. Cek inbox/spam kamu, lalu coba lagi.',
    'User already registered':'Email sudah terdaftar. Silakan masuk.',
    'Password should be at least 6 characters.':'Password minimal 6 karakter.',
    'Unable to validate email address: invalid format':'Format email tidak valid.',
    'For security purposes, you can only request this after 60 seconds.':'Tunggu sebentar sebelum meminta ulang.',
    'Email rate limit exceeded':'Terlalu banyak percobaan. Coba lagi beberapa menit.',
};
const authErr=m=>{
    const s=String(m||'');
    if(AUTH_ERR_MAP[s])return AUTH_ERR_MAP[s];
    const k=Object.keys(AUTH_ERR_MAP).find(key=>s.toLowerCase().includes(key.toLowerCase()));
    return k?AUTH_ERR_MAP[k]:s;
};

function AuthScreen({toast}){
    const[mode,setMode]=useState('login'); // login | register | forgot
    const[email,setEmail]=useState('');
    const[pw,setPw]=useState('');
    const[pw2,setPw2]=useState('');
    const[busy,setBusy]=useState(false);
    const[err,setErr]=useState('');
    const[info,setInfo]=useState('');
    const switchMode=m=>{setMode(m);setErr('');setInfo('');setPw('');setPw2('');};
    const login=async e=>{
        e.preventDefault();if(busy)return;
        setBusy(true);setErr('');setInfo('');
        const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
        setBusy(false);
        if(error)setErr(authErr(error.message));
    };
    const register=async e=>{
        e.preventDefault();if(busy)return;
        if(pw.length<6){setErr('Password minimal 6 karakter.');return;}
        if(pw!==pw2){setErr('Konfirmasi password tidak cocok.');return;}
        setBusy(true);setErr('');setInfo('');
        const {data,error}=await sb.auth.signUp({email:email.trim(),password:pw});
        setBusy(false);
        if(error){setErr(authErr(error.message));return;}
        if(!(data&&data.session))setInfo('Pendaftaran berhasil! Cek email kamu (termasuk folder spam) untuk konfirmasi akun, lalu masuk kembali.');
    };
    const resend=async()=>{
        if(!email.trim()){setErr('Isi email kamu dulu.');return;}
        const {error}=await sb.auth.resend({type:'signup',email:email.trim()});
        if(error){setErr(authErr(error.message));return;}
        setInfo('Email konfirmasi dikirim ulang. Cek inbox/spam kamu.');
    };
    const reset=async e=>{
        e.preventDefault();if(busy)return;
        if(!email.trim()){setErr('Isi email kamu dulu.');return;}
        setBusy(true);setErr('');setInfo('');
        const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:window.location.href});
        setBusy(false);
        if(error){setErr(authErr(error.message));return;}
        setInfo('Link reset password sudah dikirim ke email kamu.');
    };
    return(
        <div className="min-h-screen flex flex-col items-center justify-center p-6">
            <div className="w-full max-w-sm">
                <div className="text-center mb-8">
                    <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-blue-600 to-purple-700 flex items-center justify-center text-3xl shadow-lg shadow-blue-600/30 mb-4">🌱</div>
                    <h1 className="text-2xl font-bold">NataHidup</h1>
                    <p className="text-dark-400 text-sm mt-1">Produktivitas & keuangan pribadi, tersinkron di cloud</p>
                </div>
                <div className="bg-dark-800 rounded-2xl p-5 border border-dark-700">
                    {mode!=='forgot'&&(
                        <div className="flex gap-1 bg-dark-700 rounded-xl p-1 mb-5">
                            <button onClick={()=>switchMode('login')} className={`flex-1 py-2 rounded-lg text-sm font-medium transition-all ${mode==='login'?'bg-blue-600 text-white':'text-dark-400'}`}>Masuk</button>
                            <button onClick={()=>switchMode('register')} className={`flex-1 py-2 rounded-lg text-sm font-medium transition-all ${mode==='register'?'bg-blue-600 text-white':'text-dark-400'}`}>Daftar</button>
                        </div>
                    )}
                    {err!==''&&<div className="bg-red-500/10 border border-red-500/30 text-red-300 text-xs rounded-xl p-3 mb-4">{err}</div>}
                    {info!==''&&<div className="bg-green-500/10 border border-green-500/30 text-green-300 text-xs rounded-xl p-3 mb-4">{info}</div>}
                    {mode==='login'&&(
                        <form onSubmit={login} className="space-y-3">
                            <input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="email" required/>
                            <input type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} autoComplete="current-password" required/>
                            <button type="submit" disabled={busy} className={`w-full py-3 rounded-xl font-semibold text-white ${busy?'bg-dark-600 text-dark-400':'bg-blue-600'}`}>{busy?'Memproses...':'Masuk'}</button>
                            <div className="flex justify-between text-xs pt-1">
                                <button type="button" onClick={()=>switchMode('forgot')} className="text-dark-400 hover:text-blue-400">Lupa password?</button>
                                <button type="button" onClick={resend} className="text-dark-400 hover:text-blue-400">Kirim ulang email konfirmasi</button>
                            </div>
                        </form>
                    )}
                    {mode==='register'&&(
                        <form onSubmit={register} className="space-y-3">
                            <input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="email" required/>
                            <input type="password" placeholder="Password (min. 6 karakter)" value={pw} onChange={e=>setPw(e.target.value)} autoComplete="new-password" required/>
                            <input type="password" placeholder="Ulangi password" value={pw2} onChange={e=>setPw2(e.target.value)} autoComplete="new-password" required/>
                            <button type="submit" disabled={busy} className={`w-full py-3 rounded-xl font-semibold text-white ${busy?'bg-dark-600 text-dark-400':'bg-blue-600'}`}>{busy?'Memproses...':'Buat Akun'}</button>
                            <p className="text-[10px] text-dark-500 text-center">Data kamu tersimpan di cloud Supabase dan bisa diakses dari perangkat mana pun dengan akun ini.</p>
                        </form>
                    )}
                    {mode==='forgot'&&(
                        <form onSubmit={reset} className="space-y-3">
                            <p className="text-xs text-dark-400 mb-2">Masukkan email akunmu. Kami kirimkan link untuk mengatur password baru.</p>
                            <input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="email" required/>
                            <button type="submit" disabled={busy} className={`w-full py-3 rounded-xl font-semibold text-white ${busy?'bg-dark-600 text-dark-400':'bg-blue-600'}`}>{busy?'Memproses...':'Kirim Link Reset'}</button>
                            <button type="button" onClick={()=>switchMode('login')} className="w-full py-2 rounded-xl bg-dark-700 text-sm text-dark-300">Kembali ke Login</button>
                        </form>
                    )}
                </div>
            </div>
        </div>
    );
}

// ===== Fase 3: skeleton loading =====
function DashSkel(){
    return(
        <div className="space-y-5">
            <div className="h-12 bg-dark-700 rounded-xl animate-pulse"/>
            <div className="h-36 bg-dark-700 rounded-2xl animate-pulse"/>
            <div className="h-24 bg-dark-700 rounded-2xl animate-pulse"/>
            <div className="h-44 bg-dark-700 rounded-2xl animate-pulse"/>
        </div>
    );
}

function App({user,toast}){
    const[tab,setTab]=useState('home');const[modal,setModal]=useState(null);const[mData,setMData]=useState(null);
    // ===== Fase 2: state data diisi dari server (bukan localStorage) =====
    const[wallets,setWallets]=useState([]);
    const[txns,setTxns]=useState([]);
    const[budgets,setBudgets]=useState([]);
    const[notes,setNotes]=useState([]);
    const[todos,setTodos]=useState([]);
    const[debts,setDebts]=useState([]);
    const[expCats,setExpCats]=useState([]);
    const[incCats,setIncCats]=useState([]);
    const[loading,setLoading]=useState(true);
    const[bootError,setBootError]=useState('');
    const[online,setOnline]=useState(typeof navigator==='undefined'||navigator.onLine!==false);
    const[undoTxn,setUndoTxn]=useState(null);
    // Pengaturan khusus perangkat (bukan data pengguna)
    const[ocrProvider,setOcrProvider]=usePref('nh_ocrp','offline');
    const[ocrKey,setOcrKey]=usePref('nh_ocrk','');
    const[learnedKw,setLearnedKw]=usePref('nh_lkw',{});
    const[celebratedAt,setCelebratedAt]=usePref('nh_celebrated',[]);
    const[pageKey,setPageKey]=useState(0);

    const walletsRef=useRef([]);walletsRef.current=wallets;
    const recRef=useRef(false);

    useEffect(()=>{
        const up=()=>setOnline(true),dn=()=>setOnline(false);
        window.addEventListener('online',up);window.addEventListener('offline',dn);
        return()=>{window.removeEventListener('online',up);window.removeEventListener('offline',dn)};
    },[]);

    // ===== Fase 2: sinkronisasi awal (Read) — fetch ke API saat App dimuat =====
    const boot=useCallback(async()=>{
        setLoading(true);setBootError('');
        try{
            const missing=await checkSchema();
            if(missing.length)throw new Error('Skema database belum lengkap ('+missing.join(', ')+'). Jalankan SQL/suplemen_fase2.sql di Supabase SQL Editor, lalu muat ulang.');
            const d=await loadAllData(user.id);
            setWallets(d.wallets);setTxns(d.txns);setBudgets(d.budgets);
            setNotes(d.notes);setTodos(d.todos);setDebts(d.debts);
            setExpCats(d.expCats);setIncCats(d.incCats);
        }catch(e){
            setBootError(errMsg(e));
        }finally{
            setLoading(false);
        }
    },[user.id]);
    useEffect(()=>{boot()},[boot]);

    const allCats=useMemo(()=>[...expCats,...incCats],[expCats,incCats]);
    const getCat=id=>allCats.find(c=>c.id===id);
    const totalBal=useMemo(()=>wallets.reduce((s,w)=>s+w.balance,0),[wallets]);

    const mTxns=useMemo(()=>txns.filter(t=>t.date&&t.date.startsWith(getMY())&&t.type!=='transfer'),[txns]);
    const mIncome=useMemo(()=>mTxns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),[mTxns]);
    const mExpense=useMemo(()=>mTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),[mTxns]);
    const todayTxns=useMemo(()=>txns.filter(t=>t.date===getToday()),[txns]);
    const todayExp=useMemo(()=>todayTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),[todayTxns]);
    const catSpend=useMemo(()=>{const s={};mTxns.filter(t=>t.type==='expense').forEach(t=>{s[t.category]=(s[t.category]||0)+t.amount});return s},[mTxns]);
    const remain=mIncome-mExpense;

    // ===== Streak kini dihitung (derived) dari data transaksi server =====
    const streak=useMemo(()=>{
        if(loading||!txns.length)return{current:0,longest:0};
        const dates=txns.map(t=>t.date).filter(Boolean).sort();
        const first=dates[0];
        const yStr=new Date(Date.now()-864e5).toISOString().split('T')[0];
        if(!first||yStr<first)return{current:0,longest:0};
        const now=new Date();const dim=daysInMonth(now.getFullYear(),now.getMonth()+1);
        const dailyLim=budgets.reduce((s,b)=>s+(b.limit||0),0)/dim;
        const expByDay={};
        txns.forEach(t=>{if(t.type==='expense'&&t.date)expByDay[t.date]=(expByDay[t.date]||0)+t.amount;});
        const ok=ds=>(expByDay[ds]||0)<=dailyLim;
        let cur=0;
        for(let ms=Date.parse(yStr+'T00:00:00Z');;ms-=864e5){
            const ds=new Date(ms).toISOString().split('T')[0];
            if(ds<first)break;
            if(ok(ds))cur++;else break;
        }
        let longest=0,run=0;
        for(let ms=Date.parse(first+'T00:00:00Z');ms<=Date.parse(yStr+'T00:00:00Z');ms+=864e5){
            const ds=new Date(ms).toISOString().split('T')[0];
            if(ok(ds)){run++;if(run>longest)longest=run;}else run=0;
        }
        return{current:cur,longest:Math.max(longest,cur)};
    },[txns,budgets,loading]);

    // Rayakan milestone streak (sekali per perangkat per milestone)
    useEffect(()=>{
        const sc=streak.current;const ms=[7,14,30,50,100,200,365];
        if(!sc||!ms.includes(sc)||celebratedAt.includes(sc))return;
        setCelebratedAt(p=>[...p,sc]);
        setTimeout(()=>fireConfetti(),500);
    },[streak.current]);

    // ===== Saldo dompet: hitung delta -> simpan ke server -> perbarui UI =====
    const applyWalletDelta=async delta=>{
        const entries=Object.entries(delta||{}).filter(([,v])=>v!==0);
        if(!entries.length)return;
        await Promise.all(entries.map(async([wid,d])=>{
            const w=walletsRef.current.find(x=>x.id===wid);
            if(!w)return;
            const nb=Math.round(w.balance+d);
            const {error}=await sb.from('wallets').update({balance:nb}).eq('id',wid);
            if(error)toast('Saldo dompet "'+w.name+'" gagal diperbarui: '+errMsg(error));
            else setWallets(p=>p.map(x=>x.id===wid?{...x,balance:nb}:x));
        }));
    };

    // ===== Transaksi berulang: buat transaksi anak di server tiap bulan =====
    useEffect(()=>{
        if(loading||recRef.current)return;
        recRef.current=true;
        (async()=>{
            const my=getMY();const dayNum=new Date().getDate();
            const templates=txns.filter(t=>t.isRecurring&&t.recurringDay);
            for(const r of templates){
                try{
                    const exists=txns.some(t=>t.recurringPid===r.id&&t.date&&t.date.startsWith(my));
                    if(exists||dayNum<r.recurringDay)continue;
                    const payload=txnToRow({...r,isRecurring:false,recurringPid:r.id,date:`${my}-${String(r.recurringDay).padStart(2,'0')}`});
                    payload.user_id=user.id;
                    const {data,error}=await sb.from('transactions').insert(payload).select().single();
                    if(error)throw error;
                    const nt=rowToTxn(data);
                    setTxns(p=>[nt,...p]);
                    await applyWalletDelta(txnDelta(nt));
                }catch(e){toast('Transaksi berulang gagal dibuat: '+errMsg(e));}
            }
        })();
    },[loading]);

    // ===== Fase 2: mutasi (Create/Update/Delete) — request ke server dulu, UI menyusul =====
    const addTxn=async t=>{
        triggerHaptic();
        try{
            const payload=txnToRow(t);payload.user_id=user.id;
            const {data,error}=await sb.from('transactions').insert(payload).select().single();
            if(error)throw error;
            const nt=rowToTxn(data);
            setTxns(p=>[nt,...p]);
            await applyWalletDelta(txnDelta(nt));
            return true;
        }catch(e){toast('Gagal menyimpan transaksi: '+errMsg(e));return false;}
    };

    const saveTxn=async t=>{
        triggerHaptic();
        if(mData&&mData.id){
            try{
                const old=txns.find(x=>x.id===mData.id);
                const payload=txnToRow(t);
                const {data,error}=await sb.from('transactions').update(payload).eq('id',mData.id).select().single();
                if(error)throw error;
                const nt=rowToTxn(data);
                setTxns(p=>p.map(x=>x.id===nt.id?{...nt,createdAt:x.createdAt}:x));
                if(old)await applyWalletDelta(mergeDelta(flipDelta(txnDelta(old)),txnDelta(nt)));
                return true;
            }catch(e){toast('Gagal memperbarui transaksi: '+errMsg(e));return false;}
        }
        return await addTxn(t);
    };

    // Fase 3: hapus transaksi = soft delete di server (kolom is_deleted) + jendela Undo
    const delTxn=async(id,callback)=>{
        if(!id)return;
        const t=txns.find(x=>x.id===id);
        if(!t)return;
        triggerHaptic();
        try{
            const {error}=await sb.from('transactions').update({is_deleted:true}).eq('id',id);
            if(error)throw error;
            setTxns(p=>p.filter(x=>x.id!==id));
            await applyWalletDelta(flipDelta(txnDelta(t)));
            setUndoTxn({txn:t});
            if(callback)callback();
        }catch(e){toast('Gagal menghapus transaksi: '+errMsg(e));}
    };

    useEffect(()=>{
        if(!undoTxn)return;
        const tm=setTimeout(()=>setUndoTxn(null),6000);
        return()=>clearTimeout(tm);
    },[undoTxn]);

    const undoDelete=async()=>{
        if(!undoTxn)return;
        const t=undoTxn.txn;
        setUndoTxn(null);
        try{
            const {error}=await sb.from('transactions').update({is_deleted:false}).eq('id',t.id);
            if(error)throw error;
            setTxns(p=>[t,...p]);
            await applyWalletDelta(txnDelta(t));
            toast('Transaksi dipulihkan','ok');
        }catch(e){toast('Gagal memulihkan transaksi: '+errMsg(e));}
    };

    const addNote=async n=>{
        triggerHaptic();
        try{
            const {data,error}=await sb.from('notes').insert({user_id:user.id,title:n.title||'',content:n.content||'',tags:n.tags||[],pinned:!!n.pinned}).select().single();
            if(error)throw error;
            setNotes(p=>[rowToNote(data),...p]);
            return true;
        }catch(e){toast('Gagal menyimpan catatan: '+errMsg(e));return false;}
    };
    const updNote=async(id,u)=>{
        try{
            const {data,error}=await sb.from('notes').update({title:u.title||'',content:u.content||'',tags:u.tags||[],pinned:!!u.pinned,updated_at:new Date().toISOString()}).eq('id',id).select().single();
            if(error)throw error;
            setNotes(p=>p.map(n=>n.id===id?rowToNote(data):n));
            return true;
        }catch(e){toast('Gagal memperbarui catatan: '+errMsg(e));return false;}
    };
    const delNote=async id=>{
        try{
            const {error}=await sb.from('notes').delete().eq('id',id);
            if(error)throw error;
            setNotes(p=>p.filter(n=>n.id!==id));
        }catch(e){toast('Gagal menghapus catatan: '+errMsg(e));}
    };

    const addTodo=async t=>{
        triggerHaptic();
        try{
            const {data,error}=await sb.from('todos').insert({user_id:user.id,title:t.title,completed:false,deadline:t.deadline||null,budget:t.budget||0}).select().single();
            if(error)throw error;
            setTodos(p=>[rowToTodo(data),...p]);
            return true;
        }catch(e){toast('Gagal menambah tugas: '+errMsg(e));return false;}
    };
    const togTodo=async id=>{
        const todo=todos.find(t=>t.id===id);
        if(!todo)return;
        if(!todo.completed&&todo.budget>0){openM('todoBudget',todo);return;}
        const nv=!todo.completed;
        try{
            const {error}=await sb.from('todos').update({completed:nv}).eq('id',id);
            if(error)throw error;
            setTodos(p=>p.map(t=>t.id===id?{...t,completed:nv}:t));
        }catch(e){toast('Gagal memperbarui tugas: '+errMsg(e));}
    };
    const delTodo=async id=>{
        try{
            const {error}=await sb.from('todos').delete().eq('id',id);
            if(error)throw error;
            setTodos(p=>p.filter(t=>t.id!==id));
        }catch(e){toast('Gagal menghapus tugas: '+errMsg(e));}
    };

    const completeTodoWithExpense=async(todoId,realCost,walletId)=>{
        const todo=todos.find(t=>t.id===todoId);
        try{
            const {error}=await sb.from('todos').update({completed:true}).eq('id',todoId);
            if(error)throw error;
            setTodos(p=>p.map(t=>t.id===todoId?{...t,completed:true}:t));
        }catch(e){toast('Gagal memperbarui tugas: '+errMsg(e));return;}
        if(todo){
            const fallback=expCats.find(c=>c.id==='lainnya_e')||expCats[expCats.length-1];
            await addTxn({type:'expense',amount:realCost,category:fallback?fallback.id:'',note:`[Auto-Todo] ${todo.title}`,date:getToday(),walletId:walletId});
        }
        closeM();
    };
    const skipTodoExpense=async todoId=>{
        try{
            const {error}=await sb.from('todos').update({completed:true}).eq('id',todoId);
            if(error)throw error;
            setTodos(p=>p.map(t=>t.id===todoId?{...t,completed:true}:t));
            closeM();
        }catch(e){toast('Gagal memperbarui tugas: '+errMsg(e));}
    };

    const addDebt=async d=>{
        triggerHaptic();
        try{
            const {data,error}=await sb.from('debts').insert({user_id:user.id,name:d.name,dtype:d.dtype||'hutang',amount:d.amount,due_date:d.dueDate||null,note:d.note||'',status:'pending'}).select().single();
            if(error)throw error;
            setDebts(p=>[rowToDebt(data),...p]);
            return true;
        }catch(e){toast('Gagal menyimpan hutang: '+errMsg(e));return false;}
    };
    const togDebt=async id=>{
        const d=debts.find(x=>x.id===id);
        if(!d)return;
        const ns=d.status==='pending'?'paid':'pending';
        try{
            const {error}=await sb.from('debts').update({status:ns}).eq('id',id);
            if(error)throw error;
            setDebts(p=>p.map(x=>x.id===id?{...x,status:ns}:x));
        }catch(e){toast('Gagal memperbarui hutang: '+errMsg(e));}
    };
    const delDebt=async id=>{
        try{
            const {error}=await sb.from('debts').delete().eq('id',id);
            if(error)throw error;
            setDebts(p=>p.filter(x=>x.id!==id));
        }catch(e){toast('Gagal menghapus hutang: '+errMsg(e));}
    };

    const addWallet=async w=>{
        try{
            const {data,error}=await sb.from('wallets').insert({user_id:user.id,name:w.name,type:w.type,balance:0}).select().single();
            if(error)throw error;
            setWallets(p=>[...p,rowToWallet(data)]);
            return true;
        }catch(e){toast('Gagal menambah dompet: '+errMsg(e));return false;}
    };

    const saveBudgets=async list=>{
        try{
            for(const b of list){
                const {error}=await sb.from('budgets').update({category:b.category,categories:(b.categories&&b.categories.length)?b.categories:[b.category],amount_limit:b.limit||0,period:b.period||'monthly'}).eq('id',b.id);
                if(error)throw error;
            }
            setBudgets(list.map(b=>({...b,categories:(b.categories&&b.categories.length)?b.categories:[b.category]})));
            return true;
        }catch(e){toast('Gagal menyimpan budget: '+errMsg(e));return false;}
    };

    const addCat=async(name,type)=>{
        const nm=String(name||'').trim();
        if(!nm)return false;
        const code='c'+genId();
        const color=CAT_COLORS[Math.floor(Math.random()*CAT_COLORS.length)];
        try{
            const {data,error}=await sb.from('categories').insert({user_id:user.id,name:nm,color,type,code}).select().single();
            if(error)throw error;
            const c=rowToCat(data);
            if(type==='expense')setExpCats(p=>[...p,c]);else setIncCats(p=>[...p,c]);
            return true;
        }catch(e){toast('Gagal menambah kategori: '+errMsg(e));return false;}
    };
    const delCat=async id=>{
        const c=allCats.find(x=>x.id===id);
        if(!c)return false;
        try{
            const {error}=await sb.from('categories').delete().eq('id',c.dbId);
            if(error)throw error;
            setExpCats(p=>p.filter(x=>x.id!==id));
            setIncCats(p=>p.filter(x=>x.id!==id));
            return true;
        }catch(e){toast('Gagal menghapus kategori: '+errMsg(e));return false;}
    };

    const openM=(t,d=null)=>{setMData(d);setModal(t)};
    const closeM=()=>{setModal(null);setMData(null)};

    const tabs=['home','notes','finance','settings'];
    const tabIdx=tabs.indexOf(tab);
    const touchStartX=useRef(0);
    const handleTouchStart=e=>{touchStartX.current=e.touches[0].clientX};
    const handleTouchEnd=e=>{
        const diff=e.changedTouches[0].clientX-touchStartX.current;
        if(Math.abs(diff)>80){
            if(diff<0&&tabIdx<tabs.length-1){setTab(tabs[tabIdx+1]);setPageKey(k=>k+1)}
            else if(diff>0&&tabIdx>0){setTab(tabs[tabIdx-1]);setPageKey(k=>k+1)}
        }
    };

    // ===== Fase 3: layar error saat gagal memuat data dari server =====
    if(bootError&&!loading){
        return(
            <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center gap-5">
                <div className="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center text-red-400"><I.Alert/></div>
                <div>
                    <h1 className="text-xl font-bold mb-2">Gagal memuat data</h1>
                    <p className="text-dark-400 text-sm max-w-xs mx-auto leading-relaxed">{bootError}</p>
                </div>
                <button onClick={boot} className="px-8 py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold">Coba Lagi</button>
                <button onClick={()=>sb.auth.signOut()} className="text-dark-500 text-xs underline">Keluar dari akun</button>
            </div>
        );
    }

    return(
        <div className="pb-20 min-h-screen" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
            {!online&&(
                <div className="fixed top-0 left-0 right-0 max-w-md mx-auto bg-red-600/95 text-white text-center text-[11px] font-medium py-1.5 z-[65]">
                    Kamu sedang offline — perubahan tidak bisa disimpan
                </div>
            )}
            <div className="px-4 pt-4 page-enter" key={pageKey}>
                {tab==='home'&&<Dash wallets={wallets} totalBal={totalBal} mIncome={mIncome} mExpense={mExpense} remain={remain} todayExp={todayExp} todayTxns={todayTxns} todos={todos} budgets={budgets} catSpend={catSpend} streak={streak} allCats={allCats} openM={openM} loading={loading}/>}
                {tab==='notes'&&<NotesMod notes={notes} todos={todos} addNote={addNote} updNote={updNote} delNote={delNote} addTodo={addTodo} togTodo={togTodo} delTodo={delTodo} openM={openM} loading={loading}/>}
                {tab==='finance'&&<FinMod wallets={wallets} txns={txns} mTxns={mTxns} budgets={budgets} catSpend={catSpend} mIncome={mIncome} mExpense={mExpense} debts={debts} totalBal={totalBal} allCats={allCats} getCat={getCat} addDebt={addDebt} togDebt={togDebt} delDebt={delDebt} delTxn={delTxn} openM={openM} loading={loading}/>}
                {tab==='settings'&&<SetMod wallets={wallets} txns={txns} notes={notes} todos={todos} debts={debts} expCats={expCats} incCats={incCats} addCat={addCat} delCat={delCat} streak={streak} user={user} toast={toast} ocrProvider={ocrProvider} setOcrProvider={setOcrProvider} ocrKey={ocrKey} setOcrKey={setOcrKey} onRefresh={boot}/>}
            </div>

            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-dark-800/60 backdrop-blur-lg border-t border-white/10 px-2 pb-2 pt-1 z-40">
                <div className="flex items-center justify-around">
                    <NB ic={<I.Home/>} lb="Home" ac={tab==='home'} fn={()=>{setTab('home');setPageKey(k=>k+1)}}/>

function Dash({wallets, totalBal, mIncome, mExpense, remain, todayExp, todayTxns, todos, budgets, catSpend, streak, allCats, openM, loading}){
    const now=new Date();const g=now.getHours()<12?'Selamat Pagi':now.getHours()<18?'Selamat Siang':'Selamat Malam';
    const dn=now.toLocaleDateString('id-ID',{weekday:'long'});
    const pendTodos=todos.filter(t=>!t.completed).slice(0,4);
    const warnings=budgets.filter(b=>{const s=catSpend[b.category]||0;return b.limit>0&&s/b.limit>.7}).slice(0,3);
    const dim=daysInMonth(now.getFullYear(),now.getMonth()+1);
    const totalBudget=budgets.reduce((s,b)=>s+b.limit,0);
    const dailyLim=totalBudget/dim;
    const sc=streak.current;
    const milestone=sc>=365?'365 Hari':sc>=100?'100 Hari':sc>=50?'50 Hari':sc>=30?'Legendaris':sc>=14?'Luar Biasa':sc>=7?'Konsisten':sc>=3?'Mulai Bagus':'';
    const streakClass=sc>=365?'streak-legend':sc>=100?'streak-diamond':sc>=50?'streak-gold':'';
    const streakTextColor=sc>=50?'text-dark-900':'text-orange-400';
    const streakBgText=sc>=50?'text-dark-700':'text-dark-400';
    if(loading)return<DashSkel/>;

    return(
        <div className="space-y-5">
            <div className="pt-2"><p className="text-dark-400 text-sm">{dn}, {fmtD(now)}</p><h1 className="text-2xl font-bold mt-1">{g}</h1></div>
            {sc>0&&(
                <div className={`${streakClass} rounded-2xl p-4 flex items-center gap-4 ${sc<50?'bg-gradient-to-r from-orange-600/20 to-amber-600/20 border border-orange-500/30':''}`}>
                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${sc>=50?'bg-white/30':'bg-orange-500/20'} ${streakTextColor}`}>{sc>=100?<I.Trophy/>:<I.Flame/>}</div>
                    <div className="flex-1">
                        <p className={`font-bold text-sm ${streakTextColor}`}>{sc} Hari Berturut-turut Hemat</p>
                        <p className={`${streakBgText} text-xs`}>Terpanjang: {streak.longest} hari{milestone&&<span className={`font-semibold ml-1 ${streakTextColor}`}>-- {milestone}</span>}</p>
                    </div>
                    {sc>=50&&<span className="text-2xl">🏆</span>}
                </div>
            )}
            <div className="bg-gradient-to-br from-blue-600 to-purple-700 rounded-2xl p-5 shadow-lg shadow-blue-600/20">
                <p className="text-blue-200 text-sm">Total Saldo</p>
                <p className="text-3xl font-bold mt-1">{fmtC(totalBal)}</p>
                <div className="flex justify-between mt-4 pt-4 border-t border-white/20">
                    <div><p className="text-blue-200 text-xs">Pemasukan</p><p className="text-sm font-semibold text-green-300 flex items-center gap-1"><I.Up/>{fmtC(mIncome)}</p></div>
                    <div className="text-right"><p className="text-blue-200 text-xs">Pengeluaran</p><p className="text-sm font-semibold text-red-300 flex items-center gap-1"><I.Down/>{fmtC(mExpense)}</p></div>
                </div>
            </div>
            <div className="bg-dark-700 rounded-2xl p-4">
                <div className="flex justify-between items-center mb-3">
                    <h3 className="font-semibold text-sm">Sisa Budget Bulan Ini</h3>
                    <span className={`text-sm font-bold ${remain>=0?'text-green-400':'text-red-400'}`}>{fmtC(remain)}</span>
                </div>
                <div className="w-full bg-dark-600 rounded-full h-3">
                    <div className={`h-3 rounded-full bb ${remain>500000?'bg-green-500':remain>0?'bg-yellow-500':'bg-red-500'}`} style={{width:`${Math.min(100,Math.max(0,mIncome>0?(remain/mIncome)*100:0))}%`}}/>
                </div>
                <div className="flex justify-between mt-2">
                    <p className="text-dark-400 text-xs">Limit harian: {fmtC(dailyLim)}</p>
                    <p className={`text-xs ${todayExp>dailyLim?'text-red-400 font-semibold':'text-dark-400'}`}>Hari ini: {fmtC(todayExp)}</p>
                </div>
            </div>
            {warnings.length>0&&(
                <div className="bg-dark-700 rounded-2xl p-4">
                    <h3 className="font-semibold text-sm mb-3 flex items-center gap-2 text-yellow-400"><I.Alert/> Peringatan Budget</h3>
                    <div className="space-y-3">
                        {warnings.map(bw=>{
                            const spent=catSpend[bw.category]||0;const pct=Math.min(100,(spent/bw.limit)*100);
                            const isOver=pct>=100;
                            return(
                                <div key={bw.id}>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="flex items-center gap-1.5"><CatBadge cat={{name:bw.category,color:'#6b7280'}} size="sm"/><span className="capitalize">{bw.category}</span></span>
                                        <span className={isOver?'text-red-400 font-bold':'text-yellow-400'}>{fmtC(spent)} / {fmtC(bw.limit)}</span>
                                    </div>
                                    <div className="w-full bg-dark-600 rounded-full h-2"><div className={`h-2 rounded-full bb ${isOver?'bg-red-500':'bg-yellow-500'}`} style={{width:`${pct}%`}}/></div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}
            <div className="bg-dark-700 rounded-2xl p-4">
                <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><I.Cal/> Hari Ini</h3>
                <div className="flex justify-between items-center mb-3 pb-3 border-b border-dark-600">
                    <span className="text-dark-300 text-sm">Pengeluaran hari ini</span>
                    <span className="font-bold text-sm">{fmtC(todayExp)}</span>
                </div>
                {todayTxns.length>0?(
                    <div className="space-y-2">{todayTxns.slice(0,3).map(t=>{
                        if(t.type==='transfer'){
                            const fromW=wallets.find(w=>w.id===t.transferFrom);
                            const toW=wallets.find(w=>w.id===t.transferTo);
                            return(<div key={t.id} className="flex items-center gap-3 py-1"><div className="w-6 h-6 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400"><I.Transfer/></div><div className="flex-1 min-w-0"><p className="text-sm truncate">Transfer: {fromW?.name} → {toW?.name}</p></div><span className="text-sm font-semibold text-blue-400">{fmtC(t.amount)}</span></div>);
                        }
                        const cat=allCats.find(c=>c.id===t.category)||{name:t.category,color:'#6b7280'};
                        return(<div key={t.id} className="flex items-center gap-3 py-1"><CatBadge cat={cat} size="sm"/><div className="flex-1 min-w-0"><p className="text-sm truncate">{t.note||cat.name}</p></div><span className={`text-sm font-semibold ${t.type==='income'?'text-green-400':'text-red-400'}`}>{t.type==='income'?'+':'-'}{fmtC(t.amount)}</span></div>);
                    })}</div>
                ):(<p className="text-dark-500 text-sm text-center py-2">Belum ada transaksi</p>)}
                {pendTodos.length>0&&(
                    <><div className="border-t border-dark-600 mt-3 pt-3"><p className="text-dark-400 text-xs mb-2">Tugas ({pendTodos.length})</p></div>
                    <div className="space-y-2">{pendTodos.map(t=>(<div key={t.id} className="flex items-center gap-2"><div className="w-4 h-4 border-2 border-dark-400 rounded shrink-0"/><span className="text-sm truncate flex-1">{t.title}</span>{t.deadline&&<span className="text-xs text-dark-500">{fmtD(t.deadline)}</span>}</div>))}</div></>
                )}
            </div>
        </div>
    );
}

function TxnList({txns,getCat,openM,delTxn,wallets}){
    const[filter,setFilter]=useState('all');const[q,setQ]=useState('');
    const filtered=useMemo(()=>{let f=txns;if(filter!=='all')f=f.filter(t=>t.type===filter);if(q.trim()){const s=q.toLowerCase();f=f.filter(t=>(t.note||'').toLowerCase().includes(s)||(t.category||'').toLowerCase().includes(s));}return f;},[txns,filter,q]);
    const grouped=useMemo(()=>{const g={};filtered.forEach(t=>{if(!g[t.date])g[t.date]=[];g[t.date].push(t)});return Object.entries(g).sort((a,b)=>b[0].localeCompare(a[0]))},[filtered]);
    const isEmpty = filtered.length === 0;

    return(
        <div className="space-y-4">
            <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-dark-400"><I.Search/></span><input type="text" placeholder="Cari berdasarkan catatan..." value={q} onChange={e=>setQ(e.target.value)} className="pl-10"/></div>
            <div className="flex gap-2 overflow-x-auto sb-hide">{[{id:'all',l:'Semua'},{id:'expense',l:'Keluar'},{id:'income',l:'Masuk'},{id:'transfer',l:'Transfer'}].map(f=>(<button key={f.id} onClick={()=>setFilter(f.id)} className={`px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap transition-all ${filter===f.id?'bg-blue-600 text-white':'bg-dark-700 text-dark-400'}`}>{f.l}</button>))}</div>
            
            {isEmpty ? (
                <div className="text-center py-12 relative">
                    <div className="w-16 h-16 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-400">
                        <I.Dollar />
                    </div>
                    <p className="text-dark-300 font-medium mb-1">{q.trim()?`Tidak ditemukan: "${q}"`:'Keuanganmu masih kosong'}</p>
                    <p className="text-dark-500 text-xs mb-6">Yuk, catat pemasukan atau pengeluaran pertamamu!</p>
                    <div className="absolute -bottom-10 left-1/2 -translate-x-4 opacity-50">
                        <svg width="40" height="60" viewBox="0 0 40 60" fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 4" strokeLinecap="round">
                            <path d="M 10 0 Q 30 20 20 50" />
                            <polyline points="10 40 20 50 30 45" />
                        </svg>
                    </div>
                </div>
            ) : (
                grouped.map(([date,items])=>(
                    <div key={date}>
                        <p className="text-dark-400 text-xs font-medium mb-2">{fmtD(date)}</p>
                        <div className="space-y-2">{items.map(t=>{
                            if(t.type==='transfer'){
                                const fromW=wallets.find(w=>w.id===t.transferFrom);
                                const toW=wallets.find(w=>w.id===t.transferTo);
                                return(<SwipeItem key={t.id} onDel={()=>delTxn(t.id)}><div className="p-3 flex items-center gap-3 ch" onClick={()=>openM('txnDetail',t)}><div className="w-8 h-8 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400"><I.Transfer/></div><div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">Transfer</p><p className="text-[10px] text-dark-400">{fromW?.name} → {toW?.name} -- {fmtT(t.createdAt)}</p></div><span className="text-sm font-bold text-blue-400">{fmtC(t.amount)}</span></div></SwipeItem>);
                            }

                            return(<SwipeItem key={t.id} onDel={()=>delTxn(t.id)}><div className="p-3 flex items-center gap-3 ch" onClick={()=>openM('txnDetail',t)}><CatBadge cat={cat}/><div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">{t.note||cat.name}</p><p className="text-[10px] text-dark-400 flex items-center gap-1">{cat.name}{t.isRecurring&&<span className="text-blue-400 flex items-center"><I.Repeat/></span>} -- {fmtT(t.createdAt)}</p></div><span className={`text-sm font-bold ${t.type==='income'?'text-green-400':'text-red-400'}`}>{t.type==='income'?'+':'-'}{fmtC(t.amount)}</span></div></SwipeItem>);
                        })}</div>
                    </div>
                ))
            )}
        </div>
    );
}

                const spent=catSpend[b.category]||0;const pct=b.limit>0?Math.min(100,(spent/b.limit)*100):0;
